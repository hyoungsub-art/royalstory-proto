<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>킹덤 크래프트 · 모바일 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10283d;color:#eff2e8;font:14px 'Malgun Gothic',sans-serif}header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid #4a718b;background:#173a54}h1{font-size:16px;margin:0 0 5px}p{font-size:11px;color:#bbd3df;margin:0;line-height:1.5}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select,a{min-height:44px;border:1px solid #729ab1;border-bottom:3px solid #0c293f;border-radius:8px;padding:8px 12px;color:#fff2c9;background:#2d5876;font:inherit}button,select{cursor:pointer}a{display:flex;align-items:center;text-decoration:none;font-size:12px}#stage{height:calc(100dvh - 83px);min-height:220px;overflow:auto;display:grid;align-items:start;justify-items:center;padding:14px}#frame-box{position:relative;box-shadow:0 0 0 3px #708b9a,0 10px 30px #06131f;border-radius:5px;background:#0b2234}iframe{display:block;border:0;transform-origin:top left;border-radius:5px}#status{display:block;font-size:11px;color:#c7e0e8;min-width:125px}@media(max-width:720px){header{padding:10px;gap:8px}#stage{height:calc(100dvh - 143px)}.tools{gap:5px}button,select,a{font-size:11px;padding:6px 8px}#status{min-width:90px}}
body{background:#dfe5d2;color:#517162}header{background:#f2efdd;border-color:#afbf9f}p{color:#7b8e73}button,select,a{background:#e6e8d2;color:#5d7b65;border:1px solid #adc09e;border-bottom-width:1px}#frame-box{background:#dce5d0;box-shadow:0 0 0 2px #a4b99b,0 8px 25px #50755e28}#status{color:#7a957b}body{background:#17252b;color:#d6dfd7}header{background:#22363d;border-color:#4a6264}p{color:#9eafa6}button,select,a{background:#30484f;color:#d7e0d5;border-color:#566e6e;border-radius:5px}#frame-box{background:#22363a;box-shadow:0 0 0 1px #576e68,0 8px 24px #0b161b55}#status{color:#a8bfb3}body{background:#352d20;color:#4e3822}header{background:linear-gradient(#f4e8ca,#dec99e);border-color:#927445}p{color:#7c6341}button,select,a{background:linear-gradient(#efdfba,#d1b783);color:#563a20;border-color:#a0804f;border-radius:3px}#frame-box{background:#383721;box-shadow:0 0 0 2px #a2814b,0 8px 24px #17120a66}#status{color:#7d5e33}</style></head><body><header><div><h1>모바일 화면에서 플레이</h1><p>건설·병력 지휘 버튼이 한 화면에 함께 보입니다. 화면을 회전해 비교할 수 있습니다.</p></div><div class="tools"><select id="size" aria-label="휴대폰 화면 크기"><option value="320x568">작은 화면 · 320×568</option><option value="360x640">기본 화면 · 360×640</option><option value="390x844" selected>일반 화면 · 390×844</option><option value="412x915">큰 화면 · 412×915</option></select><button id="rotate">화면 회전</button><button id="fit" aria-pressed="false">실제 크기</button><span id="status" aria-live="polite"></span><a href="./?preview=medieval-v8" target="_blank" rel="noopener">전체 화면으로 열기 ↗</a></div></header><main id="stage"><div id="frame-box"><iframe id="game" title="킹덤 크래프트 모바일 게임" src="./?preview=medieval-v8" width="390" height="844" allow="autoplay"></iframe></div></main><script>
const size=document.getElementById('size'),stage=document.getElementById('stage'),box=document.getElementById('frame-box'),game=document.getElementById('game'),fit=document.getElementById('fit');
let rotated=false,actual=false;
function resize(){let[w,h]=size.value.split('x').map(Number);if(rotated)[w,h]=[h,w];const scale=actual?1:Math.min(1,(stage.clientWidth-32)/w,(stage.clientHeight-32)/h);game.style.width=w+'px';game.style.height=h+'px';game.style.transform='scale('+Math.max(.1,scale)+')';box.style.width=w*scale+'px';box.style.height=h*scale+'px';document.getElementById('status').textContent=w+'×'+h+' · '+(w>h?'가로':'세로');fit.ariaPressed=String(actual);fit.textContent=actual?'화면에 맞추기':'실제 크기';}
size.addEventListener('change',resize);document.getElementById('rotate').addEventListener('click',()=>{rotated=!rotated;resize()});fit.addEventListener('click',()=>{actual=!actual;resize()});window.addEventListener('resize',resize);resize();
</script></body></html>
