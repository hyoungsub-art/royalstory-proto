<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>킹덤 크래프트 · 아트 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102b43;color:#fff1cc;font:15px 'Malgun Gothic',sans-serif}main{max-width:1180px;margin:0 auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0 0 10px}p{color:#b4cddd;line-height:1.7}a{color:#fff0ba;text-decoration:none;background:#2b5e81;border:1px solid #83a9bc;border-bottom:4px solid #173e59;padding:12px 18px;border-radius:10px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:14px;margin:24px 0}.card{background:linear-gradient(#2d526a,#1b3a52);border:1px solid #6a90a2;border-radius:14px;text-align:center;padding:12px}.card canvas{width:100%;max-width:230px;display:block;aspect-ratio:1;object-fit:contain;margin:0 auto;border-radius:9px;background:#75a558 url('assets/royal/grass-terrain.png') center/260px}.label{font-weight:700;margin:12px 0 4px}.note{font-size:11px;color:#b4cddd}h2{margin-top:34px;font-size:18px}.units{grid-template-columns:repeat(auto-fit,minmax(166px,1fr))}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}main{padding:24px 14px}}
</style></head><body><main><header><div><h1>킹덤 크래프트 · 아트 미리보기</h1><p>같은 전장 위에서 건물과 병종의 형태·재질·진영색을 비교합니다.</p></div><a href="./">게임 플레이 →</a></header><h2>건물 · 본진 성장</h2><div id="buildings" class="grid"></div><h2>유닛 · 이동과 공격</h2><div id="units" class="grid units"></div><p>파랑은 내 진영, 빨강은 상대 진영입니다. 실제 전투에서도 같은 렌더러를 사용합니다.</p></main><script src="royal-art.js"></script><script>
const names={hall:'타운 홀',elixirBase:'골드 광산',barracks:'배럭',archery:'아처리',assaultBarracks:'강습 배럭',workshop:'워크숍',sanctum:'생텀',tower:'거점',guardTower:'가드 타워',arcaneTower:'아케인 타워'};
const samples=[...Object.keys(names).map(key=>({key,tier:1})),{key:'hall',tier:2},{key:'hall',tier:3}];
function card(parent,title,note){const box=document.createElement('div');box.className='card';const cv=document.createElement('canvas');cv.width=460;cv.height=400;box.appendChild(cv);const label=document.createElement('div');label.className='label';label.textContent=title;box.appendChild(label);const n=document.createElement('div');n.className='note';n.textContent=note;box.appendChild(n);document.getElementById(parent).appendChild(box);return cv.getContext('2d')}
samples.forEach(({key,tier})=>{const c=card('buildings',key==='hall'?['','타운 홀','킵','캐슬'][tier]:names[key],'석재 · 목재 · 진영색 지붕');c.scale(2,2);const w=key==='workshop'?160:140;RoyalArt.drawBuilding(c,key,3,(230-w)/2,39,w,140,'player',tier,true)});
const units=[['footman','풋맨'],['cavalry','기병'],['archer','아처'],['ram','공성추'],['mage','메이지']].map(([key,nm])=>({key,c:card('units',nm,'이동 · 병종별 무기와 공격 동작')}));
function animate(ts){units.forEach(({key,c})=>{c.clearRect(0,0,460,400);[true,false].forEach((team,i)=>{c.save();c.translate(125+i*205,232);c.scale(4.2,4.2);RoyalArt.drawUnit(c,{key,r:key==='ram'?13:11,side:team?'player':'enemy',dir8:(Math.floor(ts/2200)+(team?0:4))%8,moving:true,vel:1,spd:1,gait:ts/180,animT:ts/100,swing:Math.max(0,Math.sin(ts/380)),head:0},team,-Math.abs(Math.cos(ts/180)));c.restore()})});requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
