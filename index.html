  bloodMage:(r,t,s,u)=>sprMage(r,t,s,u,"#c03030","#8a1f1f"),
  skyMage:(r,t,s,u)=>sprMage(r,t,s,u,"#3a9ad9","#2a6fa8")};

/* --- 건물 스프라이트 --- 색 = 진영, 형태 = 기능 (2026-08-30 아트 규칙) --- */
const TEAM_COL={player:{main:"#3f74d8",dark:"#26437f",light:"#84aaf0"},
                enemy: {main:"#d8493d",dark:"#8f2a23",light:"#f0928a"}};
const CREAM="#f4f1e6", STONE="#c9c6b6", DARKGRAY="#463d47", GOLD="#ffcf3f";
function drawBuildingSprite(key,level,px,py,pw,ph,side,tierNow){
  const lw=2, team=side==="player";
  const T=TEAM_COL[team?"player":"enemy"];
  const c1=T.main;
  /* 기단: 중립 석재 + 진영색 테두리 띠 (전 건물 공통 — 진영 식별) */
  ctx.fillStyle=STONE;roundRectPath(px+2,py+ph*0.55,pw-4,ph*0.42,6);ctx.fill();po(lw);
  ctx.fillStyle=T.dark;roundRectPath(px+2,py+ph*0.86,pw-4,ph*0.11,4);ctx.fill();po(lw*0.7);
  const bx=px+pw*0.12,by=py+ph*0.18,bw=pw*0.76,bh=ph*0.55;
  switch(key){
    case "hall":{
      /* 티어별 외형 진화: 1 타운 홀(단층) → 2 킵(2층 증축) → 3 캐슬(대탑+금관). 강등 시 외형도 하락 */
      const t=tierNow||1, cx=px+pw/2;
      ctx.fillStyle=T.main;roundRectPath(bx,by,bw,bh+ph*0.05,8);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.62,by,bw*0.38,bh+ph*0.05,8);ctx.fill();   // 그늘 면
      if(t===1){
        /* 타운 홀: 총안 4개 + 목재 대문 */
        ctx.fillStyle=CREAM;
        for(let i=0;i<4;i++){roundRectPath(bx+bw*(0.04+i*0.26),by-ph*0.13,bw*0.14,ph*0.14,2);ctx.fill();po(lw*0.7);}
        ctx.fillStyle="#8a5a28";
        ctx.beginPath();ctx.arc(cx,by+bh*0.5,pw*0.1,Math.PI,0);ctx.fill();
        ctx.fillRect(cx-pw*0.1,by+bh*0.5,pw*0.2,bh*0.55);
        ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.7;
        ctx.strokeRect(cx-pw*0.1,by+bh*0.5,pw*0.2,bh*0.55);
        ctx.beginPath();ctx.moveTo(cx,by+bh*0.5);ctx.lineTo(cx,by+bh*1.05);ctx.stroke();
      } else if(t===2){
        /* 킵: 중앙 2층 증축 + 상층 총안 + 진영 배너 */
        ctx.fillStyle=CREAM;roundRectPath(cx-bw*0.26,by-ph*0.3,bw*0.52,ph*0.36,4);ctx.fill();po(lw);
        ctx.fillStyle=CREAM;
        for(let i=0;i<3;i++){roundRectPath(cx-bw*0.26+bw*0.52*(0.04+i*0.36),by-ph*0.42,bw*0.115,ph*0.13,2);ctx.fill();po(lw*0.7);}
        for(let i=0;i<2;i++){roundRectPath(bx+bw*(0.04+i*0.78),by-ph*0.13,bw*0.14,ph*0.14,2);ctx.fill();po(lw*0.7);}
        ctx.fillStyle=c1;roundRectPath(cx-bw*0.07,by-ph*0.24,bw*0.14,ph*0.3,3);ctx.fill();po(lw*0.7);
        ctx.fillStyle="#4a4048";ctx.beginPath();ctx.arc(cx,by+bh*0.55,pw*0.09,Math.PI,0);ctx.fill();
        ctx.fillRect(cx-pw*0.09,by+bh*0.55,pw*0.18,bh*0.5);
      } else {
        /* 캐슬: 좌우 대탑 + 진영색 원뿔 + 중앙 2층 + 금관 */
        ctx.fillStyle=CREAM;
        roundRectPath(bx-pw*0.04,by-ph*0.28,bw*0.22,bh+ph*0.36,4);ctx.fill();po(lw);
        roundRectPath(bx+bw-bw*0.22+pw*0.04,by-ph*0.28,bw*0.22,bh+ph*0.36,4);ctx.fill();po(lw);
        ctx.fillStyle=c1;
        [bx-pw*0.04+bw*0.11, bx+bw-bw*0.11+pw*0.04].forEach(tx=>{
          ctx.beginPath();ctx.moveTo(tx-bw*0.16,by-ph*0.27);ctx.lineTo(tx+bw*0.16,by-ph*0.27);ctx.lineTo(tx,by-ph*0.5);ctx.closePath();ctx.fill();po(lw*0.8);});
        ctx.fillStyle=CREAM;roundRectPath(cx-bw*0.24,by-ph*0.24,bw*0.48,ph*0.3,4);ctx.fill();po(lw);
        ctx.fillStyle="#ffcf3f";
        ctx.beginPath();ctx.moveTo(cx-pw*0.15,by-ph*0.26);ctx.lineTo(cx-pw*0.11,by-ph*0.46);ctx.lineTo(cx-pw*0.04,by-ph*0.32);
        ctx.lineTo(cx,by-ph*0.5);ctx.lineTo(cx+pw*0.04,by-ph*0.32);ctx.lineTo(cx+pw*0.11,by-ph*0.46);ctx.lineTo(cx+pw*0.15,by-ph*0.26);ctx.closePath();ctx.fill();po(lw);
        ctx.fillStyle="#4a4048";ctx.beginPath();ctx.arc(cx,by+bh*0.55,pw*0.09,Math.PI,0);ctx.fill();
        ctx.fillRect(cx-pw*0.09,by+bh*0.55,pw*0.18,bh*0.5);
      }
      /* 티어 배너 (로마자) — 공통 */
      ctx.fillStyle=c1;roundRectPath(bx+bw*0.02,by+bh*0.15,bw*0.14,bh*0.65,3);ctx.fill();po(lw*0.7);
      ctx.fillStyle="#fff";ctx.font="bold "+Math.round(ph*0.15)+"px sans-serif";ctx.textAlign="center";
      ctx.fillText("I".repeat(t),bx+bw*0.09,by+bh*0.6);
      break;}
    case "elixirBase":{
      /* 형태: 낮은 받침 + 큰 마름모 크리스탈 (다이아몬드 실루엣) */
      ctx.fillStyle=T.main;roundRectPath(bx,by+bh*0.42,bw,bh*0.58,6);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.1,by+bh*0.42,bw*0.8,bh*0.14,3);ctx.fill();po(lw*0.7);
      ctx.fillStyle="#c86bfa";
      ctx.beginPath();ctx.moveTo(px+pw/2,by-ph*0.2);ctx.lineTo(px+pw*0.72,by+bh*0.36);ctx.lineTo(px+pw/2,by+bh*0.8);ctx.lineTo(px+pw*0.28,by+bh*0.36);ctx.closePath();ctx.fill();po(lw);
      ctx.fillStyle="#e8b3ff";ctx.beginPath();ctx.moveTo(px+pw/2,by-ph*0.08);ctx.lineTo(px+pw*0.6,by+bh*0.3);ctx.lineTo(px+pw/2,by+bh*0.5);ctx.closePath();ctx.fill();
      break;}
    case "shooterGarden":{
      /* 형태: 야외 사격장 — 낮은 담장 + 나란한 원형 과녁 2기 + 화살 다발 (텐트 계열과 무관) */
      ctx.fillStyle=T.main;roundRectPath(bx,by+bh*0.5,bw,bh*0.5,4);ctx.fill();po(lw);   // 낮고 넓은 담장
      ctx.fillStyle=T.dark;roundRectPath(bx,by+bh*0.5,bw,bh*0.16,3);ctx.fill();po(lw*0.7);
      ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.6;   // 담장 결
      for(let i=1;i<4;i++){const lx=bx+bw*i/4;ctx.beginPath();ctx.moveTo(lx,by+bh*0.66);ctx.lineTo(lx,by+bh);ctx.stroke();}
      /* 과녁 2기 (지지대 + 동심원) */
      [[0.3,0.9],[0.7,1.05]].forEach(([fx,sc])=>{
        const tcx=bx+bw*fx, tcy=by+bh*0.18, tr=bw*0.19*sc;
        ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.9;   // 다리
        ctx.beginPath();ctx.moveTo(tcx-tr*0.5,by+bh*0.62);ctx.lineTo(tcx,tcy+tr*0.6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(tcx+tr*0.5,by+bh*0.62);ctx.lineTo(tcx,tcy+tr*0.6);ctx.stroke();
        ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(tcx,tcy,tr,0,7);ctx.fill();po(lw);
        ctx.fillStyle=T.main;ctx.beginPath();ctx.arc(tcx,tcy,tr*0.62,0,7);ctx.fill();
        ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(tcx,tcy,tr*0.32,0,7);ctx.fill();
        ctx.fillStyle=T.dark;ctx.beginPath();ctx.arc(tcx,tcy,tr*0.14,0,7);ctx.fill();
      });
      /* 화살 다발 (우측) */
      ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.7;
      for(let i=-1;i<=1;i++){
        ctx.beginPath();ctx.moveTo(bx+bw*0.93+i*3,by+bh*0.5);ctx.lineTo(bx+bw*0.93+i*4.5,by+bh*0.08);ctx.stroke();
        ctx.fillStyle=CREAM;
        ctx.beginPath();ctx.arc(bx+bw*0.93+i*4.5,by+bh*0.06,2.2,0,7);ctx.fill();
      }
      break;}
    case "barracks":{
      /* 형태: 사각 텐트 (수직 벽 + 마룻대 지붕 + 입구 플랩 + 버팀줄) */
      const isSG=false;
      const tw2=bw+pw*0.04, tx2=bx-pw*0.02;
      const topY=by+ph*0.06, botY=by+bh;
      /* 버팀줄 + 말뚝 */
      ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.7;
      ctx.beginPath();ctx.moveTo(tx2+tw2*0.06,topY+ph*0.02);ctx.lineTo(tx2-pw*0.06,botY);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx2+tw2*0.94,topY+ph*0.02);ctx.lineTo(tx2+tw2+pw*0.06,botY);ctx.stroke();
      /* 텐트 몸통 (사각) */
      ctx.fillStyle=T.main;roundRectPath(tx2,topY,tw2,botY-topY,pw*0.05);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;   // 그늘 면 (오른쪽)
      ctx.save();ctx.beginPath();roundRectPath(tx2,topY,tw2,botY-topY,pw*0.05);ctx.clip();
      ctx.fillRect(tx2+tw2*0.64,topY,tw2*0.36,botY-topY);ctx.restore();
      /* 마룻대 (지붕 능선) */
      ctx.fillStyle=T.dark;roundRectPath(tx2-pw*0.04,topY-ph*0.09,tw2+pw*0.08,ph*0.11,pw*0.03);ctx.fill();po(lw);
      ctx.fillStyle=CREAM;roundRectPath(tx2-pw*0.04,topY-ph*0.09,tw2+pw*0.08,ph*0.035,pw*0.02);ctx.fill();
      /* 입구 플랩 (사다리꼴) */
      const cxT=tx2+tw2/2;
      ctx.fillStyle=DARKGRAY;
      ctx.beginPath();ctx.moveTo(cxT-tw2*0.17,botY);ctx.lineTo(cxT-tw2*0.1,topY+ (botY-topY)*0.35);
      ctx.lineTo(cxT+tw2*0.1,topY+(botY-topY)*0.35);ctx.lineTo(cxT+tw2*0.17,botY);ctx.closePath();ctx.fill();po(lw*0.8);
      if(!isSG){
        ctx.strokeStyle=CREAM;ctx.lineWidth=lw*1.1;   // 교차 검 문장
        ctx.beginPath();ctx.moveTo(cxT-tw2*0.14,topY+ph*0.05);ctx.lineTo(cxT+tw2*0.14,topY+ph*0.19);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cxT+tw2*0.14,topY+ph*0.05);ctx.lineTo(cxT-tw2*0.14,topY+ph*0.19);ctx.stroke();
      } else {
        /* 관측 망대 (형태 차이) */
        ctx.fillStyle=CREAM;roundRectPath(px+pw*0.74,by-ph*0.34,pw*0.16,bh+ph*0.34,3);ctx.fill();po(lw);
        ctx.fillStyle=T.dark;roundRectPath(px+pw*0.68,by-ph*0.44,pw*0.28,ph*0.14,3);ctx.fill();po(lw*0.8);
        ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(cxT,topY+ph*0.12,pw*0.055,0,7);ctx.fill();po(lw*0.7);   // 과녁
        ctx.fillStyle=T.dark;ctx.beginPath();ctx.arc(cxT,topY+ph*0.12,pw*0.026,0,7);ctx.fill();
      }
      break;}
    case "knightHall":{
      /* 형태: 배럭(사각 텐트)의 강화판 — 박공 지붕 홀 + 좌우 랜스 + 금 방패 (본진과 구분: 탑·총안 없음) */
      const cxK=px+pw/2, hy=by+ph*0.14, hh=bh+ph*0.02;
      ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.8;   // 좌우 랜스(창)
      [[-1],[1]].forEach(([s])=>{
        ctx.beginPath();ctx.moveTo(cxK+s*bw*0.52,by+bh);ctx.lineTo(cxK+s*bw*0.52,by-ph*0.16);ctx.stroke();
        ctx.fillStyle=CREAM;
        ctx.beginPath();ctx.moveTo(cxK+s*bw*0.52,by-ph*0.28);ctx.lineTo(cxK+s*bw*0.56,by-ph*0.14);
        ctx.lineTo(cxK+s*bw*0.48,by-ph*0.14);ctx.closePath();ctx.fill();po(lw*0.7);});
      ctx.fillStyle=T.main;roundRectPath(bx+bw*0.04,hy,bw*0.92,hh-ph*0.12,4);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;   // 그늘 면
      ctx.save();ctx.beginPath();roundRectPath(bx+bw*0.04,hy,bw*0.92,hh-ph*0.12,4);ctx.clip();
      ctx.fillRect(cxK+bw*0.16,hy,bw*0.32,hh);ctx.restore();
      ctx.fillStyle=T.dark;   // 박공 지붕
      ctx.beginPath();ctx.moveTo(bx-pw*0.02,hy+ph*0.03);ctx.lineTo(bx+bw+pw*0.02,hy+ph*0.03);
      ctx.lineTo(cxK,hy-ph*0.16);ctx.closePath();ctx.fill();po(lw);
      ctx.fillStyle=CREAM;roundRectPath(bx-pw*0.02,hy+ph*0.01,bw+pw*0.04,ph*0.05,2);ctx.fill();po(lw*0.7);
      ctx.fillStyle=DARKGRAY;   // 문
      ctx.beginPath();ctx.arc(cxK,hy+hh*0.42,bw*0.12,Math.PI,0);ctx.fill();
      ctx.fillRect(cxK-bw*0.12,hy+hh*0.42,bw*0.24,hh*0.5);po(lw*0.8);
      ctx.fillStyle=GOLD;   // 금 방패 문장
      ctx.beginPath();ctx.moveTo(cxK,hy+hh*0.1);ctx.lineTo(cxK+bw*0.13,hy+hh*0.2);
      ctx.lineTo(cxK,hy+hh*0.42);ctx.lineTo(cxK-bw*0.13,hy+hh*0.2);ctx.closePath();ctx.fill();po(lw*0.8);
      break;}
    case "archery":{
      /* 형태: 궁수 컨셉 — 큰 활 아치 + 시위 + 화살 (활 실루엣) */
      const cxA=px+pw/2, ay=by+bh*0.45;
      ctx.fillStyle=T.main;roundRectPath(bx+bw*0.06,by+bh*0.5,bw*0.88,bh*0.5,4);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.06,by+bh*0.5,bw*0.88,bh*0.15,3);ctx.fill();po(lw*0.7);
      /* 큰 활 (아치) */
      ctx.strokeStyle="#8a5a28";ctx.lineWidth=lw*2.6;
      ctx.beginPath();ctx.arc(cxA,ay,bw*0.42,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
      ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.6;
      ctx.beginPath();ctx.arc(cxA,ay,bw*0.42,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
      /* 시위 */
      const bx1=cxA+Math.cos(Math.PI*1.15)*bw*0.42, by1=ay+Math.sin(Math.PI*1.15)*bw*0.42;
      const bx2=cxA+Math.cos(Math.PI*1.85)*bw*0.42, by2=ay+Math.sin(Math.PI*1.85)*bw*0.42;
      ctx.strokeStyle=CREAM;ctx.lineWidth=lw*0.9;
      ctx.beginPath();ctx.moveTo(bx1,by1);ctx.lineTo(bx2,by2);ctx.stroke();
      /* 화살 (활에 메긴) */
      ctx.strokeStyle="#8a5a28";ctx.lineWidth=lw*1.1;
      ctx.beginPath();ctx.moveTo(cxA,ay-bw*0.06);ctx.lineTo(cxA,ay-bw*0.55);ctx.stroke();
      ctx.fillStyle=CREAM;
      ctx.beginPath();ctx.moveTo(cxA,ay-bw*0.66);ctx.lineTo(cxA-bw*0.07,ay-bw*0.48);
      ctx.lineTo(cxA+bw*0.07,ay-bw*0.48);ctx.closePath();ctx.fill();po(lw*0.7);
      /* 화살통 */
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.72,by+bh*0.55,bw*0.16,bh*0.4,3);ctx.fill();po(lw*0.8);
      ctx.fillStyle=CREAM;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(bx+bw*0.8+i*3.5,by+bh*0.53,2,0,7);ctx.fill();}
      break;}
    case "blacksmith":{
      ctx.fillStyle="#8a8078";roundRectPath(bx,by+bh*0.2,bw,bh*0.8,5);ctx.fill();po(lw);
      ctx.fillStyle="#5a5048";roundRectPath(bx+bw*0.6,by-ph*0.12,bw*0.2,bh*0.45,3);ctx.fill();po(lw*0.8);   // 굴뚝
      ctx.fillStyle="#3a3f45";roundRectPath(bx+bw*0.15,by+bh*0.5,bw*0.35,bh*0.22,3);ctx.fill();po(lw*0.8);  // 모루
      ctx.fillStyle="#ff9c3a";ctx.beginPath();ctx.arc(bx+bw*0.32,by+bh*0.42,bw*0.08,0,7);ctx.fill();
      break;}
    case "workshop":{
      /* 형태: 낮고 넓은 공방 + 굴뚝 + 큰 기어 (톱니 실루엣) */
      ctx.fillStyle=T.main;roundRectPath(bx,by+bh*0.15,bw,bh*0.85,5);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.62,by-ph*0.16,bw*0.2,bh*0.5,3);ctx.fill();po(lw*0.8);   // 굴뚝
      ctx.fillStyle="rgba(120,120,120,.55)";
      ctx.beginPath();ctx.arc(bx+bw*0.72,by-ph*0.22,pw*0.05,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(bx+bw*0.78,by-ph*0.31,pw*0.035,0,7);ctx.fill();
      ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(px+pw*0.42,by+bh*0.55,bw*0.22,0,7);ctx.fill();po(lw);   // 기어
      for(let i=0;i<6;i++){const a=i*Math.PI/3;
        ctx.save();ctx.translate(px+pw*0.42+Math.cos(a)*bw*0.24,by+bh*0.55+Math.sin(a)*bw*0.24);ctx.rotate(a);
        ctx.fillStyle=CREAM;roundRectPath(-bw*0.05,-bw*0.05,bw*0.1,bw*0.1,2);ctx.fill();po(lw*0.6);ctx.restore();}
      ctx.fillStyle=T.dark;ctx.beginPath();ctx.arc(px+pw*0.42,by+bh*0.55,bw*0.08,0,7);ctx.fill();po(lw*0.7);
      break;}
    case "sanctum":{
      /* 형태: 마법 구슬 지붕 — 큰 오브를 얹은 탑 (삼각 지붕 없음) */
      const cx0=px+pw/2, orbR=bw*0.34, orbY=by+ph*0.02;
      ctx.fillStyle=T.main;roundRectPath(bx+bw*0.14,by+bh*0.3,bw*0.72,bh*0.7,5);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;   // 그늘 면
      ctx.save();ctx.beginPath();roundRectPath(bx+bw*0.14,by+bh*0.3,bw*0.72,bh*0.7,5);ctx.clip();
      ctx.fillRect(cx0+bw*0.12,by+bh*0.3,bw*0.3,bh*0.7);ctx.restore();
      ctx.fillStyle=GOLD;roundRectPath(bx+bw*0.08,by+bh*0.28,bw*0.84,bh*0.11,3);ctx.fill();po(lw*0.7);   // 받침 링
      /* 오브 받침 (진영색 초승달 홀더) */
      ctx.fillStyle=T.dark;
      ctx.beginPath();ctx.arc(cx0,orbY+orbR*0.55,orbR*0.95,Math.PI*0.15,Math.PI*0.85);ctx.closePath();ctx.fill();po(lw*0.8);
      /* 마법 구슬 */
      ctx.fillStyle="#b06bfa";ctx.beginPath();ctx.arc(cx0,orbY,orbR,0,7);ctx.fill();po(lw);
      ctx.fillStyle="#e0b3ff";ctx.beginPath();ctx.arc(cx0-orbR*0.3,orbY-orbR*0.32,orbR*0.42,0,7);ctx.fill();   // 하이라이트
      ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(cx0-orbR*0.42,orbY-orbR*0.45,orbR*0.16,0,7);ctx.fill();
      /* 주위 반짝임 */
      ctx.fillStyle="#e8b3ff";
      [[-1.25,-0.35],[1.25,-0.2],[0,-1.45]].forEach(([dx,dy])=>{
        ctx.beginPath();ctx.arc(cx0+orbR*dx,orbY+orbR*dy,2.2,0,7);ctx.fill();});
      /* 룬 문 */
      ctx.fillStyle=DARKGRAY;
      ctx.beginPath();ctx.arc(cx0,by+bh*0.74,bw*0.11,Math.PI,0);ctx.fill();
      ctx.fillRect(cx0-bw*0.11,by+bh*0.74,bw*0.22,bh*0.26);
      break;}
    case "tower": case "guardTower": case "arcaneTower":{
      /* 세로로 솟은 망루 (풋프린트 위로 연장) */
      /* 형태: 세로 망루. 기본은 낮은 목조 망루, 상위 변형은 높은 석조 */
      const isBase=key==="tower";
      const shaftW=bw*0.52, sx=px+pw/2-shaftW/2;
      const topY=by+(isBase?-ph*0.16:-ph*0.5), botY=by+bh;
      ctx.fillStyle=T.main;roundRectPath(sx,topY,shaftW,botY-topY,4);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(sx+shaftW*0.6,topY,shaftW*0.4,botY-topY,4);ctx.fill();   // 그늘 면
      if(isBase){
        /* 낮은 티어: 목조 X 버팀대만 (석재 밴드·총안 없음) */
        ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.8;
        ctx.beginPath();ctx.moveTo(sx+2,botY-ph*0.02);ctx.lineTo(sx+shaftW-2,topY+(botY-topY)*0.45);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx+shaftW-2,botY-ph*0.02);ctx.lineTo(sx+2,topY+(botY-topY)*0.45);ctx.stroke();
      } else {
        ctx.fillStyle=CREAM;   // 석재 밴드 (상위 변형)
        roundRectPath(sx-2,topY+(botY-topY)*0.45,shaftW+4,ph*0.1,2);ctx.fill();po(lw*0.7);
        ctx.fillStyle=DARKGRAY;roundRectPath(px+pw/2-2.5,topY+ph*0.24,5,ph*0.16,2);ctx.fill();   // 화살구멍
      }
      if(key==="guardTower"){
        /* 형태 차이: 넓은 중무장 총안 상판 */
        const capW=shaftW+bw*0.3;
        ctx.fillStyle=CREAM;roundRectPath(px+pw/2-capW/2,topY-ph*0.12,capW,ph*0.15,3);ctx.fill();po(lw);
        for(let i=0;i<3;i++){ctx.fillStyle=T.dark;
          roundRectPath(px+pw/2-capW/2+capW*(0.06+i*0.36),topY-ph*0.27,capW*0.2,ph*0.16,2);ctx.fill();po(lw*0.7);}
      } else if(key==="arcaneTower"){
        /* 형태 차이: 마법 구슬 지붕 — 발톱 홀더에 물린 큰 오브 (삼각 첨탑 없음) */
        const cxT=px+pw/2, oR=bw*0.24, oY=topY-ph*0.16;
        ctx.fillStyle=T.dark;   // 발톱 홀더
        for(let i=-1;i<=1;i+=2){
          ctx.beginPath();ctx.moveTo(cxT+i*oR*0.95,topY+ph*0.02);
          ctx.quadraticCurveTo(cxT+i*oR*1.35,oY,cxT+i*oR*0.55,oY-oR*0.75);
          ctx.lineTo(cxT+i*oR*0.2,oY-oR*0.2);ctx.closePath();ctx.fill();po(lw*0.8);}
        ctx.fillStyle=T.dark;roundRectPath(cxT-oR*1.05,topY-ph*0.02,oR*2.1,ph*0.06,3);ctx.fill();po(lw*0.8);
        ctx.fillStyle="#b06bfa";ctx.beginPath();ctx.arc(cxT,oY,oR,0,7);ctx.fill();po(lw);
        ctx.fillStyle="#e0b3ff";ctx.beginPath();ctx.arc(cxT-oR*0.3,oY-oR*0.32,oR*0.42,0,7);ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(cxT-oR*0.42,oY-oR*0.46,oR*0.16,0,7);ctx.fill();
      } else {
        /* 기본(낮은 티어): 단순 판자 지붕 + 작은 진영 깃발 */
        ctx.fillStyle=T.dark;
        ctx.beginPath();ctx.moveTo(sx-pw*0.06,topY+ph*0.02);ctx.lineTo(sx+shaftW+pw*0.06,topY+ph*0.02);
        ctx.lineTo(sx+shaftW+pw*0.02,topY-ph*0.09);ctx.lineTo(sx-pw*0.02,topY-ph*0.09);ctx.closePath();ctx.fill();po(lw);
        ctx.strokeStyle=OUTLINE;ctx.lineWidth=lw*0.7;
        ctx.beginPath();ctx.moveTo(px+pw/2,topY-ph*0.09);ctx.lineTo(px+pw/2,topY-ph*0.26);ctx.stroke();
        ctx.fillStyle=T.main;
        ctx.beginPath();ctx.moveTo(px+pw/2,topY-ph*0.26);ctx.lineTo(px+pw/2+pw*0.16,topY-ph*0.21);
        ctx.lineTo(px+pw/2,topY-ph*0.16);ctx.closePath();ctx.fill();po(lw*0.7);
      }
      break;}
    case "aviary":{
      /* 형태: 아치 기둥 + 펼친 날개 (유일한 좌우 날개 실루엣) */
      ctx.fillStyle=T.main;roundRectPath(bx+bw*0.28,by+bh*0.1,bw*0.44,bh*0.9,5);ctx.fill();po(lw);
      ctx.fillStyle=CREAM;   // 펼친 날개
      ctx.beginPath();ctx.ellipse(bx+bw*0.14,by+bh*0.3,bw*0.3,bh*0.16,-0.35,0,7);ctx.fill();po(lw);
      ctx.beginPath();ctx.ellipse(bx+bw*0.86,by+bh*0.3,bw*0.3,bh*0.16,0.35,0,7);ctx.fill();po(lw);
      ctx.fillStyle=T.dark;roundRectPath(bx+bw*0.34,by+bh*0.55,bw*0.32,bh*0.16,3);ctx.fill();po(lw*0.7);
      ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(px+pw/2,by-ph*0.02,bw*0.15,0,7);ctx.fill();po(lw*0.8);   // 그리폰 두상
      ctx.fillStyle=GOLD;
      ctx.beginPath();ctx.moveTo(px+pw/2+bw*0.04,by-ph*0.03);ctx.lineTo(px+pw/2+bw*0.2,by+ph*0.01);ctx.lineTo(px+pw/2+bw*0.04,by+ph*0.05);ctx.closePath();ctx.fill();po(lw*0.6);
      ctx.fillStyle=OUTLINE;ctx.beginPath();ctx.arc(px+pw/2-bw*0.02,by-ph*0.04,pw*0.018,0,7);ctx.fill();
      break;}
  }
  /* 업그레이드 핍 */
  const dd=BAL.BUILDINGS[key];
  if(dd&&dd.prod&&level>1){
    ctx.fillStyle="#ffd24d";
    for(let i=0;i<level-1;i++){ctx.beginPath();ctx.arc(px+pw-8-i*10,py+8,3.5,0,7);ctx.fill();po(1);}
  }
}

/* --- 배경 캐시 --- */
let bgCache=null;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildBG(){
  bgCache=document.createElement("canvas");bgCache.width=W;bgCache.height=H;
  const c=bgCache.getContext("2d"),rnd=mulberry(42);
  c.fillStyle="#79c247";c.fillRect(0,0,W,H);
  c.fillStyle="rgba(0,45,0,.06)";
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if((x+y)%2)c.fillRect(x*TILE,y*TILE,TILE,TILE);
  for(let i=0;i<500;i++){c.fillStyle=rnd()<.5?"rgba(255,255,255,.05)":"rgba(0,60,0,.07)";c.fillRect(rnd()*W,rnd()*H,2,2);}
  /* 그리드 라인 (연하게) */
  c.strokeStyle="rgba(30,60,20,.12)";c.lineWidth=1;
  for(let x=0;x<=COLS;x++){c.beginPath();c.moveTo(x*TILE,0);c.lineTo(x*TILE,H);c.stroke();}
  for(let y=0;y<=ROWS;y++){c.beginPath();c.moveTo(0,y*TILE);c.lineTo(W,y*TILE);c.stroke();}
  /* 중앙 길 (본진↔본진, 건설 불가 통로) */
  const rd=BAL.ROAD;
  const rx=rd.x0*TILE, rw=(rd.x1-rd.x0+1)*TILE, ry2=rd.y0*TILE, rh2=(rd.y1-rd.y0+1)*TILE;
  c.fillStyle="#cdb27a"; c.fillRect(rx,ry2,rw,rh2);
  c.fillStyle="rgba(150,115,70,.45)";
  for(let i=0;i<60;i++){ c.beginPath(); c.ellipse(rx+rnd()*rw, ry2+rnd()*rh2, 2.5, 1.7, 0, 0, 7); c.fill(); }
  c.strokeStyle="rgba(120,90,50,.7)"; c.lineWidth=2;
  c.beginPath(); c.moveTo(rx+1,ry2); c.lineTo(rx+1,ry2+rh2); c.stroke();
  c.beginPath(); c.moveTo(rx+rw-1,ry2); c.lineTo(rx+rw-1,ry2+rh2); c.stroke();
  /* 가스 타일 */
  BAL.GAS_ZONES.forEach(([gx,gy])=>{
    c.fillStyle="rgba(160,90,220,.28)";
    c.fillRect(gx*TILE,gy*TILE,2*TILE,2*TILE);
    c.strokeStyle="rgba(120,50,180,.7)";c.lineWidth=2;
    c.strokeRect(gx*TILE+2,gy*TILE+2,2*TILE-4,2*TILE-4);
    /* 크리스탈 */
    const cx=(gx+1)*TILE,cy=(gy+1)*TILE;
    c.fillStyle="#c86bfa";
    c.beginPath();c.moveTo(cx,cy-12);c.lineTo(cx+9,cy);c.lineTo(cx,cy+12);c.lineTo(cx-9,cy);c.closePath();c.fill();
    c.strokeStyle="#2e2a33";c.lineWidth=1.6;c.stroke();
    c.fillStyle="#e8b3ff";c.beginPath();c.moveTo(cx,cy-8);c.lineTo(cx+5,cy-1);c.lineTo(cx,cy+2);c.closePath();c.fill();
  });
  c.strokeStyle="rgba(40,85,15,.6)";c.lineWidth=6;c.strokeRect(3,3,W-6,H-6);
}

/* --- 메인 draw --- */
function draw(){
  ctx.save();
  if(S.shake>0.3)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  if(!bgCache)buildBG();
  ctx.drawImage(bgCache,0,0);
  /* 드래그 중: 영역 표시 */
  if(S.sel){
    for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
      const fz=inFriendlyZone(tx,ty,"player"), ex=inEnemyExclusion(tx,ty,"player");
      if(S.sel.type==="build"){
        if(fz&&!ex){ctx.fillStyle="rgba(120,200,255,.13)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
        if(ex&&fz){ctx.fillStyle="rgba(255,80,80,.14)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
      } else if(fz){ctx.fillStyle="rgba(140,255,160,.12)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
    }
  }
  /* 건물 (y 정렬 — 아래쪽 건물이 위쪽 건물의 솟은 부분을 가리도록) */
  [...S.buildings].sort((a,b)=>(a.ty+a.h)-(b.ty+b.h)).forEach(b=>{
    const px=b.tx*TILE,py=b.ty*TILE,pw=b.w*TILE,ph=b.h*TILE;
    if(b.hp<=0){ /* 잔해 */
      ctx.fillStyle="#9a978a";
      ctx.beginPath();ctx.ellipse(b.cx,b.cy,pw*0.3,ph*0.2,0,0,7);ctx.fill();po(1.6);
      ctx.fillStyle="#b5b2a4";ctx.beginPath();ctx.arc(b.cx-8,b.cy-4,7,0,7);ctx.fill();po(1.2);
      return;}
    drawBuildingSprite(b.key,b.level,px,py,pw,ph,b.side,effTier(b.side));
    if(S.selBld===b){ctx.strokeStyle="rgba(255,210,80,.95)";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
      ctx.strokeRect(px+1,py+1,pw-2,ph-2);ctx.setLineDash([]);
      const d=BAL.BUILDINGS[b.key];
      const atkRng=d.atk?d.atk.rng:(d.hAtk?d.hAtk.rng:0);
      if(atkRng){ctx.strokeStyle="rgba(255,120,80,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.cx,b.cy,atkRng*TILE,0,7);ctx.stroke();}
    }
    if(b.flash>0){ctx.fillStyle="rgba(255,255,255,"+Math.min(0.7,b.flash*5).toFixed(2)+")";
      roundRectPath(px+2,py+2,pw-4,ph-4,6);ctx.fill();}
    if(b.hp<b.maxHp)drawHpBar(b.cx,py-8,b.hp,b.maxHp,Math.min(50,pw-8),b.side);
  });
  /* 유닛 (y 정렬) */
  [...S.units].sort((a,b)=>a.y-b.y).forEach(u=>{
    const team=u.side==="player";
    const hover=u.air?Math.sin((u.animT||0)*0.8)*2-10:0;
    const dropY=u.deploy>0?-u.deploy*90:0;
    const bob=u.air?0:(u.moving?Math.sin(u.animT)*1.6:Math.sin(u.animT*0.35)*0.6);
    unitShadow(u.x,u.y+u.r*0.75,u.r*0.9*(u.deploy>0?0.5:1));
    ctx.strokeStyle=team?"rgba(60,130,255,.5)":"rgba(255,80,60,.5)";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*0.75,u.r*0.9,u.r*0.38,0,0,7);ctx.stroke();
    ctx.save();
    ctx.globalAlpha=u.deploy>0?0.85:1;
    ctx.translate(u.x,u.y+bob+hover+dropY);
    if(u.moving&&!u.air)ctx.rotate(Math.sin(u.animT)*0.05);
    ctx.scale(u.fx||1,1);
    const fn=u.hero?SPRH[u.key]:SPRU[u.key];
    if(fn)fn(u.r,team,u.swing||0,u);
    ctx.restore();
    ctx.globalAlpha=1;
    if(u.hero){ /* 영웅 표식 + 오라 범위 */
      ctx.fillStyle="#ffd24d";ctx.font="bold "+Math.round(u.r*0.9)+"px sans-serif";ctx.textAlign="center";
      ctx.fillText("★",u.x,u.y-u.r-8+dropY+hover);
      if(u.aura||u.heal){ctx.strokeStyle=u.heal?"rgba(140,255,160,.35)":"rgba(255,210,80,.3)";ctx.lineWidth=1.5;
        ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(u.x,u.y,BAL.AURA_R*TILE,0,7);ctx.stroke();ctx.setLineDash([]);}
    }
    if(u.flash>0){ctx.fillStyle="rgba(255,255,255,"+Math.min(0.75,u.flash*5).toFixed(2)+")";
      ctx.beginPath();ctx.arc(u.x,u.y+dropY+hover,u.r*1.05,0,7);ctx.fill();}
    if(u.bAtk>1){ctx.strokeStyle="rgba(255,210,80,.7)";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(u.x,u.y+hover,u.r+3,0,7);ctx.stroke();}
    if(u.level>1){   // 유닛 레벨 표시 (Lv2+)
      ctx.fillStyle="#ffd24d";ctx.font="bold 10px sans-serif";ctx.textAlign="left";
      ctx.strokeStyle="rgba(30,25,15,.9)";ctx.lineWidth=2.5;
      ctx.strokeText("L"+u.level,u.x+u.r*0.6,u.y-u.r*0.5+hover+dropY);
      ctx.fillText("L"+u.level,u.x+u.r*0.6,u.y-u.r*0.5+hover+dropY);
    }
    if(u.hp<u.maxHp)drawHpBar(u.x,u.y-u.r-13+dropY+hover,u.hp,u.maxHp,u.hero?36:26,u.side);
  });
  /* 이펙트 */
  S.effects.forEach(f=>{
    if(f.tp==="boom"){const p=1-Math.max(0,f.t)/f.t0;
      ctx.fillStyle="rgba("+f.col+","+(0.3*(1-p)).toFixed(3)+")";
      ctx.beginPath();ctx.arc(f.x,f.y,f.rad*p,0,7);ctx.fill();
      ctx.strokeStyle="rgba("+f.col+","+(0.9*(1-p)).toFixed(3)+")";ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(f.x,f.y,f.rad*p,0,7);ctx.stroke();}
    else if(f.tp==="hit"){const a=Math.max(0,f.t/0.18);
      ctx.fillStyle="rgba(255,245,150,"+(0.85*a).toFixed(2)+")";
      ctx.beginPath();
      for(let i=0;i<8;i++){const ang=i*Math.PI/4+f.t*8,rr=i%2?3:9;
        ctx[i?"lineTo":"moveTo"](f.x+Math.cos(ang)*rr,f.y+Math.sin(ang)*rr);}
      ctx.closePath();ctx.fill();}
    else if(f.tp==="bullet"){const p=1-Math.max(0,f.t)/f.t0;
      const bx=f.x1+(f.x2-f.x1)*p,by=f.y1+(f.y2-f.y1)*p;
      ctx.strokeStyle="rgba(255,240,180,.85)";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(bx-(f.x2-f.x1)*0.08,by-(f.y2-f.y1)*0.08);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle="#fff8d8";ctx.beginPath();ctx.arc(bx,by,2.5,0,7);ctx.fill();}
    else if(f.tp==="ftext"){const p=1-Math.max(0,f.t)/f.t0;
      const fy=f.y-p*22;
      ctx.globalAlpha=Math.min(1,(1-p)*2.5);
      ctx.font="bold 13px sans-serif";ctx.textAlign="center";
      ctx.strokeStyle="rgba(30,20,45,.9)";ctx.lineWidth=3;
      ctx.strokeText(f.text,f.x,fy);
      ctx.fillStyle="rgb("+f.col+")";
      ctx.fillText(f.text,f.x,fy);
      ctx.globalAlpha=1;}
  });
  /* 파티클 */
  S.particles.forEach(p=>{
    const a=Math.max(0,1-p.t/p.life);
    ctx.fillStyle="rgba("+p.col+","+(p.smoke?(a*0.5).toFixed(2):a.toFixed(2))+")";
    if(p.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*6);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);ctx.restore();}
    else if(p.smoke){ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+p.t),0,7);ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+0.5,0,7);ctx.fill();}
  });
  ctx.restore();   // 셰이크 해제 — 아래 배치 미리보기는 흔들리지 않게 (조준 안정)
  ctx.save();
  /* 드래그 고스트 */
  if(S.sel&&S.mouse){
    if(S.sel.type==="build"){
      const d=BAL.BUILDINGS[S.sel.key];
      const tx=Math.round(S.mouse.x/TILE-d.w/2),ty=Math.round(S.mouse.y/TILE-d.h/2);
      const bad=buildBlockReason(S.sel.key,tx,ty,"player");
      ctx.globalAlpha=0.65;
      drawBuildingSprite(S.sel.key,1,tx*TILE,ty*TILE,d.w*TILE,d.h*TILE,"player",1);
      ctx.globalAlpha=1;
      ctx.fillStyle=bad?"rgba(255,60,60,.3)":"rgba(120,255,140,.22)";
      ctx.fillRect(tx*TILE,ty*TILE,d.w*TILE,d.h*TILE);
      ctx.strokeStyle=bad?"rgba(255,80,80,.95)":"rgba(140,255,140,.95)";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
      ctx.strokeRect(tx*TILE,ty*TILE,d.w*TILE,d.h*TILE);ctx.setLineDash([]);
      if(d.atk){ctx.strokeStyle="rgba(255,160,80,.6)";ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc((tx+d.w/2)*TILE,(ty+d.h/2)*TILE,d.atk.rng*TILE,0,7);ctx.stroke();}
      if(bad){ctx.fillStyle="rgba(20,24,38,.85)";ctx.font="bold 11px sans-serif";
        const tw=ctx.measureText(bad).width;
        roundRectPath(S.mouse.x-tw/2-6,ty*TILE-22,tw+12,17,4);ctx.fill();
        ctx.fillStyle="#ffb0b0";ctx.textAlign="center";ctx.fillText(bad,S.mouse.x,ty*TILE-9);}
    } else {
      const key=S.heroSlots[S.sel.slot].key,d=BAL.HEROES[key];
      const bad=heroBlockReason(S.mouse.x,S.mouse.y);
      unitShadow(S.mouse.x,S.mouse.y+d.r*0.75,d.r*0.9);
      ctx.save();ctx.globalAlpha=0.6;ctx.translate(S.mouse.x,S.mouse.y);
      const fn=SPRH[key];if(fn)fn(d.r,true,0,null);
      ctx.restore();
      if(d.aura||d.heal){ctx.strokeStyle="rgba(255,210,80,.5)";ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
        ctx.beginPath();ctx.arc(S.mouse.x,S.mouse.y,BAL.AURA_R*TILE,0,7);ctx.stroke();ctx.setLineDash([]);}
      if(bad){ctx.fillStyle="rgba(255,60,60,.4)";ctx.beginPath();ctx.arc(S.mouse.x,S.mouse.y,d.r*1.15,0,7);ctx.fill();}
    }
  }
  /* 일시 정지 오버레이 */
  if(gameSpeed===0&&!S.over){
    ctx.fillStyle="rgba(10,14,26,.35)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(20,24,38,.85)";roundRectPath(W/2-70,H/2-24,140,48,10);ctx.fill();
    ctx.fillStyle="#ffd27a";ctx.font="bold 18px sans-serif";ctx.textAlign="center";
    ctx.fillText("⏸ 일시 정지",W/2,H/2+7);
  }
  ctx.restore();
}

/* ---------- 패널 아이콘 (오프스크린 렌더) ---------- */
const ICONS={};
function buildIcons(){
  const old=ctx;
  Object.keys(BAL.BUILDINGS).forEach(key=>{
    const icv=document.createElement("canvas");icv.width=96;icv.height=96;
    ctx=icv.getContext("2d");
    drawBuildingSprite(key,1,8,18,80,64,"player",1);
    ICONS[key]=icv.toDataURL();
  });
  Object.keys(BAL.HEROES).forEach(key=>{
    const icv=document.createElement("canvas");icv.width=96;icv.height=96;
    ctx=icv.getContext("2d");
    ctx.save();ctx.translate(48,52);const fn=SPRH[key];if(fn)fn(27,true,0,null);ctx.restore();
    ICONS["hero_"+key]=icv.toDataURL();
  });
  ctx=old;
}

/* ---------- 밸런스 에디터 ---------- */
function bGet(p){return p.split(".").reduce((o,k)=>o&&o[k],BAL);}
function bSet(p,v){const ks=p.split("."),last=ks.pop();const o=ks.reduce((o,k)=>o[k],BAL);o[last]=v;}
function toggleEditor(){
  const e=document.getElementById("editor");
  if(e.style.display==="block"){e.style.display="none";}
  else{buildEditorUI();e.style.display="block";}
}
function edPause(){togglePause();}
function edRow(path,label,step){
  const v=bGet(path);
  if(v===undefined)return"";
  return `<div class="ed-row"><label>${label}</label>`
    +`<input type="number" step="${step||"any"}" value="${v}" data-path="${path}"></div>`;
}
/* 스키마 자동 탐색: 엔티티에 숫자 필드가 추가되면 에디터에 자동 노출됨 */
const ED_LABELS={hp:"HP",dmg:"공격력",hs:"공속(초)",rng:"사거리",spd:"이속",splash:"광역 반경",period:"생산 주기(초)",
  cost:"비용",heal:"초당 회복",rad:"광역 반경",castRng:"시전 사거리",targets:"동시 대상",tier:"요구 티어",
  kb:"넉백",slowDur:"둔화(초)",atk:"",hAtk:"본진공격",aoe:"",prod:"",delay:"AI 시작 지연(초)",interval:"AI 판단 주기(초)",
  easy:"쉬움",normal:"보통",hard:"어려움",aiDelay:"AI 지연(초)",aiInterval:"AI 주기(초)",
  maxTier:"최대 티어",maxLevel:"최대 유닛 레벨",gasBases:"가스 기지 목표",prodMax:"생산 건물 목표",
  towerMax:"타워 목표",transform:"변형 사용(0/1)",aviary:"셰어리 건설(0/1)",defensive:"방어 반응(0/1)"};
const ED_SKIP=new Set(["nm","w","h","panel","gas","r","prereq","transforms","aura","upgCat","cat",
  "air","antiair","melee","unit","test","label","key"]);
function edWalk(obj,basePath,prefix){
  let h="";
  for(const k in obj){
    if(ED_SKIP.has(k))continue;
    const v=obj[k],p=basePath+"."+k;
    const lbl=ED_LABELS[k]!==undefined?ED_LABELS[k]:k;
    if(typeof v==="number")h+=edRow(p,(prefix?prefix+" ":"")+lbl);
    else if(Array.isArray(v))v.forEach((x,i)=>{if(typeof x==="number"&&i>0)h+=edRow(p+"."+i,(prefix?prefix+" ":"")+lbl+" T"+i);});
    else if(v&&typeof v==="object")h+=edWalk(v,p,(prefix?prefix+" ":"")+lbl);
  }
  return h;
}
let edTab="rules";
function buildEditorUI(){
  /* 탭 바 */
  let h=`<div class="ed-tabs">`+[["rules","경제·규칙"],["BUILDINGS","건물"],["UNITS","유닛"],["HEROES","영웅"]]
    .map(([id,nm])=>`<button class="ed-tab${edTab===id?" on":""}" onclick="edTab='${id}';buildEditorUI()">${nm}</button>`).join("")
    +`</div>`;
  if(edTab==="rules"){
    [["ECON.regen","엘릭서 회복 주기(초)"],["ECON.start","시작 엘릭서"],
     ["ECON.cap.1","엘릭서 상한 T1"],["ECON.cap.2","엘릭서 상한 T2"],["ECON.cap.3","엘릭서 상한 T3"],
     ["ECON.gasBonus","가스 기지 보너스"],["ECON.tierCost.2","킵 승급 비용"],["ECON.tierCost.3","캐슬 승급 비용"],
     ["ECON.upCost.2","레벨2 업그레이드 비용"],["ECON.upCost.3","레벨3 업그레이드 비용"],["ECON.transformCost","변형 비용"],
     ["EXCLUDE_R","적 건물 배제 반경"],["HALL_ZONE","본진 영역 반경"],["TOWER_ZONE","타워 영역 반경"],
     ["AURA_R","오라 반경"],["AURA_PWR","오라 배율(+)"],["UPG_PWR","업글 단계당 배율(+)"],
     ["UNIT_CAP","유닛 상한"],["HERO_COST","영웅 코스트"],["HERO_CD","영웅 재소환 쿨다운"]]
     .forEach(([p,l])=>h+=edRow(p,l));
    h+=`<div class="ed-sec">난이도 = AI 전략 수준 (현재: ${DIFF_NM[diffKey]})</div>`
      +`<div style="font-size:10.5px;color:var(--sub);margin-bottom:4px;">스탯·자원 규칙은 양측 동일 — 전략 차이로만 난이도가 갈립니다</div>`
      +edWalk(BAL.DIFF,"DIFF","");
  } else {
    /* 스키마 자동 탐색 — 엔티티·수치 필드 추가 시 자동 반영 */
    Object.keys(BAL[edTab]).forEach(k=>{
      h+=`<div class="ed-sub">${BAL[edTab][k].nm||k}</div>`+edWalk(BAL[edTab][k],`${edTab}.${k}`,"");
    });
  }
  const body=document.getElementById("ed-body");
  body.innerHTML=h;
  body.querySelectorAll("input[data-path]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const v=parseFloat(inp.value);
      if(isNaN(v)){inp.value=bGet(inp.dataset.path);return;}
      const p=inp.dataset.path;
      /* 건물 HP는 기존 건물에도 비율 유지로 즉시 반영 */
      const m=p.match(/^BUILDINGS\.(\w+)\.hp$/);
      if(m){const old=bGet(p);bSet(p,v);
        S.buildings.forEach(b=>{if(b.key===m[1]&&b.hp>0){b.hp=b.hp/old*v;b.maxHp=v;}});}
      else bSet(p,v);
      renderPanel();
    });
  });
}
function edExport(){
  const ta=document.getElementById("ed-export");
  const out={ECON:BAL.ECON,EXCLUDE_R:BAL.EXCLUDE_R,HALL_ZONE:BAL.HALL_ZONE,TOWER_ZONE:BAL.TOWER_ZONE,
    AURA_R:BAL.AURA_R,AURA_PWR:BAL.AURA_PWR,UPG_PWR:BAL.UPG_PWR,UNIT_CAP:BAL.UNIT_CAP,
    HERO_COST:BAL.HERO_COST,HERO_CD:BAL.HERO_CD,AI:BAL.AI,
    BUILDINGS:BAL.BUILDINGS,UNITS:BAL.UNITS,HEROES:BAL.HEROES};
  ta.value="window.BALANCE = "+JSON.stringify(out,null,1)+";";
  ta.style.display=ta.style.display==="block"?"none":"block";
  if(ta.style.display==="block"){ta.select();
    try{navigator.clipboard.writeText(ta.value);toast("클립보드에 복사됨 — balance.js에 붙여넣으세요");}catch(e){toast("텍스트를 직접 복사하세요");}}
}
function edReset(){
  const fresh=JSON.parse(JSON.stringify(BAL0));
  Object.keys(BAL).forEach(k=>delete BAL[k]);
  Object.assign(BAL,fresh);
  buildEditorUI(); renderPanel();
  toast("밸런스 기본값으로 초기화");
}

/* ---------- 시작 ---------- */
diffKey=store.getItem("rs2_diff")||"normal";
buildIcons();
newGame();
syncDiffUI();
rafId=requestAnimationFrame(loop);
</script>
