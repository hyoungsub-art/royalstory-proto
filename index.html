<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>로얄스토리 프로토타입</title>
<style>
  :root{
    --bg:#1a1f2e; --panel:#252b3d; --panel2:#2e3650; --text:#e8ebf4; --sub:#9aa3bd;
    --accent:#5b8cff; --gold:#ffc94d; --red:#ff6b6b; --green:#51cf66; --elixir:#c86bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic','맑은 고딕',sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;overscroll-behavior:none;}
  #app{width:min(520px,100vw);padding:6px;display:flex;flex-direction:column;height:100dvh;}
  #select{overflow-y:auto;min-height:0;padding-bottom:env(safe-area-inset-bottom);}
  h1{font-size:18px;margin:8px 4px;}
  .sub{color:var(--sub);font-size:12px;margin:0 4px 12px;}
  /* 스테이지 선택 */
  .stage-list{display:flex;flex-direction:column;gap:8px;}
  .stage-card{background:var(--panel);border:1px solid #39415c;border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;}
  .stage-card:hover{background:var(--panel2);}
  .stage-card.locked{opacity:.38;cursor:not-allowed;}
  .stage-num{font-size:15px;font-weight:bold;color:var(--gold);width:44px;flex-shrink:0;}
  .stage-info{flex:1;}
  .stage-name{font-size:14px;font-weight:bold;}
  .stage-desc{font-size:11px;color:var(--sub);margin-top:2px;}
  .stage-stars{font-size:13px;color:var(--gold);width:52px;text-align:right;flex-shrink:0;}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;}
  .badge.elite{background:#6b3fa0;} .badge.boss{background:#a03f3f;}
  .toolbar{display:flex;gap:8px;margin:10px 4px;}
  .toolbar button{background:var(--panel2);color:var(--sub);border:1px solid #39415c;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  /* 전투 */
  #battle{display:none;flex-direction:column;flex:1;min-height:0;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-size:13px;}
  #hud .timer{font-weight:bold;font-size:16px;}
  #hud .x2{color:var(--elixir);font-weight:bold;display:none;}
  #hud button{background:var(--panel2);color:var(--text);border:1px solid #39415c;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;}
  #hud .timer{color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.6);}
  #cv-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;}
  canvas{display:block;border-radius:8px;width:auto;height:auto;max-width:100%;max-height:100%;
    border:3px solid #223055;box-shadow:inset 0 0 0 2px rgba(255,215,120,.25);touch-action:none;}
  #bottom{background:linear-gradient(180deg,#2c3a5e,#22304f);border:2px solid #16203a;border-radius:12px;margin-top:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;}
  #elixir-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  #elixir-bar{flex:1;height:18px;background:#171b28;border-radius:9px;overflow:hidden;position:relative;border:1px solid #0d1120;}
  #elixir-fill{height:100%;background:linear-gradient(180deg,#e08cff 0%,#c86bfa 45%,#8f36d9 100%);border-radius:9px;width:0%;transition:width .1s linear;}
  #elixir-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(10,5,25,.55) calc(10% - 2px),rgba(10,5,25,.55) 10%);pointer-events:none;}
  #elixir-num{font-weight:bold;color:#fff;width:30px;height:34px;text-align:center;font-size:15px;line-height:36px;
    background:radial-gradient(circle at 35% 28%,#f0b3ff,#c86bfa 55%,#7d2bbf);border:2px solid #fff;
    border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;text-shadow:0 1px 2px rgba(70,10,110,.9);box-shadow:0 2px 4px rgba(0,0,0,.4);}
  #hand{display:flex;gap:6px;}
  .card{flex:1;background:linear-gradient(180deg,#fbfcff 0%,#dbe4f5 55%,#b9c6e2 100%);border:2px solid #5a6ea6;border-radius:9px;
    padding:8px 4px 4px;text-align:center;cursor:grab;user-select:none;position:relative;transition:transform .1s;
    box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);touch-action:none;}
  .card.dragging{opacity:.55;transform:scale(1.08) translateY(-8px);cursor:grabbing;box-shadow:0 8px 16px rgba(0,0,0,.55);}
  .card.sel{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 6px 12px rgba(0,0,0,.5),0 0 8px rgba(255,201,77,.7);}
  .card.dim{filter:grayscale(.75) brightness(.7);}
  .card .ico{width:42px;height:42px;display:block;margin:0 auto;pointer-events:none;user-select:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}
  .card .nm{position:absolute;left:50%;transform:translateX(-50%);bottom:-20px;white-space:nowrap;z-index:2;
    font-size:13px;font-weight:bold;background:#3b4a75;color:#fff;border-radius:6px;padding:2px 8px;
    box-shadow:0 2px 5px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);}
  #next-wrap .ico{width:28px;height:28px;}
  .card .cost{position:absolute;top:-7px;left:-5px;width:20px;height:24px;font-size:12px;font-weight:bold;line-height:25px;color:#fff;
    background:radial-gradient(circle at 35% 28%,#f0b3ff,#c86bfa 55%,#7d2bbf);border:1.5px solid #fff;
    border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;text-shadow:0 1px 2px rgba(70,10,110,.9);z-index:1;}
  @keyframes cardDraw{from{transform:translateY(26px) scale(.65);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  .card.draw{animation:cardDraw .28s cubic-bezier(.34,1.5,.64,1);}
  #elixir-fill{position:relative;}
  #elixir-fill::after{content:"";position:absolute;top:2px;left:4px;right:4px;height:40%;
    background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);border-radius:7px;}
  #next-wrap{width:56px;flex:none;opacity:.6;}
  #next-wrap .lbl{font-size:9px;color:var(--sub);text-align:center;margin-bottom:2px;}
  /* 결과 */
  #overlay{position:fixed;inset:0;background:rgba(10,12,20,.82);display:none;align-items:center;justify-content:center;z-index:10;}
  #overlay .box{background:var(--panel);border-radius:14px;padding:28px 36px;text-align:center;min-width:280px;}
  #overlay h2{font-size:24px;margin-bottom:8px;}
  #overlay .stars{font-size:30px;letter-spacing:6px;margin:10px 0;}
  #overlay .detail{font-size:12px;color:var(--sub);margin-bottom:18px;line-height:1.7;}
  #overlay button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;cursor:pointer;margin:0 4px;}
  #overlay button.ghost{background:var(--panel2);}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(20,24,38,.92);border:1px solid #39415c;padding:8px 18px;border-radius:8px;font-size:13px;display:none;z-index:9;}
</style>
</head>
<body>
<div id="app">
  <div id="select">
    <h1>로얄스토리 프로토타입 <span style="color:var(--sub);font-size:12px;">v0.1</span></h1>
    <p class="sub">챕터 1 "왕국의 부름" — 기획서 2026-08-14_챕터1_스테이지상세_v0.1 기준</p>
    <div class="stage-list" id="stage-list"></div>
    <div class="toolbar">
      <button onclick="devUnlockAll()">[DEV] 전체 해금</button>
      <button onclick="devReset()">[DEV] 진행 초기화</button>
    </div>
  </div>
  <div id="battle">
    <div id="hud">
      <button onclick="quitBattle()">◀ 나가기</button>
      <div><span id="stage-title"></span></div>
      <div><span class="x2" id="x2-ind">엘릭서 ×2</span> <span class="timer" id="timer">3:00</span></div>
      <button onclick="toggleSpeed()" id="spd-btn">▶ ×1</button>
    </div>
    <div id="cv-wrap"><canvas id="cv" width="480" height="800"></canvas></div>
    <div id="bottom">
      <div id="elixir-row">
        <div id="elixir-num">5</div>
        <div id="elixir-bar"><div id="elixir-fill"></div><div id="elixir-ticks"></div></div>
      </div>
      <div id="hand"></div>
    </div>
  </div>
</div>
<div id="overlay"><div class="box">
  <h2 id="ov-title"></h2>
  <div class="stars" id="ov-stars"></div>
  <div class="detail" id="ov-detail"></div>
  <button onclick="retryStage()">다시 도전</button>
  <button class="ghost" onclick="quitBattle()">스테이지 선택</button>
</div></div>
<div id="toast"></div>

<script src="balance.js"></script><!-- 외부 밸런스 테이블 (없으면 내장 기본값 사용) -->
<script>
"use strict";
/* ============================================================
   로얄스토리 프로토타입 — 밸런스 시트 v0.1 수치 그대로 사용
   좌표계: 타일 18×30, 1타일 = 26.67px. 위 = 적, 아래 = 플레이어
============================================================ */
const TILE = 480/18;
const COLS = 18, ROWS = 30;
const RIVER_Y = 15;              // 강 중심(타일)
const BRIDGES = [4.5, 13.5];     // 다리 x(타일)
const SPEED_T = {slow:0.75, med:1.0, fast:1.5, vfast:2.0}; // 타일/초

/* ---------- 카드 데이터 (02_밸런스데이터 시트 값) ---------- */
const CARDS = {
  knight:  {nm:"방패 기사", ico:"🛡️", cost:3, type:"unit", hp:1766, dmg:202, hs:1.2, rng:0.8, spd:"med",  cnt:1,  r:11, sight:6},
  musket:  {nm:"저격수",   ico:"🎯", cost:4, type:"unit", hp:720,  dmg:218, hs:1.1, rng:5.0, spd:"med",  cnt:1,  r:10, sight:6.5},  // 사거리 ≤ 킹 타워(5.0) 규칙
  valk:    {nm:"도끼 전사", ico:"🪓", cost:4, type:"unit", hp:1908, dmg:267, hs:1.5, rng:0.8, spd:"med",  cnt:1,  r:12, splash:1.2, sight:6},
  skarmy:  {nm:"해골 부대", ico:"💀", cost:3, type:"unit", hp:81,   dmg:81,  hs:1.0, rng:0.6, spd:"fast", cnt:15, r:5,  sight:6},
  hog:     {nm:"돌격 멧돼지",ico:"🐗", cost:4, type:"unit", hp:1696, dmg:318, hs:1.6, rng:0.8, spd:"vfast",cnt:1,  r:12, bldgOnly:true},
  giant:   {nm:"강철 거인", ico:"🗿", cost:5, type:"unit", hp:4091, dmg:254, hs:1.5, rng:0.8, spd:"slow", cnt:1,  r:15, bldgOnly:true},
  wind:    {nm:"바람 정령", ico:"🌪️", cost:1, type:"unit", hp:190,  dmg:110, hs:0,   rng:0.7, spd:"vfast",cnt:1,  r:8,  suicide:true, kb:2, slowDur:1, splash:2, sight:7},
  arrows:  {nm:"화살비",   ico:"🏹", cost:3, type:"spell", dmg:366, rad:4.0},
  fireball:{nm:"화염구",   ico:"🔥", cost:4, type:"spell", dmg:689, rad:2.5, kb:1.5},
};
/* 타워 (타워스탯 시트) — 사거리는 이웃 타워 간 거리(≈6.1타일)보다 짧게 (2026-08-15 수정) */
const TOWER = {
  princess:{hp:3052, dmg:109, hs:0.8, rng:5.5, size:1.4},
  king:    {hp:4824, dmg:109, hs:1.0, rng:5.0, size:1.8},
};
/* 보스 (스테이지배율 시트 보스 초안: HP 8480 = 멧돼지×5, 공격력 477 = ×1.5) */
const BOSS = {nm:"폭주 멧돼지 군주", hp:8480, dmg:477, hs:1.6, rng:1.0, r:20,
              p1Cycle:30, p2Cycle:20, telegraph:5, rage:1.35, escorts:2};

/* ---------- 스테이지 데이터 (챕터1 상세 문서) ---------- */
const STAGES = [
 {id:"1-1", nm:"첫 출정", tp:"일반", desc:"유닛 배치와 라인 학습 · 고정 덱 4장",
  deck:["knight","skarmy","valk","skarmy"], ai:"REACT", mult:0.8, kingOnly:true, enemyPassive:true,
  enemyDeck:[], star3:{time:150}},
 {id:"1-2", nm:"기다림의 미학", tp:"일반", desc:"엘릭서 이득 교환 학습 · 고정 덱 5장",
  deck:["knight","skarmy","valk","musket","knight"], ai:"CYCLE", mult:0.8,
  enemyDeck:["knight","valk"], star3:{time:90}},
 {id:"1-3", nm:"뼈들의 행진", tp:"일반", desc:"물량 ↔ 광역 상성 학습 · 해골 웨이브",
  deck:["knight","skarmy","valk","musket","arrows","knight"], ai:"SCRIPT", mult:0.8,
  enemyDeck:[], waves:"skel", star3:{time:90}},
 {id:"1-4", nm:"성문을 두드려라", tp:"일반", desc:"윈컨 개념 학습 · 멧돼지 지급",
  deck:["knight","skarmy","valk","musket","arrows","hog","knight"], ai:"REACT", mult:0.8,
  enemyDeck:["skarmy","musket"], star3:{time:90}},
 {id:"1-5", nm:"마지막 한 방", tp:"일반", desc:"스펠 킬각 학습 · 화염구 지급",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","knight"], ai:"CYCLE", mult:0.9,
  enemyDeck:["knight","valk","skarmy"], lowTower:true, star3:{time:90}},
 {id:"1-6", nm:"바람이 분다", tp:"일반", desc:"유틸 넉백 학습 · 시작 덱 8장 완성 · 러시 2회",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","wind"], ai:"RUSH", mult:0.9,
  enemyDeck:["knight"], rush:[{t:30,units:[["giant",0.7],["skarmy",0.9]]},{t:90,units:[["giant",0.7],["skarmy",0.9]]}], star3:{time:60}},
 {id:"1-7", nm:"총공세", tp:"일반", desc:"상성 종합 리허설 · 기믹 없음",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","wind"], ai:"CYCLE", mult:0.9,
  enemyDeck:["knight","skarmy","valk","musket"],
  rush:[{t:60,units:[["knight",0.9],["skarmy",0.9]]},{t:100,units:[["hog",0.9],["wind",0.9]]},{t:140,units:[["knight",0.9],["skarmy",0.9]]}], star3:{time:60}},
 {id:"1-8", nm:"두 배로 빠르게", tp:"정예", desc:"엘릭서 ×2 (양측) · 판단 속도 시험",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","wind"], ai:"CYCLE", mult:1.0,
  enemyDeck:["knight","skarmy","valk","musket","hog"], x2:true, star3:{time:90}},
 {id:"1-9", nm:"거울 전쟁", tp:"정예", desc:"미러 덱 · 킹 타워 단판",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","wind"], ai:"CYCLE", mult:1.0,
  enemyDeck:["knight","skarmy","valk","musket","hog","fireball"], kingOnly:true, kingOnlyPlayer:true, star3:{kingHp:0.8}},
 {id:"1-10", nm:"폭주 멧돼지 군주", tp:"보스", desc:"예고 돌진 2페이즈 · 보스 처치 시 승리",
  deck:["knight","skarmy","valk","musket","arrows","hog","fireball","wind"], ai:"BOSS", mult:1.0,
  enemyDeck:[], star3:{time:30}},
];

/* ---------- 외부 밸런스 테이블 오버라이드 (balance.js) ----------
   window.BALANCE가 있으면 내장 기본값 위에 덮어쓴다. 없으면(단일 파일 배포 등) 기본값 그대로. */
const ELX = { max:10, start:5, regen:2.8 };
if(window.BALANCE){
  const B = window.BALANCE;
  if(B.ELIXIR) Object.assign(ELX, B.ELIXIR);
  if(B.CARDS)  for(const k in B.CARDS)  if(CARDS[k])  Object.assign(CARDS[k],  B.CARDS[k]);
  if(B.TOWER)  for(const k in B.TOWER)  if(TOWER[k])  Object.assign(TOWER[k],  B.TOWER[k]);
  if(B.BOSS)   Object.assign(BOSS, B.BOSS);
  if(B.STAGE_MULT) STAGES.forEach(s=>{ if(B.STAGE_MULT[s.id]!==undefined) s.mult = B.STAGE_MULT[s.id]; });
}

/* ---------- 진행 저장 (localStorage 불가 환경 대비 폴백) ---------- */
const store = (()=>{ try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];}}; } })();
let progress = parseInt(store.getItem("rs_cleared")||"0");
let starsSave = JSON.parse(store.getItem("rs_stars")||"{}");

/* ---------- 전역 상태 ---------- */
const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");   // 카드 아이콘 생성 시 오프스크린으로 잠시 교체됨
let S = null;          // 전투 상태
let gameSpeed = 1, rafId = null, lastTs = 0;
let curStageIdx = -1;
let dragState = null;  // 카드 드래그앤드롭 상태

/* ============================================================ 스테이지 선택 ============================================================ */
function renderSelect(){
  const list = document.getElementById("stage-list"); list.innerHTML = "";
  STAGES.forEach((st,i)=>{
    const locked = i > progress;
    const div = document.createElement("div");
    div.className = "stage-card"+(locked?" locked":"");
    const badge = st.tp==="정예"?'<span class="badge elite">정예</span>':st.tp==="보스"?'<span class="badge boss">보스</span>':"";
    const stars = starsSave[st.id]||0;
    div.innerHTML = `<div class="stage-num">${st.id}</div>
      <div class="stage-info"><div class="stage-name">${st.nm}${badge}</div><div class="stage-desc">${st.desc}</div></div>
      <div class="stage-stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>`;
    if(!locked) div.onclick = ()=>startStage(i);
    list.appendChild(div);
  });
}
function devUnlockAll(){ progress = STAGES.length-1; store.setItem("rs_cleared",progress); renderSelect(); toast("전체 스테이지 해금 (DEV)"); }
function devReset(){ progress = 0; starsSave={}; store.setItem("rs_cleared",0); store.setItem("rs_stars","{}"); renderSelect(); toast("진행 초기화"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200); }

/* ============================================================ 전투 초기화 ============================================================ */
function startStage(idx){
  curStageIdx = idx;
  const st = STAGES[idx];
  document.getElementById("select").style.display="none";
  document.getElementById("battle").style.display="flex";
  document.getElementById("overlay").style.display="none";
  document.getElementById("stage-title").textContent = st.id+" "+st.nm;
  document.getElementById("x2-ind").style.display = st.x2?"inline":"none";

  S = {
    st, time: 180, elapsed: 0, over:false,
    elixir: ELX.start, aiElixir: ELX.start,
    units: [], effects: [], towers: [], particles: [], shake: 0,
    deckQ: [...st.deck], hand: [], sel: -1,
    aiCd: 2.5, rushDone: new Set(), waveT: 0,
    boss: null, playerTowerLost:false,
    aiDeckIdx: 0,
  };
  // 손패 4장 + 다음 카드
  while(S.hand.length<4 && S.deckQ.length) S.hand.push(S.deckQ.shift());
  // 타워 배치
  const mkT = (side, kind, tx, ty)=>({side, kind, x:tx*TILE, y:ty*TILE, hp:TOWER[kind].hp, maxHp:TOWER[kind].hp,
    cd:0, active: kind==="princess" || side==="enemy"&&false, tower:true, r:TOWER[kind].size*TILE/1.6});
  if(!st.kingOnly){
    S.towers.push(mkT("enemy","princess",4,6), mkT("enemy","princess",14,6));
  }
  S.towers.push(mkT("enemy","king",9,2.5));
  if(!st.kingOnlyPlayer){
    S.towers.push(mkT("player","princess",4,24), mkT("player","princess",14,24));
  }
  S.towers.push(mkT("player","king",9,27.5));
  // 킹 활성화: 서브 타워 없으면 처음부터 활성
  S.towers.forEach(t=>{ t.active = t.kind==="princess" || st.kingOnly&&t.side==="enemy" || st.kingOnlyPlayer&&t.side==="player"; });
  if(st.lowTower){ const t = S.towers.find(t=>t.side==="enemy"&&t.kind==="princess"); if(t){t.hp=400;} }
  // 보스
  if(st.ai==="BOSS"){
    S.boss = {side:"enemy", nm:BOSS.nm, x:9*TILE, y:5*TILE, homeX:9*TILE, homeY:5*TILE,
      hp:BOSS.hp, maxHp:BOSS.hp, dmg:BOSS.dmg, hs:BOSS.hs, r:BOSS.r, rng:BOSS.rng,
      state:"idle", stT:BOSS.p1Cycle-8, lane:0, cd:0, phase:1, boss:true, bldgOnly:true, spd:SPEED_T.vfast*TILE, slowT:0,
      animT:0, swing:0, flash:0, fx:1, moving:false};
    S.units.push(S.boss);
  }
  buildBG();
  if(!ICONS.knight) buildIcons();
  renderHand(); updateElixirUI();
  gameSpeed = 1; document.getElementById("spd-btn").textContent="▶ ×1";
  lastTs = 0;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function quitBattle(){
  if(rafId) cancelAnimationFrame(rafId); rafId=null; S=null;

/* ============================================================ 손패 / 배치 ============================================================ */
function renderHand(){
  const hand = document.getElementById("hand"); hand.innerHTML="";
  S.hand.forEach((key,i)=>{
    const c = CARDS[key];
    const div = document.createElement("div");
    div.className = "card"+(S.sel===i?" sel":"")+(S.elixir<c.cost?" dim":"")+(S.drawnSlot===i?" draw":"");
    div.innerHTML = `<div class="cost">${c.cost}</div><img class="ico" draggable="false" src="${ICONS[key]||""}" alt="">`
      + (S.sel===i ? `<div class="nm">${c.nm}</div>` : "");   // 이름은 선택한 카드만 크게 표시
    // 드래그앤드롭 + 탭 겸용 (포인터 이벤트: 마우스·터치 통합)
    div.addEventListener("pointerdown", e=>{
      if(S.over) return;
      e.preventDefault();
      dragState = {idx:i, id:e.pointerId, moved:false, el:div};
      try{ div.setPointerCapture(e.pointerId); }catch(_){}
    });
    div.addEventListener("pointermove", e=>{
      if(!dragState || dragState.id!==e.pointerId) return;
      dragState.moved = true;
      div.classList.add("dragging");
      S.sel = dragState.idx;
      const rect = cv.getBoundingClientRect();
      // 손가락 가림 보정: 터치는 소환 지점을 손가락 위쪽으로 오프셋 (캔버스 px)
      const off = e.pointerType==="touch" ? 65 : e.pointerType==="pen" ? 40 : 0;
      const rawX = (e.clientX-rect.left)*(cv.width/rect.width);
      const rawAimY = (e.clientY-rect.top)*(cv.height/rect.height) - off;   // 보정 조준점 (클램프 전)
      dragState.rawX = rawX;
      dragState.rawAimY = rawAimY;
      const cd = CARDS[S.hand[dragState.idx]];
      dragState.pt = (cd && cd.type==="unit")
        ? clampDeploy(rawX, Math.max(8, rawAimY))                            // 유닛: 배치 가능 좌표로 스냅
        : {x:Math.max(8, Math.min(cv.width-8, rawX)), y:Math.max(8, Math.min(cv.height-8, rawAimY))};
      S.mouse = dragState.pt;
    });
    const endDrag = e=>{
      if(!dragState || dragState.id!==e.pointerId) return;
      const st = dragState; dragState = null;
      div.classList.remove("dragging");
      if(e.type==="pointercancel"){ S.sel=-1; renderHand(); return; }
      // 드롭 유효 판정: 손가락이 아니라 "조준점"이 필드 안이면 배치 (필드 하단 조준 시 손가락은 캔버스 밖일 수 있음)
      // 조준점이 필드 아래로 20px 이상 벗어나면 취소 = 손패로 끌어내려 취소하는 제스처
      const validDrop = st.pt && st.rawAimY !== undefined
        && st.rawAimY <= cv.height + 20                       // 위로 벗어나는 건 허용 (최상단 스냅 배치)
        && st.rawX >= -20 && st.rawX <= cv.width + 20;
      if(st.moved && validDrop){
        tryPlaceCard(st.idx, st.pt.x, st.pt.y);   // 프리뷰에 표시된 보정 지점 그대로 소환
        if(S.sel===st.idx){ S.sel=-1; renderHand(); }   // 배치 실패 시 선택 해제
      } else if(!st.moved){
        S.sel = S.sel===st.idx ? -1 : st.idx; renderHand();   // 탭: 선택 토글 (기존 방식)
      } else { S.sel=-1; renderHand(); }
    };
    div.addEventListener("pointerup", endDrag);
    div.addEventListener("pointercancel", endDrag);
    hand.appendChild(div);
  });
  const nx = document.createElement("div");
  nx.id="next-wrap";
  const nxKey = S.deckQ[0];
  nx.innerHTML = `<div class="lbl">다음</div>`+(nxKey?`<div class="card" style="cursor:default;"><div class="cost">${CARDS[nxKey].cost}</div><img class="ico" draggable="false" src="${ICONS[nxKey]||""}" alt=""></div>`:"");
  hand.appendChild(nx);
  S.drawnSlot = -1;
}
/* 배치 공통 처리 (탭·드래그 양쪽에서 사용). x,y = 캔버스 좌표. 성공 시 true */
function tryPlaceCard(idx, x, y){
  const key = S.hand[idx], c = CARDS[key];
  if(!key) return false;
  if(S.elixir < c.cost){ toast("엘릭서 부족"); return false; }
  if(c.type==="unit"){ const cp = clampDeploy(x,y); x = cp.x; y = cp.y; }   // 불가 구역 조준 → 최상단 스냅
  if(c.type==="unit" && !canDeployAt(x,y)){ toast("배치할 수 없는 지역입니다"); return false; }
  if(c.type==="spell") castSpell(key, x, y, "player");
  else spawnUnits(key, x, y, "player", 1);
  S.elixir -= c.cost;
  // 카드 순환: 사용 카드는 덱 뒤로
  S.deckQ.push(key);
  S.hand[idx] = S.deckQ.shift();
  S.drawnSlot = idx;             // 드로우 애니메이션 대상
  S.sel = -1; renderHand(); updateElixirUI();
  return true;
}
let cvTouchAim = false;   // 캔버스 위 터치 조준 중 여부 (프리뷰와 소환 좌표 일치용)
cv.addEventListener("touchstart", ()=>{ cvTouchAim = false; }, {passive:true});
cv.addEventListener("click", e=>{
  if(!S || S.over || S.sel<0) return;
  if(cvTouchAim && S.mouse){ cvTouchAim = false; tryPlaceCard(S.sel, S.mouse.x, S.mouse.y); return; }
  const rect = cv.getBoundingClientRect();
  tryPlaceCard(S.sel, (e.clientX-rect.left)*(cv.width/rect.width), (e.clientY-rect.top)*(cv.height/rect.height));
});

function spawnUnits(key, x, y, side, mult){
  const c = CARDS[key];
  for(let i=0;i<c.cnt;i++){
    const ang = (i/c.cnt)*Math.PI*2, rad = c.cnt>1? TILE*(0.9+0.5*(i%3)):0;
    S.units.push({side, key, nm:c.nm, ico:c.ico,
      x: x+Math.cos(ang)*rad, y: y+Math.sin(ang)*rad,
      hp:Math.round(c.hp*mult), maxHp:Math.round(c.hp*mult), dmg:Math.round(c.dmg*mult),
      hs:c.hs, rng:c.rng, r:c.r, spd:SPEED_T[c.spd]*TILE, sight:(c.sight||6)*TILE,
      bldgOnly:!!c.bldgOnly, suicide:!!c.suicide, splash:c.splash||0, kb:c.kb||0, slowDur:c.slowDur||0,
      cd:0, deploy:0.8, slowT:0, animT:Math.random()*6.28, swing:0, flash:0, fx:1, moving:false,
      lane: x < 9*TILE ? 0 : 1});   // 배치 시점의 라인 고정 (타워 타깃 우선순위용)
  }
}
function castSpell(key, x, y, side){
  const c = CARDS[key];
  const radPx = c.rad*TILE;
  if(key==="fireball"){
    S.effects.push({tp:"comet", sx:x+(side==="player"?70:-70), sy: side==="player"?cv.height-30:30, x, y, rad:radPx, t:0.4, t0:0.4});
  } else if(key==="arrows"){
    for(let i=0;i<12;i++) S.effects.push({tp:"arrow", x:x+(Math.random()-0.5)*radPx*1.7, y:y+(Math.random()-0.5)*radPx*1.3, t:0.18+Math.random()*0.27, t0:0.45});
    S.effects.push({tp:"boom", x, y, rad:radPx, t:0.3, t0:0.3, col:"180,230,120"});
  } else {
    S.effects.push({tp:"boom", x, y, rad:radPx, t:0.35, t0:0.35, col:"150,200,255"});
  }
  const foes = side==="player" ? S.units.filter(u=>u.side==="enemy") : S.units.filter(u=>u.side==="player");
  foes.forEach(u=>{
    if(dist(u.x,u.y,x,y) <= radPx + u.r){
      u.hp -= c.dmg;
      if(c.kb && !u.tower && !u.boss){ const d=Math.max(1,dist(u.x,u.y,x,y)); u.x += (u.x-x)/d*c.kb*TILE; u.y += (u.y-y)/d*c.kb*TILE; }
    }
  });
  // 타워에는 스펠 피해 감소 없이 그대로 (프로토타입 단순화 — 원작은 타워 피해 감소 있음)
  const foeTowers = S.towers.filter(t=>t.side!==side && t.hp>0);
  foeTowers.forEach(t=>{ if(dist(t.x,t.y,x,y) <= radPx + t.r) t.hp -= Math.round(c.dmg*0.35); });
}

/* ============================================================ AI ============================================================ */
function aiUpdate(dt){
  const st = S.st;
  const regen = (st.x2?2:1) * (S.time<=60?2:1) / ELX.regen;
  S.aiElixir = Math.min(ELX.max, S.aiElixir + regen*dt);
  // RUSH / SCRIPT 스크립트 스폰
  if(st.rush) st.rush.forEach((rs,i)=>{
    if(S.elapsed>=rs.t && !S.rushDone.has(i)){
      S.rushDone.add(i);
      const lane = Math.random()<0.5?0:1;
      rs.units.forEach(([k,m],j)=> spawnUnits(k, BRIDGES[lane]*TILE+(j-0.5)*TILE, (7+j*1.5)*TILE, "enemy", m));
      toast("적의 총공세!");
    }
  });
  if(st.waves==="skel"){
    S.waveT -= dt;
    if(S.waveT<=0){
      S.waveT = 20;
      const both = S.elapsed>60;
      const lanes = both?[0,1]:[Math.random()<0.5?0:1];
      lanes.forEach(l=> spawnUnits("skarmy", BRIDGES[l]*TILE, 8*TILE, "enemy", st.mult));
    }
  }
  if(st.ai==="BOSS"){ bossUpdate(dt); return; }
  if(st.enemyPassive || !st.enemyDeck.length) { if(st.ai!=="REACT"||!st.enemyDeck.length) return; }
  S.aiCd -= dt;
  if(S.aiCd>0) return;
  const threat = S.units.find(u=>u.side==="player" && u.y < RIVER_Y*TILE);
  if(st.ai==="REACT"){
    if(!threat) return;
    const key = st.enemyDeck[S.aiDeckIdx % st.enemyDeck.length];
    if(S.aiElixir >= CARDS[key].cost){
      S.aiDeckIdx++;
      spawnUnits(key, threat.x, Math.max(3*TILE, threat.y-4*TILE), "enemy", st.mult);
      S.aiElixir -= CARDS[key].cost; S.aiCd = 1.6;
    }
  } else if(st.ai==="CYCLE"){
    const key = st.enemyDeck[S.aiDeckIdx % st.enemyDeck.length];
    const c = CARDS[key];
    if(S.aiElixir < c.cost) return;
    let x, y;
    if(threat && !c.bldgOnly){ x = threat.x; y = Math.max(3*TILE, threat.y-4*TILE); }   // 수비
    else { const lane = Math.random()<0.5?0:1; x = BRIDGES[lane]*TILE; y = (c.type==="spell")?0:8*TILE; } // 공격
    if(c.type==="spell"){
      // 스펠: 플레이어 유닛 뭉친 곳에
      const tgt = S.units.filter(u=>u.side==="player");
      if(tgt.length<3){ S.aiDeckIdx++; S.aiCd=1.0; return; }
      const m = tgt[Math.floor(Math.random()*tgt.length)];
      castSpell(key, m.x, m.y, "enemy");
    } else spawnUnits(key, x, y, "enemy", st.mult);
    S.aiDeckIdx++;
    S.aiElixir -= c.cost; S.aiCd = 1.6;
  }
}
/* 보스 상태 기계: idle → telegraph → charge → (타워 공격) → retreat */
function bossUpdate(dt){
  const b = S.boss; if(!b || b.hp<=0) return;
  b.animT = (b.animT||0) + dt*8;
  b.moving = (b.state==="charge" || b.state==="retreat");
  if(b.phase===1 && b.hp <= b.maxHp*0.5){ b.phase=2; toast("보스가 분노했다! (페이즈 2)"); shake(9); burst(b.x,b.y,"255,90,60",18,180); }
  const cycle = b.phase===1?BOSS.p1Cycle:BOSS.p2Cycle;
  const rage = b.phase===2?BOSS.rage:1;
  b.stT += dt;
  if(b.state==="idle"){
    b.x += (b.homeX-b.x)*Math.min(1,dt*2); b.y += (b.homeY-b.y)*Math.min(1,dt*2);
    if(b.stT >= cycle - BOSS.telegraph){ b.state="telegraph"; b.stT=0; b.lane = Math.random()<0.5?0:1; }
  } else if(b.state==="telegraph"){
    if(b.stT >= BOSS.telegraph){
      b.state="charge"; b.stT=0;
      spawnUnits("skarmy", BRIDGES[b.lane]*TILE, 9*TILE, "enemy", 1); // 동반 해골 (2기 대신 부대 축소판: 프로토타입 단순화)
      toast("보스 돌진!"); shake(7);
    }
  } else if(b.state==="charge"){
    const tgt = nearestTower(b, "player");
    if(!tgt){ b.state="retreat"; return; }
    const wp = waypoint(b, tgt);
    moveToward(b, wp.x, wp.y, b.spd*rage*dt);
    if(dist(b.x,b.y,tgt.x,tgt.y) <= b.rng*TILE + b.r + tgt.r){
      b.cd -= dt*rage;
      if(b.cd<=0){ tgt.hp -= b.dmg; tgt.flash = 0.15; b.swing = 0.28; b.cd = b.hs; hitFx(tgt.x,tgt.y); shake(4); }
    }
    if(b.stT >= 9){ b.state="retreat"; b.stT=0; }   // 9초 후 귀환
  } else if(b.state==="retreat"){
    moveToward(b, b.homeX, b.homeY, b.spd*1.2*dt);
    if(dist(b.x,b.y,b.homeX,b.homeY)<TILE){ b.state="idle"; b.stT=0; }
  }
}

/* ============================================================ 유닛 로직 ============================================================ */
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
/* 타워 타깃 우선순위: 같은 라인 서브 타워 → 킹 타워. 다른 라인 서브 타워로 넘어가지 않는다. */
function nearestTower(u, side){
  const ts = S.towers.filter(t=>t.side===side && t.hp>0);
  if(!ts.length) return null;
  const lane = (u.lane!==undefined) ? u.lane : (u.x < 9*TILE ? 0 : 1);
  const laneP = ts.find(t=>t.kind==="princess" && ((t.x < 9*TILE ? 0 : 1)===lane));
  if(laneP) return laneP;
  const king = ts.find(t=>t.kind==="king");
  if(king) return king;
  ts.sort((a,b)=>dist(u.x,u.y,a.x,a.y)-dist(u.x,u.y,b.x,b.y));
  return ts[0];
}
/* 배치 가능 판정: 자기 진영 전체 + 적 서브 타워가 "없는"(파괴됐거나 처음부터 없는) 라인의 전진 지역 */
function enemyPrincessOf(half){
  return S.towers.find(t=>t.side==="enemy" && t.kind==="princess" && ((t.x < 9*TILE ? 0 : 1)===half));
}
function canDeployAt(x,y){
  if(y >= (RIVER_Y+1)*TILE) return true;
  const half = x < 9*TILE ? 0 : 1;
  const p = enemyPrincessOf(half);
  if((!p || p.hp<=0) && y >= 5*TILE && y < (RIVER_Y-1)*TILE) return true;
  return false;
}
/* 배치 좌표 스냅: 조준이 배치 불가 구역(상단·강)에 있으면 그 라인의 가장 가까운 배치 가능 좌표로 보정 */
function clampDeploy(x, y){
  x = Math.max(8, Math.min(cv.width-8, x));
  const half = x < 9*TILE ? 0 : 1;
  const p = enemyPrincessOf(half);
  const fwdOpen = (!p || p.hp<=0);
  const ownTop = (RIVER_Y+1)*TILE;
  const fwdTop = 5*TILE, fwdBot = (RIVER_Y-1)*TILE - 1;
  let cy = Math.min(y, cv.height-8);
  if(fwdOpen){
    if(cy < fwdTop) cy = fwdTop;                                    // 개방 지역 최상단으로
    else if(cy > fwdBot && cy < ownTop)
      cy = (cy - fwdBot < ownTop - cy) ? fwdBot : ownTop;           // 강 구간: 가까운 경계로
  } else {
    if(cy < ownTop) cy = ownTop;                                    // 자기 진영 최상단으로
  }
  return {x, y: cy};
}
function waypoint(u, tgt){
  // 강 건너야 하면 가까운 다리 경유
  const riverPx = RIVER_Y*TILE;
  const crossing = (u.y-riverPx)*(tgt.y-riverPx) < 0;
  if(crossing && Math.abs(u.y-riverPx) > TILE*0.6){
    const bx = BRIDGES.reduce((a,b)=>Math.abs(a*TILE-u.x)<Math.abs(b*TILE-u.x)?a:b)*TILE;
    if(Math.abs(u.x-bx) > TILE*0.7) return {x:bx, y:riverPx + (u.y<riverPx?-1:1)*TILE*0.2};
    return {x:bx, y:tgt.y};
  }
  return {x:tgt.x, y:tgt.y};
}
function moveToward(u, tx, ty, step){
  const d = dist(u.x,u.y,tx,ty); if(d<1) return;
  u.x += (tx-u.x)/d*step; u.y += (ty-u.y)/d*step;
}
function hitFx(x,y){ S.effects.push({tp:"hit",x,y,t:0.18}); }

function unitUpdate(u, dt){
  u.swing = Math.max(0, (u.swing||0) - dt);
  u.flash = Math.max(0, (u.flash||0) - dt);
  u.moving = false;
  if(u.boss) return;                        // 보스는 별도 로직
  if(u.deploy>0){ u.deploy-=dt; if(u.deploy<=0) burst(u.x, u.y+u.r*0.6, "205,195,165", 6, 90); return; }
  u.animT = (u.animT||0) + dt*7;
  const slowMul = u.slowT>0 ? 0.5 : 1;
  if(u.slowT>0) u.slowT -= dt;
  const foeSide = u.side==="player"?"enemy":"player";
  // 타깃 선택
  let tgt = null;
  if(!u.bldgOnly){
    const foes = S.units.filter(e=>e.side===foeSide && e.hp>0 && !(e.deploy>0));
    let best=null, bd=1e9;
    foes.forEach(e=>{ const d=dist(u.x,u.y,e.x,e.y); if(d<bd){bd=d;best=e;} });
    if(best && bd <= u.sight) tgt = best;
  }
  if(!tgt) tgt = nearestTower(u, foeSide);
  if(!tgt) return;
  const reach = u.rng*TILE + u.r + tgt.r;
  const d = dist(u.x,u.y,tgt.x,tgt.y);
  if(u.suicide){
    if(d <= reach){
      // 자폭: 광역 피해 + 넉백 + 둔화
      const foes = S.units.filter(e=>e.side===foeSide && e.hp>0);
      foes.forEach(e=>{ if(dist(e.x,e.y,u.x,u.y)<=u.splash*TILE+e.r){ e.hp-=u.dmg; e.slowT=Math.max(e.slowT,u.slowDur);
        if(!e.boss){ const dd=Math.max(1,dist(e.x,e.y,u.x,u.y)); e.x+=(e.x-u.x)/dd*u.kb*TILE; e.y+=(e.y-u.y)/dd*u.kb*TILE; } }});
      if(tgt.tower && dist(tgt.x,tgt.y,u.x,u.y)<=u.splash*TILE+tgt.r) tgt.hp -= Math.round(u.dmg*0.35);
      S.effects.push({tp:"boom",x:u.x,y:u.y,rad:u.splash*TILE,t:0.3,t0:0.3,col:"150,240,220"});
      burst(u.x, u.y, "180,245,230", 10, 130);
      u.hp = 0; return;
    }
  } else if(d <= reach){
    if(Math.abs(tgt.x-u.x)>2) u.fx = tgt.x>u.x?1:-1;
    u.cd -= dt*slowMul;
    if(u.cd<=0){
      if(u.splash && !u.suicide){
        const foes = S.units.filter(e=>e.side===foeSide && e.hp>0);
        foes.forEach(e=>{ if(dist(e.x,e.y,tgt.x,tgt.y)<=u.splash*TILE+e.r){ e.hp -= u.dmg; e.flash = 0.15; } });
        if(tgt.tower) tgt.hp -= u.dmg;
      } else { tgt.hp -= u.dmg; tgt.flash = 0.15; }
      if(u.rng > 2) S.effects.push({tp:"bullet", x1:u.x, y1:u.y-u.r*0.4, x2:tgt.x, y2:tgt.y, t:0.12, t0:0.12});
      else hitFx(tgt.x, tgt.y);
      u.swing = 0.28; u.cd = u.hs;
    }
    return;
  }
  const wp = waypoint(u, tgt);
  if(Math.abs(wp.x-u.x)>2) u.fx = wp.x>u.x?1:-1;
  u.moving = true;
  moveToward(u, wp.x, wp.y, u.spd*slowMul*dt);
}
function towerUpdate(t, dt){
  t.flash = Math.max(0, (t.flash||0) - dt);
  if(t.hp<=0 || !t.active) return;
  t.cd -= dt;
  if(t.cd>0) return;
  const foeSide = t.side==="player"?"enemy":"player";
  const foes = S.units.filter(e=>e.side===foeSide && e.hp>0 && !(e.deploy>0));
  let best=null, bd=1e9;
  foes.forEach(e=>{ const d=dist(t.x,t.y,e.x,e.y); if(d<bd){bd=d;best=e;} });
  const T = TOWER[t.kind];
  if(best && bd <= T.rng*TILE + t.r + best.r){
    best.hp -= T.dmg; best.flash = 0.12; t.cd = T.hs;
    S.effects.push({tp:"bullet",x1:t.x,y1:t.y-t.r,x2:best.x,y2:best.y,t:0.12,t0:0.12});
  }
}

/* ============================================================ 메인 루프 ============================================================ */
function loop(ts){
  if(!S) return;
  if(!lastTs) lastTs = ts;
  let dt = Math.min(0.05,(ts-lastTs)/1000) * gameSpeed;
  lastTs = ts;
  if(!S.over){
    S.time -= dt; S.elapsed += dt;
    // 엘릭서
    const regen = (S.st.x2?2:1) * (S.time<=60?2:1) / ELX.regen;
    S.elixir = Math.min(ELX.max, S.elixir + regen*dt);
    aiUpdate(dt);
    S.units.forEach(u=>unitUpdate(u,dt));
    S.towers.forEach(t=>towerUpdate(t,dt));
    // 사망 연출 + 제거
    S.units.forEach(u=>{ if(u.hp<=0) deathFx(u); });
    S.units = S.units.filter(u=>u.hp>0);
    // 타워 파괴 연출 (1회) + 전진 배치 개방 알림
    S.towers.forEach(t=>{ if(t.hp<=0 && !t.boomed){ t.boomed = true; towerBoom(t);
      if(t.side==="enemy" && t.kind==="princess") toast("적 타워 파괴! 해당 라인 전진 배치 개방"); } });
    // 킹 활성화 체크
    ["player","enemy"].forEach(side=>{
      const king = S.towers.find(t=>t.side===side&&t.kind==="king");
      if(king && !king.active){
        const princessDown = S.towers.some(t=>t.side===side&&t.kind==="princess"&&t.hp<=0);
        if(princessDown || king.hp<king.maxHp) king.active = true;
      }
    });
    // 플레이어 타워 손실 추적 (별점)
    if(S.towers.some(t=>t.side==="player"&&t.hp<=0)) S.playerTowerLost = true;
    checkEnd();
    updateElixirUI();
  }
  tickFx(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}
function checkEnd(){
  const st = S.st;
  const eKing = S.towers.find(t=>t.side==="enemy"&&t.kind==="king");
  const pKing = S.towers.find(t=>t.side==="player"&&t.kind==="king");
  if(st.ai==="BOSS"){
    if(S.boss.hp<=0) return endBattle(true);
    if(pKing.hp<=0) return endBattle(false);
    if(S.time<=0) return endBattle(false);
    return;
  }
  if(eKing.hp<=0) return endBattle(true);
  if(pKing.hp<=0) return endBattle(false);
  if(S.time<=0){
    const pDestroyed = S.towers.filter(t=>t.side==="enemy"&&t.hp<=0).length;
    const eDestroyed = S.towers.filter(t=>t.side==="player"&&t.hp<=0).length;
    return endBattle(pDestroyed > eDestroyed);   // PvE 무승부 = 실패 (기획서 규칙)
  }
}
function endBattle(win){
  S.over = true;
  if(win) confetti(); else shake(12);
  let stars = 0, lines = [];
  if(win){
    stars = 1; lines.push("★ 승리");
    if(!S.playerTowerLost){ stars++; lines.push("★ 타워 무손실"); } else lines.push("☆ 타워 무손실 실패");
    const s3 = S.st.star3;
    let got3=false;
    if(s3.time!==undefined){ got3 = (180-S.elapsed) >= s3.time; lines.push((got3?"★":"☆")+` ${Math.floor((180-s3.time)/60)}분 ${(180-s3.time)%60}초 내 클리어`); }
    if(s3.kingHp!==undefined){ const pk=S.towers.find(t=>t.side==="player"&&t.kind==="king"); got3 = pk.hp>=pk.maxHp*s3.kingHp; lines.push((got3?"★":"☆")+" 킹 타워 체력 80% 이상"); }
    if(got3) stars++;
    if((starsSave[S.st.id]||0) < stars){ starsSave[S.st.id]=stars; store.setItem("rs_stars",JSON.stringify(starsSave)); }
    if(curStageIdx >= progress && curStageIdx < STAGES.length-1){ progress = curStageIdx+1; store.setItem("rs_cleared",progress); }
    if(S.st.id==="1-10") lines.push("", "챕터 1 클리어! (PvP 해금 — 본편 예정)");
  } else lines.push("패배 — 덱과 상성을 다시 생각해 보세요");
  document.getElementById("ov-title").textContent = win?"승리!":"패배";
  document.getElementById("ov-title").style.color = win?"var(--gold)":"var(--red)";
  document.getElementById("ov-stars").textContent = win? "★".repeat(stars)+"☆".repeat(3-stars) : "";
  document.getElementById("ov-detail").innerHTML = lines.join("<br>");
  document.getElementById("overlay").style.display="flex";
}
function updateElixirUI(){
  document.getElementById("elixir-fill").style.width = (S.elixir/ELX.max*100)+"%";
  document.getElementById("elixir-num").textContent = Math.floor(S.elixir);
  const m = Math.max(0,Math.floor(S.time/60)), s = Math.max(0,Math.floor(S.time%60));
  document.getElementById("timer").textContent = m+":"+String(s).padStart(2,"0");
  // 손패 dim 갱신
  [...document.getElementById("hand").children].forEach((el,i)=>{
    if(i<4 && S.hand[i]) el.classList.toggle("dim", S.elixir < CARDS[S.hand[i]].cost);
  });
}

/* ============================================================ 렌더링 v2: 배경 캐시 · 파티클 · 벡터 스프라이트 ============================================================ */
function roundRectPath(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function unitShadow(x,y,r){ ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x,y,r,r*0.42,0,0,7); ctx.fill(); }
function drawHpBar(x,y,hp,maxHp,w,side){
  const h=6;
  ctx.fillStyle="rgba(15,20,30,.85)"; roundRectPath(x-w/2-1,y-1,w+2,h+2,3); ctx.fill();
  const p=Math.max(0,hp/maxHp);
  ctx.fillStyle = side==="player" ? "#3f8cff" : "#ff4d4d";
  roundRectPath(x-w/2,y,Math.max(2,w*p),h,2); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)"; roundRectPath(x-w/2,y,Math.max(2,w*p),h/2,2); ctx.fill();
}

/* ---------- 시드 난수 + 정적 배경 캐시 ---------- */
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let bgCache=null;
function buildBG(){
  bgCache=document.createElement("canvas"); bgCache.width=cv.width; bgCache.height=cv.height;
  const c=bgCache.getContext("2d"), W=cv.width, H=cv.height, rnd=mulberry(42);
  // 잔디 체커 + 노이즈 점묘
  c.fillStyle="#79c247"; c.fillRect(0,0,W,H);
  c.fillStyle="rgba(0,45,0,.06)";
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++) if((r+cc)%2) c.fillRect(cc*TILE,r*TILE,TILE,TILE);
  for(let i=0;i<700;i++){ const x=rnd()*W, y=rnd()*H;
    c.fillStyle = rnd()<.5 ? "rgba(255,255,255,.05)" : "rgba(0,60,0,.07)";
    c.fillRect(x,y,2,2); }
  // 흙길 + 자갈
  BRIDGES.forEach(bx=>{
    c.fillStyle="rgba(205,170,110,.45)"; c.fillRect((bx-0.8)*TILE,0,1.6*TILE,H);
    c.fillStyle="rgba(150,115,70,.5)";
    for(let i=0;i<40;i++){ const px=(bx-0.7+rnd()*1.4)*TILE, py=rnd()*H;
      c.beginPath(); c.ellipse(px,py,2.5,1.7,0,0,7); c.fill(); }
  });
  // 강 (모래 경계 + 물 바닥, 물결은 동적)
  const ry=(RIVER_Y-0.9)*TILE, rh=1.8*TILE;
  c.fillStyle="#e6d7a3"; c.fillRect(0,ry-6,W,rh+12);
  c.fillStyle="#3fa9f5"; c.fillRect(0,ry,W,rh);
  c.fillStyle="#2f8fd8"; c.fillRect(0,ry,W,5); c.fillRect(0,ry+rh-5,W,5);
  // 나무 판자 다리 (외곽선 포함)
  BRIDGES.forEach(bx=>{
    const x=(bx-1.1)*TILE, w=2.2*TILE;
    c.fillStyle="#8a5a28"; c.fillRect(x-5,ry-9,7,rh+18); c.fillRect(x+w-2,ry-9,7,rh+18);
    c.strokeStyle="#2e2a33"; c.lineWidth=2;
    c.strokeRect(x-5,ry-9,7,rh+18); c.strokeRect(x+w-2,ry-9,7,rh+18);
    c.fillStyle="#c98d4b"; c.fillRect(x,ry-5,w,rh+10);
    c.strokeRect(x,ry-5,w,rh+10);
    c.strokeStyle="rgba(90,50,15,.5)";
    for(let i=1;i<6;i++){ const py=ry-5+i*(rh+10)/6; c.beginPath(); c.moveTo(x,py); c.lineTo(x+w,py); c.stroke(); }
  });
  // 가장자리 프롭: 덤불 · 돌 · 꽃
  for(let i=0;i<30;i++){
    const left=rnd()<.5;
    const x = left ? 4+rnd()*0.85*TILE : W-4-rnd()*0.85*TILE;
    const y = rnd()*H, k = rnd();
    if(Math.abs(y-RIVER_Y*TILE) < 2.5*TILE) continue;
    if(k<0.45){       // 덤불 (외곽선)
      c.strokeStyle="#2e2a33"; c.lineWidth=1.5;
      c.fillStyle="#4e9433";
      [[-5,2,5],[5,2,5],[0,0,7]].forEach(b=>{ c.beginPath(); c.arc(x+b[0],y+b[1],b[2],0,7); c.fill(); c.stroke(); });
      c.fillStyle="#5fae3e"; c.beginPath(); c.arc(x,y-2,4.5,0,7); c.fill();
    } else if(k<0.72){ // 돌 (외곽선)
      c.strokeStyle="#2e2a33"; c.lineWidth=1.5;
      c.fillStyle="#a9a99d"; c.beginPath(); c.ellipse(x,y,6,4.5,0,0,7); c.fill(); c.stroke();
      c.fillStyle="#c4c4b8"; c.beginPath(); c.ellipse(x-1.5,y-1.5,3.5,2.5,0,0,7); c.fill();
    } else {          // 꽃
      c.fillStyle="#fff";
      for(let a=0;a<5;a++){ c.beginPath(); c.arc(x+Math.cos(a*1.256)*2.6,y+Math.sin(a*1.256)*2.6,1.8,0,7); c.fill(); }
      c.fillStyle="#ffd94d"; c.beginPath(); c.arc(x,y,1.8,0,7); c.fill();
    }
  }
  // 타워 석재 바닥
  if(S) S.towers.forEach(t=>{
    c.fillStyle="#c9c6b6"; c.beginPath(); c.ellipse(t.x,t.y+5,t.r*1.4,t.r*1.05,0,0,7); c.fill();
    c.strokeStyle="rgba(46,42,51,.6)"; c.lineWidth=2; c.beginPath(); c.ellipse(t.x,t.y+5,t.r*1.4,t.r*1.05,0,0,7); c.stroke();
  });
  // 외곽 림
  c.strokeStyle="rgba(40,85,15,.6)"; c.lineWidth=6; c.strokeRect(3,3,W-6,H-6);
}

/* ---------- 파티클 ---------- */
function addP(p){ if(S && S.particles.length<300) S.particles.push(p); }
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=spd*(0.4+Math.random()*0.8);
    addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.4,g:260,t:0,life:0.45+Math.random()*0.35,size:2+Math.random()*2.5,col}); }
}
function deathFx(u){
  if(u.key==="skarmy"){ for(let i=0;i<4;i++)
    addP({x:u.x,y:u.y,vx:(Math.random()-.5)*140,vy:-60-Math.random()*80,g:300,t:0,life:0.6,size:2.5,col:"240,240,230",spin:1}); }
  else if(u.boss){ burst(u.x,u.y,"255,140,60",26,220); burst(u.x,u.y,"90,90,90",14,120); shake(12); }
  else burst(u.x,u.y,"205,205,195",8,110);
}
function towerBoom(t){
  burst(t.x,t.y,"255,150,60",20,200); burst(t.x,t.y,"120,120,110",14,150);
  for(let i=0;i<6;i++) addP({x:t.x+(Math.random()-.5)*20,y:t.y-10,vx:(Math.random()-.5)*30,vy:-40-Math.random()*30,g:-25,t:0,life:1.1,size:6+Math.random()*5,col:"110,110,110",smoke:1});
  shake(11);
}
function confetti(){
  const cols=["255,200,60","90,150,255","255,110,110","130,230,140","220,140,255"];
  for(let i=0;i<70;i++)
    addP({x:Math.random()*cv.width,y:-10-Math.random()*60,vx:(Math.random()-.5)*70,vy:60+Math.random()*90,g:60,t:0,life:1.8+Math.random(),size:3+Math.random()*3,col:cols[i%5],conf:1});
}
function shake(v){ if(S) S.shake=Math.max(S.shake||0,v); }
function tickFx(dt){
  if(!S) return;
  S.shake=Math.max(0,(S.shake||0)-dt*22);
  S.particles.forEach(p=>{ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; });
  S.particles=S.particles.filter(p=>p.t<p.life);
  S.effects.forEach(f=>{
    f.t-=dt;
    if(f.tp==="comet" && f.t<=0 && !f.done){ f.done=1;
      S.effects.push({tp:"boom",x:f.x,y:f.y,rad:f.rad,t:0.35,t0:0.35,col:"255,170,60"});
      burst(f.x,f.y,"255,170,60",16,180); shake(6); }
  });
  S.effects=S.effects.filter(f=>f.t>0);
}

/* ---------- 유닛 벡터 스프라이트: 치비 스타일 ----------
   문법: 큰 머리(신장 절반 이상) + 작은 몸통, 진한 외곽선, 플랫 컬러, 정면 얼굴 + 점 눈.
   로컬 좌표: 원점=유닛 중심, +x=바라보는 방향(무기 쪽) */
const OUTLINE = "#2e2a33";
function po(w){ ctx.strokeStyle=OUTLINE; ctx.lineWidth=w||1.6; ctx.stroke(); }
function chibiBase(r, bodyC, skinC){
  const lw = Math.max(1, r*0.13);
  // 발
  ctx.fillStyle="#4a4048";
  ctx.beginPath(); ctx.ellipse(-r*0.3, r*1.02, r*0.2, r*0.12, 0, 0, 7); ctx.fill(); po(lw);
  ctx.beginPath(); ctx.ellipse( r*0.3, r*1.02, r*0.2, r*0.12, 0, 0, 7); ctx.fill(); po(lw);
  // 몸통
  ctx.fillStyle=bodyC;
  roundRectPath(-r*0.52, r*0.08, r*1.04, r*0.92, r*0.3); ctx.fill(); po(lw);
  // 팔 (양옆 작은 손)
  ctx.fillStyle=skinC;
  ctx.beginPath(); ctx.arc(-r*0.58, r*0.48, r*0.16, 0, 7); ctx.fill(); po(lw);
  ctx.beginPath(); ctx.arc( r*0.58, r*0.48, r*0.16, 0, 7); ctx.fill(); po(lw);
  // 머리 (크게)
  ctx.fillStyle=skinC;
  ctx.beginPath(); ctx.arc(0, -r*0.38, r*0.76, 0, 7); ctx.fill(); po(lw);
}
function chibiEyes(r, y, gap){
  ctx.fillStyle=OUTLINE;
  ctx.beginPath(); ctx.arc(-(gap||r*0.24), y, r*0.075, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc( (gap||r*0.24), y, r*0.075, 0, 7); ctx.fill();
}
function sprKnight(r,team,sw,u){
  const c1=team?"#3b6fd4":"#d4453b", lw=Math.max(1,r*0.13);
  // 검 (오른손, 스윙)
  ctx.save(); ctx.translate(r*0.6, r*0.42);
  ctx.rotate(-0.5 + (sw>0? Math.sin((0.28-sw)/0.28*Math.PI)*1.5 : 0));
  ctx.fillStyle="#cfd6de"; roundRectPath(-r*0.07,-r*0.92,r*0.14,r*0.8,r*0.05); ctx.fill(); po(lw);
  ctx.fillStyle="#8a6a3a"; roundRectPath(-r*0.17,-r*0.16,r*0.34,r*0.13,r*0.04); ctx.fill(); po(lw);
  ctx.restore();
  chibiBase(r, c1, "#f6cfa2");
  // 투구: 반구 + 코가드
  ctx.fillStyle="#b9c2cc";
  ctx.beginPath(); ctx.arc(0,-r*0.46,r*0.78,Math.PI,0); ctx.closePath(); ctx.fill(); po(lw);
  roundRectPath(-r*0.09,-r*0.5,r*0.18,r*0.42,r*0.05); ctx.fill(); po(lw);
  chibiEyes(r, -r*0.22);
  // 방패 (왼손)
  ctx.fillStyle="#8a6a3a"; roundRectPath(-r*0.95,r*0.15,r*0.46,r*0.62,r*0.12); ctx.fill(); po(lw);
  ctx.fillStyle=c1; roundRectPath(-r*0.88,r*0.24,r*0.32,r*0.44,r*0.09); ctx.fill(); po(lw);
}
function sprMusket(r,team,sw,u){
  const c1=team?"#3b6fd4":"#d4453b", lw=Math.max(1,r*0.13);
  chibiBase(r, c1, "#f6cfa2");
  // 머리칼
  ctx.fillStyle="#6b4a86";
  ctx.beginPath(); ctx.arc(0,-r*0.5,r*0.74,Math.PI*0.95,Math.PI*2.05); ctx.closePath(); ctx.fill(); po(lw);
  // 모자: 챙 + 돔
  ctx.fillStyle="#8a63b8";
  ctx.beginPath(); ctx.ellipse(0,-r*0.86,r*0.8,r*0.2,0,0,7); ctx.fill(); po(lw);
  ctx.beginPath(); ctx.arc(0,-r*0.9,r*0.42,Math.PI,0); ctx.closePath(); ctx.fill(); po(lw);
  chibiEyes(r, -r*0.28);
  // 장총 (오른쪽 대각선)

/* ---------- 카드 아이콘: 유닛 스프라이트를 오프스크린 캔버스에 렌더해 생성 ---------- */
const ICONS = {};
function sprSpellIcon(key, r){
  if(key==="fireball"){
    ctx.fillStyle="#ff6b2d";   // 불꽃 꼬리
    ctx.beginPath(); ctx.moveTo(r*0.45,-r*0.5); ctx.quadraticCurveTo(r*1.15,-r*1.05, r*0.8,-r*0.1); ctx.closePath(); ctx.fill(); po(1.5);
    ctx.fillStyle="#ff9c3a"; ctx.beginPath(); ctx.arc(0,0,r*0.75,0,7); ctx.fill(); po(2);
    ctx.fillStyle="#ffd66b"; ctx.beginPath(); ctx.arc(-r*0.18,-r*0.18,r*0.38,0,7); ctx.fill();
  } else if(key==="arrows"){
    for(let i=-1;i<=1;i++){
      ctx.save(); ctx.translate(i*r*0.45, Math.abs(i)*r*0.15); ctx.rotate(0.45);
      ctx.strokeStyle="#7a5a30"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(0,r*0.7); ctx.lineTo(0,-r*0.55); ctx.stroke();
      ctx.fillStyle="#e8e8e0";
      ctx.beginPath(); ctx.moveTo(0,-r*0.85); ctx.lineTo(-r*0.16,-r*0.48); ctx.lineTo(r*0.16,-r*0.48); ctx.closePath(); ctx.fill(); po(1.2);
      ctx.restore();
    }
  } else { // 기타 스펠 (빙결·광폭화 등 확장 대비): 반짝임
    ctx.fillStyle="#bfe6ff";
    ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr=i%2? r*0.3 : r*0.8;
      ctx[i?"lineTo":"moveTo"](Math.cos(a)*rr, Math.sin(a)*rr); }
    ctx.closePath(); ctx.fill(); po(1.5);
  }
}
function buildIcons(){
  const old = ctx;
  for(const key in CARDS){
    const c = CARDS[key];
    const icv = document.createElement("canvas"); icv.width = 64; icv.height = 64;
    ctx = icv.getContext("2d");
    ctx.save(); ctx.translate(32, 36);
    if(c.type==="unit"){ const fn = SPR[key]; if(fn) fn(15, true, 0, null); }
    else sprSpellIcon(key, 16);
    ctx.restore();
    ICONS[key] = icv.toDataURL();
  }
  ctx = old;
}
function drawTower(tw){
  const b=tw.r, lw=Math.max(1.6, b*0.1);
  if(tw.hp<=0){ // 잔해 (외곽선 포함)
    ctx.fillStyle="#b5b2a4";
    [[0,0,.7],[-.5,.3,.4],[.5,.25,.45],[-.2,-.35,.3]].forEach(p=>{
      ctx.beginPath(); ctx.arc(tw.x+p[0]*b,tw.y+p[1]*b,p[2]*b,0,7); ctx.fill(); po(lw*0.8); });
    return;
  }
  const team = tw.side==="player";
  const roofC = team? "#4a7ce0":"#e0564a";
  unitShadow(tw.x, tw.y+b*0.85, b*1.15);
  // 석재 몸통 (플랫 + 외곽선)
  ctx.fillStyle="#eceadf";
  roundRectPath(tw.x-b*0.85, tw.y-b*0.5, b*1.7, b*1.35, b*0.3); ctx.fill(); po(lw);
  // 밑단 띠
  ctx.fillStyle="#cfccbc";
  roundRectPath(tw.x-b*0.85, tw.y+b*0.5, b*1.7, b*0.35, b*0.17); ctx.fill(); po(lw);
  // 창문 (아치)
  ctx.fillStyle="#4a4048";
  ctx.beginPath(); ctx.arc(tw.x, tw.y+b*0.08, b*0.18, Math.PI, 0);
  ctx.lineTo(tw.x+b*0.18, tw.y+b*0.4); ctx.lineTo(tw.x-b*0.18, tw.y+b*0.4); ctx.closePath(); ctx.fill(); po(lw*0.8);
  if(tw.kind==="princess"){
    // 원뿔 지붕 (플랫 + 외곽선) + 펄럭이는 깃발
    ctx.fillStyle=roofC;
    ctx.beginPath(); ctx.moveTo(tw.x-b*0.95,tw.y-b*0.42); ctx.lineTo(tw.x+b*0.95,tw.y-b*0.42); ctx.lineTo(tw.x,tw.y-b*1.85); ctx.closePath(); ctx.fill(); po(lw);
    const fw = Math.sin(S.elapsed*4+tw.x)*b*0.1;
    ctx.strokeStyle=OUTLINE; ctx.lineWidth=lw*0.8;
    ctx.beginPath(); ctx.moveTo(tw.x,tw.y-b*1.85); ctx.lineTo(tw.x,tw.y-b*2.3); ctx.stroke();
    ctx.fillStyle=roofC;
    ctx.beginPath(); ctx.moveTo(tw.x,tw.y-b*2.3);
    ctx.quadraticCurveTo(tw.x+b*0.3,tw.y-b*2.24+fw, tw.x+b*0.58,tw.y-b*2.1+fw);
    ctx.lineTo(tw.x,tw.y-b*1.94); ctx.closePath(); ctx.fill(); po(lw*0.8);
  } else {
    // 킹 타워: 총안 3개 + 벡터 금관 (비활성 시 어둡게) + 진영 배너
    ctx.fillStyle="#eceadf";
    for(let i=-1;i<=1;i++){ roundRectPath(tw.x+i*b*0.55-b*0.16, tw.y-b*0.82, b*0.32, b*0.4, b*0.08); ctx.fill(); po(lw*0.8); }
    ctx.globalAlpha = tw.active?1:0.45;
    ctx.fillStyle="#ffcf3f";
    ctx.beginPath();
    ctx.moveTo(tw.x-b*0.42,tw.y-b*0.85);
    ctx.lineTo(tw.x-b*0.36,tw.y-b*1.32); ctx.lineTo(tw.x-b*0.14,tw.y-b*1.02);
    ctx.lineTo(tw.x,tw.y-b*1.38); ctx.lineTo(tw.x+b*0.14,tw.y-b*1.02);
    ctx.lineTo(tw.x+b*0.36,tw.y-b*1.32); ctx.lineTo(tw.x+b*0.42,tw.y-b*0.85);
    ctx.closePath(); ctx.fill(); po(lw);
    ctx.globalAlpha = 1;
    const bw = Math.sin(S.elapsed*3+tw.y)*2;
    ctx.fillStyle=roofC;
    ctx.beginPath();
    ctx.moveTo(tw.x-b*0.15,tw.y-b*0.45); ctx.lineTo(tw.x+b*0.15,tw.y-b*0.45);
    ctx.lineTo(tw.x+b*0.15+bw,tw.y+b*0.38); ctx.lineTo(tw.x+bw*0.5,tw.y+b*0.22);
    ctx.lineTo(tw.x-b*0.15+bw,tw.y+b*0.38); ctx.closePath(); ctx.fill(); po(lw*0.8);
  }
  // 피격 플래시
  if(tw.flash>0){
    ctx.fillStyle="rgba(255,255,255,"+Math.min(0.7,tw.flash*5).toFixed(2)+")";
    roundRectPath(tw.x-b*0.85,tw.y-b*0.5,b*1.7,b*1.35,b*0.3); ctx.fill();
  }
  if(tw.hp<tw.maxHp) drawHpBar(tw.x, tw.y-b*(tw.kind==="princess"?2.45:1.75), tw.hp, tw.maxHp, 46, tw.side);
}
function drawUnit(u){
  const team = u.side==="player";
  const dropY = u.deploy>0 ? -u.deploy*80 : 0;      // 배치: 낙하 착지
  const at = u.animT||0;
  const bob = u.moving ? Math.sin(at)*1.8 : Math.sin(at*0.35)*0.7;  // 걷기/대기 바운스
  // 그림자 + 진영 링 (지면 고정)
  unitShadow(u.x, u.y+u.r*0.75, u.r*0.95*(u.deploy>0?0.55:1));
  ctx.strokeStyle = team? "rgba(60,130,255,.5)":"rgba(255,80,60,.5)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(u.x,u.y+u.r*0.75,u.r*0.95,u.r*0.4,0,0,7); ctx.stroke();
  // 스프라이트 (이동 기울임 + 좌우 반전)
  ctx.save();
  ctx.globalAlpha = u.deploy>0?0.9:1;
  ctx.translate(u.x, u.y+bob+dropY);
  if(u.moving) ctx.rotate(Math.sin(at)*0.05);
  ctx.scale(u.fx||1, 1);
  const fn = u.boss ? sprBoss : SPR[u.key];
  if(fn) fn(u.r, team, u.swing||0, u);
  ctx.restore();
  ctx.globalAlpha = 1;
  // 피격 플래시
  if(u.flash>0){
    ctx.fillStyle="rgba(255,255,255,"+Math.min(0.75,u.flash*5).toFixed(2)+")";
    ctx.beginPath(); ctx.arc(u.x,u.y+dropY,u.r*1.05,0,7); ctx.fill();
  }
  // 둔화 표시
  if(u.slowT>0){
    ctx.strokeStyle="rgba(120,220,255,.8)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(u.x,u.y+dropY,u.r+3,0,7); ctx.stroke();
  }
  // 보스 오라 (텔레그래프 / 페이즈 2)
  if(u.boss){
    if(u.state==="telegraph"){
      ctx.strokeStyle="rgba(255,60,60,"+(0.5+0.4*Math.sin(S.elapsed*12)).toFixed(2)+")";
      ctx.lineWidth=3; ctx.beginPath(); ctx.arc(u.x,u.y,u.r+7+2*Math.sin(S.elapsed*12),0,7); ctx.stroke();
    } else if(u.phase===2){
      ctx.strokeStyle="rgba(255,110,40,.45)"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(u.x,u.y,u.r+5,0,7); ctx.stroke();
    }
  }
  // HP바: 피해를 입었을 때만 표시 (원작 방식)
  if(u.hp<u.maxHp) drawHpBar(u.x, u.y-u.r-12+dropY, u.hp, u.maxHp, u.boss?62:u.r>=10?30:18, u.side);
}
function draw(){
  const W=cv.width, H=cv.height, t=S.elapsed;
  ctx.save();
  // 스크린 셰이크
  if(S.shake>0.3) ctx.translate((Math.random()-.5)*S.shake, (Math.random()-.5)*S.shake);
  // 정적 배경 캐시
  if(!bgCache) buildBG();
  ctx.drawImage(bgCache,0,0);
  // 물결 (동적, 다리 위 제외)
  const ry=(RIVER_Y-0.9)*TILE, rh=1.8*TILE;
  ctx.fillStyle="rgba(255,255,255,.32)";
  for(let i=0;i<8;i++){
    const wx=((i*89+t*26)%(W+60))-30;
    if(BRIDGES.some(b=>Math.abs(b*TILE-wx)<1.35*TILE)) continue;
    ctx.beginPath(); ctx.ellipse(wx, ry+rh*(0.22+(i%3)*0.27), 15,2.6,0,0,7); ctx.fill();
  }
  // 배치 가능 영역 (자기 진영 + 개방된 전진 지역)
  if(S.sel>=0 && CARDS[S.hand[S.sel]].type==="unit"){
    ctx.fillStyle="rgba(120,200,255,.16)";
    ctx.fillRect(0,(RIVER_Y+1)*TILE,W,H-(RIVER_Y+1)*TILE);
    [0,1].forEach(half=>{
      const p = enemyPrincessOf(half);
      if(!p || p.hp<=0) ctx.fillRect(half? 9*TILE : 0, 5*TILE, 9*TILE, (RIVER_Y-1)*TILE - 5*TILE);
    });
  }
  // 보스 돌진 예고 라인
  if(S.boss && S.boss.state==="telegraph"){
    ctx.fillStyle="rgba(255,70,70,"+(0.22+0.14*Math.sin(t*10)).toFixed(3)+")";
    const bx=BRIDGES[S.boss.lane]*TILE;
    ctx.fillRect(bx-1.5*TILE,0,3*TILE,H);
    ctx.fillStyle="#fff"; ctx.font="bold 16px sans-serif"; ctx.textAlign="center";
    ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.lineWidth=3;
    ctx.strokeText("⚠ 돌진 예고 ⚠", bx, RIVER_Y*TILE);
    ctx.fillText("⚠ 돌진 예고 ⚠", bx, RIVER_Y*TILE);
  }
  // 타워 → 유닛(y 정렬로 원근감)
  S.towers.forEach(drawTower);
  [...S.units].sort((a,b)=>a.y-b.y).forEach(drawUnit);
  // 이펙트
  S.effects.forEach(f=>{
    if(f.tp==="boom"){
      const p=1-Math.max(0,f.t)/f.t0;
      ctx.fillStyle="rgba("+f.col+","+(0.3*(1-p)).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(f.x,f.y,f.rad*p,0,7); ctx.fill();
      ctx.strokeStyle="rgba("+f.col+","+(0.9*(1-p)).toFixed(3)+")"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.rad*p,0,7); ctx.stroke();
    } else if(f.tp==="hit"){
      const a=Math.max(0,f.t/0.18);
      ctx.fillStyle="rgba(255,245,150,"+(0.85*a).toFixed(2)+")";
      ctx.beginPath();
      for(let i=0;i<8;i++){ const ang=i*Math.PI/4+f.t*8, rr=i%2?3:9;
        ctx[i?"lineTo":"moveTo"](f.x+Math.cos(ang)*rr, f.y+Math.sin(ang)*rr); }
      ctx.closePath(); ctx.fill();
    } else if(f.tp==="bullet"){
      const p=1-Math.max(0,f.t)/f.t0;
      const bx=f.x1+(f.x2-f.x1)*p, by=f.y1+(f.y2-f.y1)*p;
      ctx.strokeStyle="rgba(255,240,180,.85)"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(bx-(f.x2-f.x1)*0.08,by-(f.y2-f.y1)*0.08); ctx.lineTo(bx,by); ctx.stroke();
      ctx.fillStyle="#fff8d8"; ctx.beginPath(); ctx.arc(bx,by,2.5,0,7); ctx.fill();
    } else if(f.tp==="arrow"){
      const p=1-Math.max(0,f.t)/f.t0;
      const ay=f.y-(1-p)*95;
      ctx.strokeStyle="rgba(90,60,25,.9)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x-3,ay-9); ctx.lineTo(f.x+3,ay); ctx.stroke();
      ctx.fillStyle="#d8d8d8";
      ctx.beginPath(); ctx.moveTo(f.x+3,ay); ctx.lineTo(f.x-1,ay-3); ctx.lineTo(f.x+1,ay-5); ctx.closePath(); ctx.fill();
    } else if(f.tp==="comet"){
      const p=1-Math.max(0,f.t)/f.t0;
      const cx=f.sx+(f.x-f.sx)*p, cy=f.sy+(f.y-f.sy)*p-Math.sin(p*Math.PI)*140;
      ctx.fillStyle="rgba(255,150,60,.4)";
      for(let i=1;i<=3;i++){ const q=Math.max(0,p-i*0.06);
        const tx=f.sx+(f.x-f.sx)*q, ty=f.sy+(f.y-f.sy)*q-Math.sin(q*Math.PI)*140;
        ctx.beginPath(); ctx.arc(tx,ty,7-i*1.6,0,7); ctx.fill(); }
      const gg=ctx.createRadialGradient(cx,cy,1,cx,cy,11);
      gg.addColorStop(0,"#fff3b0"); gg.addColorStop(.55,"#ff9c3a"); gg.addColorStop(1,"rgba(255,90,30,0)");
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cy,11,0,7); ctx.fill();
    }
  });
  // 파티클
  S.particles.forEach(p=>{
    const a=Math.max(0,1-p.t/p.life);
    if(p.conf){
      ctx.fillStyle="rgba("+p.col+","+a.toFixed(2)+")";
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.t*6);
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
    } else if(p.smoke){
      ctx.fillStyle="rgba("+p.col+","+(a*0.5).toFixed(2)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1+p.t),0,7); ctx.fill();
    } else if(p.spin){
      ctx.fillStyle="rgba("+p.col+","+a.toFixed(2)+")";
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.t*10);
      ctx.fillRect(-3,-1,6,2); ctx.restore();
    } else {
      ctx.fillStyle="rgba("+p.col+","+a.toFixed(2)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+0.5,0,7); ctx.fill();
    }
  });
  // 배치 프리뷰 — 유닛: 반투명 고스트만 표시 (원작 방식). 배치 불가 지역이면 붉게 물듦. 스펠: 반경 원 유지
  if(S.sel>=0 && S.mouse){
    const key=S.hand[S.sel], c=CARDS[key];
    const mx=S.mouse.x, my=S.mouse.y;
    if(c.type==="spell"){
      ctx.strokeStyle="rgba(255,220,100,.9)"; ctx.lineWidth=2.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.arc(mx,my,c.rad*TILE,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(255,200,80,.12)";
      ctx.beginPath(); ctx.arc(mx,my,c.rad*TILE,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,220,100,.9)";
      ctx.beginPath(); ctx.arc(mx,my,2.5,0,7); ctx.fill();
    } else {
      const legal = canDeployAt(mx,my);
      const r = c.r||11;
      // 발밑 그림자 + 반투명 유닛 고스트
      unitShadow(mx, my+r*0.75, r*0.9);
      const fn=SPR[key];
      if(fn){ ctx.save(); ctx.globalAlpha=0.6; ctx.translate(mx,my); fn(r, true, 0, null); ctx.restore(); }
      // 배치 불가: 고스트를 붉게 물들임
      if(!legal){
        ctx.fillStyle="rgba(255,60,60,.4)";
        ctx.beginPath(); ctx.arc(mx,my,r*1.15,0,7); ctx.fill();
      }
    }
  }
  // 보스 페이즈 라벨
  if(S.boss && S.boss.hp>0){
    ctx.fillStyle="rgba(0,0,0,.45)"; roundRectPath(6,6,212,20,5); ctx.fill();
    ctx.fillStyle="#ffd27a"; ctx.font="bold 12px sans-serif"; ctx.textAlign="left";
    ctx.fillText(`BOSS ${BOSS.nm} — 페이즈 ${S.boss.phase}`, 12, 21);
  }
  ctx.restore();
}
cv.addEventListener("mousemove", e=>{
  if(!S) return;
  const rect = cv.getBoundingClientRect();
  S.mouse = {x:(e.clientX-rect.left)*(cv.width/rect.width), y:(e.clientY-rect.top)*(cv.height/rect.height)};
});
// 터치: 드래그 중 배치 프리뷰 표시 + 페이지 스크롤 차단 (탭 배치는 click 이벤트가 처리)
cv.addEventListener("touchmove", e=>{
  if(!S) return;
  e.preventDefault();
  const t = e.touches[0], rect = cv.getBoundingClientRect();
  cvTouchAim = true;
  const tx = (t.clientX-rect.left)*(cv.width/rect.width);
  const ty = (t.clientY-rect.top)*(cv.height/rect.height) - 65;   // 손가락 가림 보정
  const selCard = S.sel>=0 ? CARDS[S.hand[S.sel]] : null;
  S.mouse = (selCard && selCard.type==="unit")
    ? clampDeploy(tx, Math.max(8, ty))
    : {x:Math.max(8,Math.min(cv.width-8,tx)), y:Math.max(8,Math.min(cv.height-8,ty))};
}, {passive:false});

renderSelect();
</script>
