<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>킹덤 크래프트 프로토타입</title>
<style>
  :root{
    --bg:#1a1f2e; --panel:#252b3d; --panel2:#2e3650; --text:#e8ebf4; --sub:#9aa3bd;
    --accent:#5b8cff; --gold:#ffc94d; --red:#ff6b6b; --green:#51cf66; --elixir:#c86bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic','맑은 고딕',sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;overscroll-behavior:none;}
  #app{width:min(540px,100vw);padding:6px;display:flex;flex-direction:column;height:100dvh;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;font-size:12px;gap:6px;}
  #hud button{background:var(--panel2);color:var(--text);border:1px solid #39415c;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;}
  #tier-label{color:var(--gold);font-weight:bold;}
  #cv-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;}
  canvas{display:block;border-radius:8px;width:auto;height:auto;max-width:100%;max-height:100%;
    border:3px solid #223055;box-shadow:inset 0 0 0 2px rgba(255,215,120,.25);touch-action:none;}
  /* 건물 말풍선 팝업 (클릭 토글) */
  #bubble{position:absolute;display:none;z-index:8;transform:translate(-50%,-100%);
    background:rgba(28,34,54,.96);border:2px solid #5a6ea6;border-radius:10px;padding:7px;
    box-shadow:0 4px 12px rgba(0,0,0,.55);min-width:150px;max-width:250px;}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);
    border:9px solid transparent;border-top-color:#5a6ea6;}
  #bubble.below{transform:translate(-50%,0);}
  #bubble.below::after{top:-17px;bottom:auto;border-top-color:transparent;border-bottom-color:#5a6ea6;}
  #bubble .b-title{font-size:11.5px;font-weight:bold;color:var(--gold);text-align:center;margin-bottom:4px;white-space:nowrap;}
  #bubble button{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:4px 0;
    background:linear-gradient(180deg,#3b4a75,#2c3a5e);color:#fff;border:1px solid #4a5a8a;border-radius:8px;
    padding:9px 8px;font-size:13px;font-weight:bold;cursor:pointer;white-space:normal;line-height:1.35;text-align:center;box-sizing:border-box;}
  #bubble button img{width:34px;height:34px;flex:none;}
  /* 비활성: 버튼 전체를 흐리게 하지 않고 텍스트·배경만 가라앉힘 — 건물 이미지는 선명 유지 */
  #bubble button:disabled{background:#262d42;border-color:#38405c;color:#97a0b8;cursor:not-allowed;}
  /* 철거: 오터치 방지용 소형 버튼 */
  #bubble button.b-mini{display:inline-block;width:auto;padding:3px 9px;font-size:10.5px;font-weight:normal;
    margin:0 0 5px;background:linear-gradient(180deg,#6e3038,#54242b);border-color:#8a4450;opacity:.9;}
  #bubble .b-note{font-size:10px;text-align:center;margin-top:2px;}
  /* 하단 패널 */
  #bottom{background:linear-gradient(180deg,#2c3a5e,#22304f);border:2px solid #16203a;border-radius:12px;margin-top:4px;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  #elixir-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  #elixir-bar{flex:1;height:18px;background:#171b28;border-radius:9px;overflow:hidden;position:relative;border:1px solid #0d1120;}
  #elixir-fill{height:100%;background:linear-gradient(180deg,#e08cff 0%,#c86bfa 45%,#8f36d9 100%);border-radius:9px;width:0%;transition:width .1s linear;position:relative;}
  #elixir-fill::after{content:"";position:absolute;top:2px;left:4px;right:4px;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);border-radius:7px;}
  #elixir-num{font-weight:bold;color:#fff;min-width:52px;height:34px;text-align:center;font-size:13px;line-height:34px;padding:0 6px;
    background:radial-gradient(circle at 35% 28%,#f0b3ff,#c86bfa 55%,#7d2bbf);border:2px solid #fff;
    border-radius:17px;text-shadow:0 1px 2px rgba(70,10,110,.9);box-shadow:0 2px 4px rgba(0,0,0,.4);}
  /* 엘릭서 스타 칩 (표시 전용 — 엘릭서와 동일한 보라 계열) */
  #star-chip{min-width:44px;height:34px;border-radius:17px;font-size:13px;font-weight:bold;
    background:radial-gradient(circle at 35% 28%,#f0b3ff,#c86bfa 55%,#7d2bbf);border:2px solid #fff;color:#fff;
    text-shadow:0 1px 2px rgba(70,10,110,.9);box-shadow:0 2px 4px rgba(0,0,0,.4);}
  #mode-row{display:flex;gap:6px;align-items:stretch;}
  #swap-btn{flex:none;width:58px;background:linear-gradient(180deg,#4a5a8a,#3b4a75);color:#fff;border:2px solid #5a6ea6;border-radius:10px;
    font-size:11px;font-weight:bold;cursor:pointer;line-height:1.3;}
  #panel{flex:1;display:flex;gap:5px;align-items:stretch;min-height:76px;}
  .p-item{flex:1;background:linear-gradient(180deg,#fbfcff 0%,#dbe4f5 55%,#b9c6e2 100%);border:2px solid #5a6ea6;border-radius:9px;
    padding:3px 2px;text-align:center;cursor:grab;user-select:none;position:relative;touch-action:none;min-width:0;
    box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .p-item img{width:80%;height:auto;pointer-events:none;user-select:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
  .p-item .p-nm{font-size:9px;font-weight:bold;color:#2c3a5e;white-space:nowrap;overflow:hidden;max-width:100%;}
  .p-item .p-cost{position:absolute;top:-6px;left:-4px;width:18px;height:22px;font-size:11px;font-weight:bold;line-height:23px;color:#fff;
    background:radial-gradient(circle at 35% 28%,#f0b3ff,#c86bfa 55%,#7d2bbf);border:1.5px solid #fff;
    border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;text-shadow:0 1px 2px rgba(70,10,110,.9);z-index:1;}
  .p-item.locked{filter:grayscale(.8) brightness(.6);cursor:not-allowed;}
  .p-item.dim{filter:grayscale(.5) brightness(.75);}
  .p-item .p-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;color:#ffd27a;
    background:rgba(15,18,30,.55);border-radius:7px;text-align:center;line-height:1.4;padding:2px;white-space:pre-line;}
  .p-item.dragging{opacity:.55;transform:scale(1.06) translateY(-6px);}
  .p-item .p-cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;color:#fff;
    background:rgba(15,18,30,.6);border-radius:7px;}
  #overlay{position:fixed;inset:0;background:rgba(10,12,20,.82);display:none;align-items:center;justify-content:center;z-index:10;}
  #overlay .box{background:var(--panel);border-radius:14px;padding:26px 34px;text-align:center;min-width:270px;}
  #overlay h2{font-size:24px;margin-bottom:10px;}
  #overlay .detail{font-size:12px;color:var(--sub);margin-bottom:16px;line-height:1.7;}
  #overlay button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;cursor:pointer;}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(20,24,38,.94);border:1px solid #39415c;
    padding:8px 16px;border-radius:8px;font-size:12.5px;display:none;z-index:9;max-width:90vw;text-align:center;}
  /* 밸런스 에디터 */
  #editor{position:fixed;top:0;right:0;bottom:0;width:min(340px,94vw);background:rgba(18,22,36,.97);z-index:20;display:none;
    border-left:2px solid #39415c;padding:10px 12px calc(10px + env(safe-area-inset-bottom));overflow-y:auto;font-size:12px;}
  .ed-btn{background:var(--panel2);color:var(--text);border:1px solid #39415c;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;}
  .ed-tabs{display:flex;gap:4px;margin:4px 0 8px;position:sticky;top:0;background:rgba(18,22,36,.97);padding:4px 0;z-index:1;}
  .ed-tab{flex:1;background:var(--panel2);color:var(--sub);border:1px solid #39415c;border-radius:7px;padding:6px 2px;font-size:11.5px;cursor:pointer;font-weight:bold;}
  .ed-tab.on{background:linear-gradient(180deg,#4a5a8a,#3b4a75);color:#ffd27a;border-color:#5a6ea6;}
  .ed-sec{margin:10px 0 3px;font-weight:bold;color:var(--gold);font-size:12px;border-bottom:1px solid #39415c;padding-bottom:3px;}
  .ed-sub{margin:6px 0 2px;font-weight:bold;color:#9fc0ff;font-size:11.5px;}
  .ed-row{display:flex;justify-content:space-between;align-items:center;padding:1.5px 0;gap:6px;}
  .ed-row label{color:var(--sub);flex:1;font-size:11.5px;white-space:nowrap;overflow:hidden;}
  .ed-row input{width:66px;background:#171b28;color:#fff;border:1px solid #39415c;border-radius:5px;padding:3px 5px;font-size:12px;text-align:right;}
  #ed-export{width:100%;height:100px;background:#171b28;color:#9fe8d8;border:1px solid #39415c;border-radius:5px;font-size:10px;
    display:none;margin-bottom:6px;padding:4px;}
  /* ---------- 로비·모드 화면 (2026-09-04) ---------- */
  .scr{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 42% at 50% 18%, rgba(101,150,255,.15), transparent 70%),
      radial-gradient(circle 26px at 82% 13%, rgba(255,243,205,.95), rgba(255,243,205,.2) 62%, transparent 72%),
      linear-gradient(180deg,#1d2447 0%,#181d33 55%,#111527 100%);
    display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:10px;padding:20px;}
  .scr.on{display:flex;}
  .scr>*{position:relative;z-index:1;}
  /* 별 (은은한 반짝임) */
  .scr::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent),
      radial-gradient(1px 1px at 28% 11%, rgba(255,255,255,.85), transparent),
      radial-gradient(1.5px 1.5px at 44% 27%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 63% 9%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 73% 31%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 91% 27%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 7% 43%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 55% 5%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 36% 40%, rgba(255,255,255,.45), transparent);
    animation:twinkle 3.6s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.45;}to{opacity:1;}}
  /* 성곽 실루엣 (하단): 좌우 망루 + 성벽 총안 + 성벽, 망루 창의 불빛 */
  .scr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:132px;z-index:0;pointer-events:none;
    background:
      radial-gradient(3px 4px at 11.2% calc(100% - 58px), #ffd97a, transparent 75%),
      radial-gradient(3px 4px at 88.8% calc(100% - 58px), #ffd97a, transparent 75%),
      linear-gradient(#0c1020,#0c1020) 10% 100%/56px 122px,
      linear-gradient(#0c1020,#0c1020) 90% 100%/56px 122px,
      repeating-linear-gradient(90deg,#0c1020 0 22px,transparent 22px 38px) left calc(100% - 72px)/100% 15px,
      linear-gradient(180deg,#0c1020,#10152b) left bottom/100% 72px;
    background-repeat:no-repeat;}
  .scr h1{font-size:34px;letter-spacing:2px;
    background:linear-gradient(180deg,#ffe9a3,#ffc94d 55%,#d99a1f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));}
  #lobby .crown{font-size:40px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
    animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .scr .sub{font-size:12px;color:var(--sub);margin-bottom:14px;}
  .mode-btn{width:min(360px,86vw);background:var(--panel);border:1.5px solid var(--panel2);border-radius:14px;
    padding:14px 18px;color:var(--text);text-align:left;cursor:pointer;font-size:15px;transition:transform .08s,border-color .08s;}
  .mode-btn:hover{transform:translateY(-2px);border-color:var(--accent);}
  .mode-btn b{color:var(--gold);font-size:16px;}
  .mode-btn .d{display:block;font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .mode-btn.locked{opacity:.45;cursor:default;}
  .mode-btn.locked:hover{transform:none;border-color:var(--panel2);}
  .scr .back{background:none;border:1px solid var(--panel2);color:var(--sub);border-radius:8px;padding:8px 20px;cursor:pointer;margin-top:10px;}
  .k-card{width:min(360px,86vw);background:var(--panel);border:1.5px solid var(--panel2);border-radius:14px;padding:14px 18px;
    color:var(--text);text-align:left;cursor:pointer;font-size:14px;}
  .k-card:hover{border-color:var(--accent);}
  .k-card .prog{font-size:11px;color:var(--green);margin-top:4px;}
  .k-card.locked{opacity:.45;cursor:default;}
  .stage-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;width:min(360px,86vw);}
  .stage-btn{background:var(--panel);border:1.5px solid var(--panel2);border-radius:10px;padding:10px 14px;
    color:var(--text);text-align:left;cursor:pointer;font-size:13.5px;}
  .stage-btn:hover{border-color:var(--accent);}
  .stage-btn .d{display:block;font-size:11px;color:var(--sub);margin-top:3px;}
  .stage-btn.clear{border-color:var(--green);}
  .stage-btn.clear::after{content:" ✔";color:var(--green);}
  .stage-btn.locked{opacity:.4;cursor:default;}
  #pvp-spin{width:44px;height:44px;border:4px solid var(--panel2);border-top-color:var(--elixir);border-radius:50%;
    animation:spin 0.9s linear infinite;margin:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #tut-bar{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:92%;z-index:5;
    background:rgba(20,24,40,.92);border:1.5px solid var(--gold);border-radius:10px;padding:8px 14px;
    font-size:12.5px;color:var(--text);display:none;line-height:1.55;box-shadow:0 3px 12px rgba(0,0,0,.4);}
  #ov-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div style="display:flex;gap:4px;">
      <button onclick="toLobby()" title="로비로">🏠</button>
      <button onclick="restart()">↺</button>
      <button onclick="cycleDiff()" id="diff-btn" title="난이도 (연습 모드, 변경 시 재시작)">보통</button>
    </div>
    <div><span id="tier-label">타운 홀</span> <span id="time-label" style="color:var(--sub)"></span></div>
    <div style="display:flex;gap:4px;">
      <button onclick="SND.toggle()" id="snd-btn" title="사운드 켜기/끄기">🔊</button>
      <button onclick="toggleEditor()" title="밸런스 에디터">⚙</button>
      <button onclick="togglePause()" id="pause-btn" title="일시 정지">⏸</button>
      <button onclick="toggleSpeed()" id="spd-btn">▶ ×1</button>
    </div>
  </div>
  <div id="cv-wrap"><canvas id="cv" width="476" height="816"></canvas><div id="bubble"></div><div id="tut-bar"></div></div>
  <div id="bottom">
    <div id="elixir-row">
      <div id="elixir-num">0/10</div>
      <div id="elixir-bar"><div id="elixir-fill"></div></div>
      <div id="star-chip" title="엘릭서 스타 — 영웅 소환 재화. 비용 부족 시 자동으로 녹아 사용됩니다" style="display:flex;align-items:center;justify-content:center;">★0</div>
    </div>
    <div id="mode-row">
      <button id="swap-btn" onclick="swapMode()">⇄<br>건설</button>
      <div id="panel"></div>
    </div>
  </div>
</div>
<div id="overlay"><div class="box">
  <h2 id="ov-title"></h2>
  <div class="detail" id="ov-detail"></div>
  <div id="ov-btns"><button onclick="restart()">다시 시작</button></div>
</div></div>

<!-- ---------- 로비·모드 선택 화면 (2026-09-04) ---------- -->
<div id="lobby" class="scr">
  <div class="crown">👑</div>
  <h1>킹덤 크래프트</h1><div class="sub">프로토타입 — 모드를 선택하세요</div>
  <button class="mode-btn" onclick="startTutorial()"><b>🎓 튜토리얼</b><span class="d" id="lb-tut">기본 조작과 개념을 플레이로 배웁니다</span></button>
  <button class="mode-btn" onclick="showKingdoms()"><b>🗺 스토리 모드</b><span class="d" id="lb-story">왕국을 골라 거점을 1단계부터 공략합니다</span></button>
  <button class="mode-btn" onclick="showPvp()"><b>⚔ 대전 모드</b><span class="d">다른 플레이어와 1:1 매칭 (프로토타입: 스파링)</span></button>
  <button class="mode-btn" onclick="startPractice()"><b>🛠 연습 모드</b><span class="d">자유 대전 — 난이도·밸런스 에디터로 실험</span></button>
</div>
<div id="kingdoms" class="scr">
  <h1 style="font-size:24px;">왕국 선택</h1><div class="sub">이전 왕국을 정복해야 다음 왕국이 열립니다</div>
  <div id="k-list" style="display:flex;flex-direction:column;gap:10px;"></div>
  <button class="back" onclick="showScr('lobby')">← 로비로</button>
</div>
<div id="stages" class="scr">
  <h1 style="font-size:22px;" id="st-title"></h1><div class="sub" id="st-desc"></div>
  <div class="stage-list" id="st-list"></div>
  <button class="back" onclick="showKingdoms()">← 왕국 선택</button>
</div>
<div id="pvp-scr" class="scr">
  <h1 style="font-size:24px;">⚔ 대전 매칭</h1>
  <div id="pvp-spin" style="display:none;"></div>
  <div class="sub" id="pvp-status">대전 방식을 선택하세요</div>
  <input id="pvp-url" placeholder="릴레이 서버 주소 (예: ws://localhost:8787)"
    style="width:min(340px,84vw);background:var(--panel);border:1.5px solid var(--panel2);border-radius:8px;
           padding:9px 12px;color:var(--text);font-size:12.5px;">
  <button class="mode-btn" onclick="pvpConnect()"><b>🌐 실시간 매칭</b><span class="d">릴레이 서버로 다른 플레이어와 1:1 락스텝 대전</span></button>
  <button class="mode-btn" onclick="pvpSparring()"><b>🤖 스파링</b><span class="d">AI 상대와 즉시 대전 (어려움)</span></button>
  <button class="back" onclick="cancelPvp()">← 로비</button>
</div>
<div id="toast"></div>
<div id="editor">
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
    <b style="flex:1;color:var(--gold);">⚙ 밸런스 에디터</b>
    <button class="ed-btn" onclick="edPause()" id="ed-pause">⏸</button>
    <button class="ed-btn" onclick="edReplaySave()" title="현재 판을 리플레이로 내보내기">REC</button>
    <button class="ed-btn" onclick="edReplayPlay()" title="리플레이 JSON 재생">▶R</button>
    <button class="ed-btn" onclick="edExport()">내보내기</button>
    <button class="ed-btn" onclick="edReset()">초기화</button>
    <button class="ed-btn" onclick="toggleEditor()">✕</button>

    for(let y=f.y0;y<=f.y1;y++)for(let x=f.x0;x<=f.x1;x++){
      if(!tiles[y]||!tiles[y][x])continue;
      tiles[y][x].terr=f.t; tiles[y][x].build=false;
      if(!td.deploy)tiles[y][x].deploy=false;
    }
  });
  /* 길: 건설 불가, 유닛 이동·배치 가능 — 맵에 따라 여러 갈래 지원 (2026-09-04) */
  (BAL.ROADS||[BAL.ROAD]).forEach(rd=>{
    for(let y=rd.y0;y<=rd.y1;y++)for(let x=rd.x0;x<=rd.x1;x++)
      if(tiles[y]&&tiles[y][x]){tiles[y][x].road=true;tiles[y][x].build=false;tiles[y][x].terr=null;tiles[y][x].deploy=true;}
  });
  return tiles;
}
/* 지상 유닛의 현재 타일 지형 이속 배율 (공중 유닛은 무시) */
function terrSpd(u){
  if(u.air)return 1;
  const tx=Math.floor(u.x/TILE),ty=Math.floor(u.y/TILE);
  const t=S.tiles[ty]&&S.tiles[ty][tx];
  return (t&&t.terr)?(TERR[t.terr].spd||1):1;
}
/* ---------- 지상 경로 탐색 (2026-09-07): 강·성벽 이동 불가화 ----------
   직선이 뚫려 있으면 그대로 직진(기존 동작), 막혀 있을 때만 A*로 우회.
   격자 19×24라 비용이 작고, 경로는 유닛별 캐시 + 1.2초 주기 재계산 */
function passableTile(tx,ty){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return false;
  const tr=S.tiles[ty][tx].terr;
  return !(tr&&TERR[tr].pass===false);
}
function lineClear(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(d/(TILE*0.25)));
  for(let i=1;i<=n;i++){
    const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n;
    if(!passableTile(Math.floor(x/TILE),Math.floor(y/TILE)))return false;
  }
  return true;
}
function findPath(sx,sy,gx,gy){
  if(!passableTile(gx,gy)){   // 목표 타일이 막혀 있으면 인접 통행 타일로 보정
    let best=null,bd=1e9;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=gx+dx,ny=gy+dy;
      if(passableTile(nx,ny)){const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=[nx,ny];}}}
    if(!best)return null; gx=best[0];gy=best[1];
  }
  const key=(x,y)=>y*COLS+x;
  const open=[{x:sx,y:sy,g:0,f:0}], came={}, gs={}; gs[key(sx,sy)]=0;
  const closed=new Set();
  while(open.length){
    let bi=0;for(let i=1;i<open.length;i++)if(open[i].f<open[bi].f)bi=i;
    const cur=open.splice(bi,1)[0], ck=key(cur.x,cur.y);
    if(closed.has(ck))continue; closed.add(ck);
    if(cur.x===gx&&cur.y===gy){
      const path=[]; let k=ck;
      while(came[k]!==undefined){const x=k%COLS,y=(k-x)/COLS;path.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2});k=came[k];}
      path.reverse(); return path;
    }
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cur.x+dx,ny=cur.y+dy;
      if(!passableTile(nx,ny))continue;
      if(dx&&dy&&(!passableTile(cur.x+dx,cur.y)||!passableTile(cur.x,cur.y+dy)))continue;   // 코너 컷 방지
      const ng=cur.g+(dx&&dy?1.414:1), nk=key(nx,ny);
      if(gs[nk]!==undefined&&gs[nk]<=ng)continue;
      gs[nk]=ng; came[nk]=ck;
      open.push({x:nx,y:ny,g:ng,f:ng+Math.hypot(nx-gx,ny-gy)});
    }
    if(closed.size>COLS*ROWS)break;
  }
  return null;
}
/* 지상 유닛 스마트 이동: 직선 우선, 막히면 경로 따라 우회 (공중은 항상 직진) */
function moveSmart(u,tx,ty,step,dt){
  if(u.air||lineClear(u.x,u.y,tx,ty)){u.path=null;moveToward(u,tx,ty,step);return;}
  const gx=Math.max(0,Math.min(COLS-1,Math.floor(tx/TILE)));
  const gy=Math.max(0,Math.min(ROWS-1,Math.floor(ty/TILE)));
  u.pathT=(u.pathT||0)-dt;
  const goalMoved=!u.pathGoal||Math.abs(u.pathGoal.x-gx)+Math.abs(u.pathGoal.y-gy)>1;
  if(!u.path||!u.path.length||goalMoved||u.pathT<=0){
    u.path=findPath(Math.floor(u.x/TILE),Math.floor(u.y/TILE),gx,gy);
    u.pathGoal={x:gx,y:gy}; u.pathT=1.2;
  }
  if(!u.path||!u.path.length){moveToward(u,tx,ty,step);return;}   // 경로 없음 — 최후 직진 (기존 동작)
  while(u.path.length>1&&lineClear(u.x,u.y,u.path[1].x,u.path[1].y))u.path.shift();   // 지름길 당기기
  if(u.path.length&&Math.hypot(u.path[0].x-u.x,u.path[0].y-u.y)<8)u.path.shift();
  const wp=u.path.length?u.path[0]:{x:tx,y:ty};
  setFacing(u,wp.x-u.x,wp.y-u.y);   // 우회 중에는 이동 방향을 바라본다
  moveToward(u,wp.x,wp.y,step);
}

/* ---------- 사운드 (Web Audio 절차 합성 — 외부 파일 없음, 2026-09-04) ----------
   단일 파일 원칙 유지: 모든 SFX·BGM을 오실레이터/노이즈로 실시간 합성.
   - SND.play(name): 종류별 최소 간격(rate limit)으로 과밀 방지
   - 첫 입력 제스처에서 AudioContext 잠금 해제 (브라우저 자동재생 정책)
   - 🔊 버튼 토글, 음소거 상태는 localStorage 유지 */
const SND=(()=>{
  let ac=null,master=null,sfx=null,bgmG=null;
  let muted=false; try{muted=localStorage.getItem("rs_mute")==="1";}catch(e){}
  const last={};
  function ensure(){
    if(ac)return true;
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
      sfx=ac.createGain();sfx.gain.value=0.55;sfx.connect(master);
      bgmG=ac.createGain();bgmG.gain.value=0.13;bgmG.connect(master);
      startBgm();
    }catch(e){ac=null;return false;}
    return true;
  }
  function unlock(){if(!ensure())return;if(ac.state==="suspended")ac.resume();}
  function tone(f0,f1,dur,type,vol,when,dest){
    const t=ac.currentTime+(when||0);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"square";o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+dur+0.03);
  }
  function noise(dur,vol,fCut,when){
    const t=ac.currentTime+(when||0);
    const n=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,n,ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource();src.buffer=buf;
    const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=fCut||900;
    const g=ac.createGain();g.gain.value=vol;
    src.connect(f);f.connect(g);g.connect(sfx);src.start(t);
  }
  /* name: [최소 간격(ms), 합성 함수] */
  const DEF={
    click:    [40, ()=>tone(660,880,0.05,"square",0.10)],
    place:    [80, ()=>{noise(0.12,0.30,500);tone(160,90,0.14,"sine",0.28);}],
    demolish: [120,()=>{noise(0.30,0.38,400);tone(120,60,0.30,"sine",0.28);}],
    transform:[120,()=>{[440,587,784].forEach((f,i)=>tone(f,f,0.09,"triangle",0.20,i*0.07));}],
    levelup:  [120,()=>{[523,659].forEach((f,i)=>tone(f,f,0.09,"triangle",0.20,i*0.08));}],
    tierup:   [300,()=>{[392,523,659,784].forEach((f,i)=>tone(f,f,0.14,"triangle",0.24,i*0.10));}],
    spawn:    [250,()=>tone(300,430,0.06,"triangle",0.07)],
    hero:     [300,()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,0.12,"triangle",0.24,i*0.08));noise(0.25,0.10,3000);}],
    melee:    [70, ()=>{noise(0.05,0.20,2500);tone(220,140,0.05,"square",0.09);}],
    shoot:    [70, ()=>tone(1200,500,0.07,"sawtooth",0.07)],
    magic:    [90, ()=>tone(900,1400,0.10,"sine",0.10)],
    boom:     [120,()=>{noise(0.30,0.45,700);tone(120,50,0.30,"sine",0.30);}],
    destroy:  [250,()=>{noise(0.55,0.55,500);tone(100,40,0.50,"sine",0.36);}],
    star:     [200,()=>{[880,1174,1568].forEach((f,i)=>tone(f,f,0.08,"sine",0.18,i*0.06));}],
    win:      [999,()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,0.22,"triangle",0.28,i*0.13));}],
    lose:     [999,()=>{[392,330,262,196].forEach((f,i)=>tone(f,f,0.26,"sawtooth",0.16,i*0.16));}],
    error:    [150,()=>tone(220,180,0.10,"square",0.10)],
  };
  function play(name){
    if(!ac||muted)return;
    const d=DEF[name];if(!d)return;
    const now=performance.now();
    if(last[name]&&now-last[name]<d[0])return;
    last[name]=now;
    try{d[1]();}catch(e){}
  }
  /* BGM: 성긴 펜타토닉 고정 패턴 (32스텝 루프, 낮은 볼륨) */
  const SCALE=[262,294,330,392,440,523,587,659];
  const MEL=[0,null,2,null,4,null,2,null, 3,null,1,null,2,null,null,null,
             4,null,5,null,7,null,5,null, 4,null,2,null,0,null,null,null];
  const BASS=[0,0,2,1];   // SCALE 인덱스 (한 옥타브 아래로)
  let step=0,bgmInt=null;
  function startBgm(){
    if(bgmInt)return;
    bgmInt=setInterval(()=>{
      if(!ac||muted||ac.state!=="running")return;
      const bar=Math.floor(step/8)%4, st=step%8;
      if(st%2===0)tone(SCALE[BASS[bar]]/4,0,0.22,"triangle",0.40,0,bgmG);
      const m=MEL[step%32];
      if(m!==null)tone(SCALE[m],0,0.16,"square",0.22,0,bgmG);
      step++;
    },250);
  }
  function toggle(){
    muted=!muted;
    try{localStorage.setItem("rs_mute",muted?"1":"0");}catch(e){}
    if(master)master.gain.value=muted?0:1;
    const b=document.getElementById("snd-btn");if(b)b.textContent=muted?"🔇":"🔊";
    unlock();
  }
  window.addEventListener("pointerdown",unlock,{capture:true});
  return {play,toggle,muted:()=>muted};
})();
/* UI 버튼 공통 클릭음 + 저장된 음소거 상태를 버튼 아이콘에 반영 */
document.addEventListener("click",e=>{if(e.target.closest("button"))SND.play("click");},true);
(()=>{const b=document.getElementById("snd-btn");if(b&&SND.muted())b.textContent="🔇";})();

/* ---------- 초기화 ---------- */
function newGame(){

     elixir:BAL.ECON.start, tier:1, stars:0, eElixir:BAL.ECON.start, eTier:1, eStars:0, aiT:0, elapsed:0, over:false,

function restart(){
  if(typeof NET!=="undefined"&&NET.on){toast("실시간 대전 중에는 재시작할 수 없습니다");return;}
  if(GAME_CFG)startGame(GAME_CFG); else newGame();
}
function addBuilding(key,side,tx,ty){
  const d=BAL.BUILDINGS[key];
  const bhp=d.hp;   // 건물 HP는 양측 동일
  const b={key,side,tx,ty,w:d.w,h:d.h,hp:bhp,maxHp:bhp,level:1,prodT:0,cd:0,flash:0,boomed:false,
           id:++S.bldSeq,   // 커맨드(리플레이·PvP)에서 건물을 지칭하는 결정론적 id
           cx:(tx+d.w/2)*TILE, cy:(ty+d.h/2)*TILE};
  S.buildings.push(b); S.occ=null; S.zoneDirty=true;
  return b;
}
function aliveB(side,key){return S.buildings.some(b=>b.side===side&&b.key===key&&b.hp>0);}
/* 선행 조건: 문자열 또는 배열(하나만 충족하면 OK — 예: 워크숍 계열) */
function hasPrereq(side,prereq){
  if(!prereq)return true;
  return Array.isArray(prereq)?prereq.some(k=>aliveB(side,k)):aliveB(side,prereq);
}
function prereqName(prereq){
  if(!prereq)return"";
  return Array.isArray(prereq)?prereq.map(k=>BAL.BUILDINGS[k].nm).join("/"):BAL.BUILDINGS[prereq].nm;
}

/* ---------- 점유/영역/배치 판정 ---------- */
function occGrid(){
  if(S.occ) return S.occ;
  const g=[]; for(let y=0;y<ROWS;y++){g[y]=[];for(let x=0;x<COLS;x++)g[y][x]=null;}
  S.buildings.forEach(b=>{if(b.hp<=0)return;
    for(let dy=0;dy<b.h;dy++)for(let dx=0;dx<b.w;dx++){const y=b.ty+dy,x=b.tx+dx;if(g[y]&&g[y][x]!==undefined)g[y][x]=b;}});
  return S.occ=g;
}
function tileDist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
/* 아군 영역: 본진(반경 HALL_ZONE)·타워류(반경 TOWER_ZONE) 중심 기준 */
function inFriendlyZonePt(px,py,side){
  return S.buildings.some(b=>{
    if(b.side!==side||b.hp<=0)return false;
    const r=b.key==="hall"?BAL.HALL_ZONE:(b.key==="tower"||b.key==="guardTower"||b.key==="arcaneTower")?BAL.TOWER_ZONE:0;
    if(!r)return false;
    return tileDist(px,py,b.cx/TILE,b.cy/TILE)<=r;
  });
}
function inFriendlyZone(tx,ty,side){return inFriendlyZonePt(tx+0.5,ty+0.5,side);}
function inEnemyExclusion(tx,ty,side){
  /* 2026-08-31 개정: 배제는 적 "본진" 주변에만 적용 — 다른 적 건물 옆에는 건설 가능 (전선 맞대기 허용) */
  return S.buildings.some(b=>b.side!==side&&b.hp>0&&b.key==="hall"&&tileDist(tx+0.5,ty+0.5,b.cx/TILE,b.cy/TILE)<=BAL.EXCLUDE_R);
}
/* 건설 판정: 사유 문자열 반환(null=가능) */
function buildBlockReason(key,tx,ty,side){
  const d=BAL.BUILDINGS[key], occ=occGrid();
  if(tx<0||ty<0||tx+d.w>COLS||ty+d.h>ROWS)return"맵 밖";
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){
    const t=S.tiles[ty+dy][tx+dx];
    if(t.road)return"길 위에는 건설 불가";
    if(!t.build)return"건설 불가 타일";
    if(occ[ty+dy][tx+dx])return"다른 건물과 겹침";
    if(d.gas&&!t.gas)return"엘릭서 가스 타일 필요";
    if(!d.gas&&t.gas)return"가스 타일에는 엘릭서 기지만";
    if(inEnemyExclusion(tx+dx,ty+dy,side))return"적 본진 영역";
  }
  /* 영역 판정: 건물 중심 기준 (반경 절반 개정에 따른 완화 — 2026-08-30) */
  if(!inFriendlyZonePt(tx+d.w/2,ty+d.h/2,side))return"아군 영역 밖";
  return null;
}
/* 영웅 배치 판정 (side 인식 — PvP 게스트는 위 진영) */
function heroBlockReason(x,y,side){
  side=side||MYSIDE;
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return"맵 밖";
  if(!S.tiles[ty][tx].deploy)return"배치 불가 타일";
  if(occGrid()[ty][tx])return"건물 위 배치 불가";
  if(!inFriendlyZone(tx,ty,side))return"아군 영역 밖";
  return null;
}

/* ---------- 티어 ---------- */
/* 배럭 계열(배럭·슈터 가든·기사단 회당) 보유 여부 — 킵 승급 조건 */
const BARRACKS_LINE=["barracks","shieldBarracks","assaultBarracks","knightHall","archery","shooterGarden"];
function hasBarracksLine(side){return BARRACKS_LINE.some(k=>aliveB(side,k));}
const SANCTUM_LINE=["sanctum","dragonNest","golemCradle"];   // 캐슬 조건: 생텀 또는 그 변형
function hasSanctumLine(side){return SANCTUM_LINE.some(k=>aliveB(side,k));}
function effTier(side){
  const purchased=side==="player"?S.tier:S.eTier;
  let chain=1;
  if(hasBarracksLine(side))chain=2;        // 킵 조건: 배럭 또는 그 변형 (2026-08-30 개정)
  if(chain===2&&hasSanctumLine(side))chain=3;
  return Math.min(purchased,chain);
}
const TIER_NM=["","타운 홀","킵","캐슬"];
function capFor(side){return BAL.ECON.cap[effTier(side)];}
/* 본진 티어 방어: 받는 피해 배율 (티어가 오를수록 단단해짐, 2026-09-04) */
function bldgDefMult(b){
  if(b.key==="hall"){const hd=BAL.BUILDINGS.hall.hDef;if(hd)return hd[effTier(b.side)]||1;}
  return 1;
}
/* 본진 유효 사거리 = max(본진 설정값, 모든 타워 공격 사거리) — 본진이 타워에 아웃레인지되지 않게 보장 (2026-09-04) */
function hallAtkRng(){
  let r=BAL.BUILDINGS.hall.hAtk.rng;
  for(const k in BAL.BUILDINGS){const a=BAL.BUILDINGS[k].atk;if(a&&a.rng>r)r=a.rng;}
  return r;
}
function elixirCap(){return capFor("player");}
function elixirOf(side){return side==="player"?S.elixir:S.eElixir;}
function starsOf(side){return side==="player"?S.stars:S.eStars;}
/* 유효 엘릭서 = 보유 엘릭서 + 스타×현재 상한. 모든 비용 판정은 이 값 기준 (2026-09-04) */
function effElixir(side){return elixirOf(side)+starsOf(side)*capFor(side);}
/* 지출: 보유 엘릭서가 모자라면 스타를 자동으로 녹여 충당 (수동 녹이기 폐지) */
function spend(side,amt){
  const cap=capFor(side);
  if(side==="player"){
    let melted=0;
    while(S.elixir<amt&&S.stars>0){S.stars--;S.elixir+=cap;melted++;}
    S.elixir-=amt;
    if(melted>0&&side===MYSIDE){toast("★ 스타 "+melted+"개 자동 사용");renderPanel();}
  }else{
    while(S.eElixir<amt&&S.eStars>0){S.eStars--;S.eElixir+=cap;}
    S.eElixir-=amt;
  }
}
/* 스타 지불 (양측 공용) — 승급·변형 재화. 엘릭서로 대체 불가 (상한 도달 적립으로만 획득) */
function spendStars(side,n){
  if(starsOf(side)<n)return false;
  if(side==="player")S.stars-=n; else S.eStars-=n;
  return true;
}
/* 티어 승급 (양측 공용) — 비용: 엘릭서 스타 (킵 ★1 / 캐슬 ★2, 2026-09-07 개편) */
function doTierUp(side){
  const cur=side==="player"?S.tier:S.eTier;
  if(cur>=3)return false;
  const nt=cur+1, need=BAL.ECON.tierStars[nt];
  const ok=nt===2?hasBarracksLine(side):hasSanctumLine(side);
  if(!ok||!spendStars(side,need))return false;
  if(side==="player")S.tier=nt; else S.eTier=nt;
  if(side===MYSIDE)toast(TIER_NM[nt]+" 승급! (★"+need+") 최대 엘릭서 "+BAL.ECON.cap[nt]);
  else toast("⚠ 상대가 "+TIER_NM[nt]+"(으)로 승급!");
  const hall=S.buildings.find(b=>b.side===side&&b.key==="hall"&&b.hp>0);
  if(hall)burst(hall.cx,hall.cy,"255,220,120",20,160);
  if(side===MYSIDE){renderPanel();hideStrip();}   // 실행 후 말풍선 닫기
  return true;
}

/* 유닛 레벨 배율: 생산 건물 레벨이 곧 유닛 레벨 (2026-08-30 개정) */
function lvMult(level){return 1+BAL.UPG_PWR*((level||1)-1);}
/* 레벨업 비용 (레벨당 고정, 2026-09-07): 건물 등급별 — 1티어 건설 4 / 킵 건설 8 / 변형 획득 12 */
function upCostFor(bOrKey){
  const key=bOrKey&&bOrKey.key?bOrKey.key:bOrKey;
  const d=BAL.BUILDINGS[key];if(!d)return 999;
  /* 건물 등급: 건설 패널에서 직접 짓는 건물 = 자체 요구 티어(1/2), 변형으로만 얻는 건물 = 3등급 */
  const cls=PANEL_BUILDS.includes(key)?(d.tier||1):3;
  const a=BAL.ECON.upPerLevel;
  return a[Math.min(cls,a.length-1)]||a[a.length-1];
}
/* 변형 비용 (★, 2026-09-08 개정): 관련 건물의 **건설 티어** 기준 —
   max(원본 건물 건설 티어, 사전 조건 건물들의 건설 티어). 레벨 조건·캐슬 게이트는 비용에 반영하지 않는다.
   → 1티어(스트롱홀드) 건물 계열 ★1, 2티어(킵) 계열 ★2. 캐슬에서 건설되는 건물이 없으므로 ★3은 발생하지 않음 */
function transformReqTier(fromKey,toKey){
  const tr=(BAL.BUILDINGS[fromKey].transforms||[]).find(x=>x.key===toKey)||{};
  let t=(BAL.BUILDINGS[fromKey]||{}).tier||1;   // 원본 건물의 건설 티어
  (tr.prereq||[]).forEach(k=>{const d=BAL.BUILDINGS[k];if(d&&PANEL_BUILDS.includes(k))t=Math.max(t,d.tier||1);});   // 사전 조건 건물(직접 건설 가능한 것만)의 건설 티어
  return Math.max(1,Math.min(2,t));
}
function transformStarsFor(fromKey,toKey){
  const a=BAL.ECON.transformStars, r=transformReqTier(fromKey,toKey);
  return a[Math.min(r,a.length-1)]||r;
}

/* ---------- 유닛/영웅 ---------- */
/* ---------- 8방향 대응 구조 (2026-09-04) ----------
   dir8: 0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE (화면 기준, y+ = 남쪽)
   - 이동 중엔 이동 벡터, 교전 중엔 목표 방향으로 매 틱 갱신. 정지 시 마지막 방향 유지.
   - 렌더는 u.dir8만 참조 → 8방향 시트 아트가 준비되면 registerUnitSheet() 등록만으로 교체됨. */
const DIR8_VEC=[[1,0],[0.707,0.707],[0,1],[-0.707,0.707],[-1,0],[-0.707,-0.707],[0,-1],[0.707,-0.707]];
function setFacing(u,dx,dy){
  if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5)return;
  u.face=Math.atan2(dy,dx);
  u.dir8=((Math.round(u.face/(Math.PI/4))%8)+8)%8;
  if(Math.abs(dx)>2)u.fx=dx>0?1:-1;   // (구) 좌우 플립 필드 호환 유지
}
function spawnUnit(key,side,x,y,hero,level){
  const d=hero?BAL.HEROES[key]:BAL.UNITS[key];
  const u={key,side,hero:!!hero,nm:d.nm,x,y,hp:d.hp,maxHp:d.hp,dmg:d.dmg,hs:d.hs,rng:d.rng,spd:d.spd*TILE,r:d.r,
           cat:d.cat||null, air:!!d.air, antiair:!!d.antiair, melee:!!d.melee, splash:d.splash||0, bldgOnly:!!d.bldgOnly,
           rangedResist:d.rangedResist||0, prefRanged:!!d.prefRanged, pierceVsMelee:d.pierceVsMelee||0, rangedWeak:d.rangedWeak||0,
           aura:d.aura||null, heal:d.heal||0, aoe:d.aoe?{...d.aoe,t:0}:null,
           cd:0, deploy:0.6, animT:Math.random()*6.28, swing:0, flash:0, fx:side==="player"?1:-1, moving:false,
           bAtk:1,bDef:1, slowT:0};
  u.spd=d.spd*TILE;   // 타일/초 → px/초
  /* 초기 방향: 상대 본진 쪽 (플레이어 = 북, 적 = 남) */
  u.face=side==="player"?-Math.PI/2:Math.PI/2;
  u.dir8=side==="player"?6:2;
  /* 유닛 레벨: 생산 건물 레벨을 그대로 계승 — 스탯에 즉시 반영 (영웅은 레벨 1) */
  u.level=hero?1:(level||1);
  if(u.level>1){const lm=lvMult(u.level);u.hp*=lm;u.maxHp*=lm;u.dmg*=lm;}
  S.units.push(u);
  return u;
}
function unitCount(side){return S.units.filter(u=>u.side===side&&!u.hero).length;}
function canHit(att,tgt){return tgt.air?!!att.antiair:true;}

function nearestTarget(u){
  const foe=u.side==="player"?"enemy":"player";
  let best=null,bd=1e9;
  /* 공성 유닛(bldgOnly)은 유닛을 완전히 무시하고 건물만 노린다 */
  if(!u.bldgOnly){
    /* 기병 계열(prefRanged): 시야 내 원거리 유닛을 최우선으로 노린다 */
    if(u.prefRanged){
      S.units.forEach(e=>{if(e.side!==foe||e.hp<=0||e.deploy>0||e.melee)return;
        if(!canHit(u,e))return;
        const d=Math.hypot(u.x-e.x,u.y-e.y); if(d<bd&&d<=6*TILE){bd=d;best=e;}});
      if(best)return best;
    }
    S.units.forEach(e=>{if(e.side!==foe||e.hp<=0||e.deploy>0)return;
      if(!canHit(u,e))return;
      const d=Math.hypot(u.x-e.x,u.y-e.y); if(d<bd&&d<=6*TILE){bd=d;best=e;}});
    if(best)return best;
  }
  best=null;bd=1e9;
  S.buildings.forEach(b=>{if(b.side!==foe||b.hp<=0)return;
    const d=Math.hypot(u.x-b.cx,u.y-b.cy); if(d<bd){bd=d;best=b;}});
  return best;
}
function dealDamage(att,tgt,amount){
  /* 레벨 보정은 스폰 시 스탯에 반영됨 — 여기서는 오라 배율만 적용 */
  let dmg=amount*att.bAtk;
  /* 영웅의 대건물 피해 감쇄 (2026-09-04): 영웅은 유닛전 특화 — 건물 철거는 병력·공성의 몫 */
  if(att.hero&&tgt.cx!==undefined)dmg*=(BAL.HERO_VS_BLDG!==undefined?BAL.HERO_VS_BLDG:0.15);
  /* 본진 티어 방어 (받는 피해 배율) */
  if(tgt.cx!==undefined)dmg*=bldgDefMult(tgt);
  if(tgt.maxHp!==undefined&&tgt.bDef)dmg/=tgt.bDef;
  /* 쉴드맨: 원거리 물리 공격 경감 (마법 계열은 그대로 받음) */
  if(tgt.rangedResist&&!att.melee&&(att.cat==="gp"||att.cat==="ap"))dmg*=(1-tgt.rangedResist);
  /* 기병 계열 창 관통: 근접 유닛 상대 추가 피해 */
  if(att.pierceVsMelee&&tgt.melee)dmg*=(1+att.pierceVsMelee);
  /* 기병 계열 약점: 원거리 공격에 추가 피해 */
  if(tgt.rangedWeak&&att.melee===false&&att.r!==undefined)dmg*=(1+tgt.rangedWeak);
  tgt.hp-=dmg; tgt.flash=0.15;
}
function unitUpdate(u,dt){
  u.swing=Math.max(0,u.swing-dt); u.flash=Math.max(0,u.flash-dt);
  u.moving=false;
  if(u.deploy>0){u.deploy-=dt;if(u.deploy<=0)burst(u.x,u.y+u.r*0.6,"205,195,165",6,80);return;}
  u.animT+=dt*7;
  /* 팔라딘 회복 (실제 회복된 유닛에 초록 + 연출) */
  if(u.heal){S.units.forEach(a=>{if(a.side===u.side&&a!==u&&a.hp>0&&Math.hypot(a.x-u.x,a.y-u.y)<=BAL.AURA_R*TILE){
    const before=a.hp;
    a.hp=Math.min(a.maxHp,a.hp+u.heal*dt);
    if(a.hp>before){
      a.healFxT=(a.healFxT||0)-dt;
      if(a.healFxT<=0){a.healFxT=0.8;
        S.effects.push({tp:"ftext",x:a.x+(Math.random()-.5)*8,y:a.y-a.r-6,text:"+",t:0.6,t0:0.6,col:"140,255,160"});}
    }
  }});}
  /* 블러드 메이지 광역 */
  if(u.aoe){u.aoe.t-=dt;
    if(u.aoe.t<=0){
      const foe=u.side==="player"?"enemy":"player";
      let best=null,bd=1e9;
      S.units.forEach(e=>{if(e.side!==foe||e.hp<=0)return;const d=Math.hypot(u.x-e.x,u.y-e.y);if(d<bd&&d<=u.aoe.castRng*TILE){bd=d;best=e;}});
      if(best){u.aoe.t=u.aoe.period; u.swing=0.3;
        S.effects.push({tp:"boom",x:best.x,y:best.y,rad:u.aoe.rad*TILE,t:0.35,t0:0.35,col:"255,80,80"});
        burst(best.x,best.y,"255,90,90",10,140);SND.play("boom");
        S.units.forEach(e=>{if(e.side===foe&&e.hp>0&&Math.hypot(e.x-best.x,e.y-best.y)<=u.aoe.rad*TILE)dealDamage(u,e,u.aoe.dmg);});
      } else u.aoe.t=0.4;
    }
    /* 블러드 메이지는 기본 공격 없음 → 이동만.
       (버그 수정 2026-09-04: 목표가 건물이면 cx/cy를 써야 함 — x/y 참조로 NaN이 되어 제자리에 서던 문제) */
    const tgt=nearestTarget(u);
    if(tgt){
      const tx=tgt.x!==undefined?tgt.x:tgt.cx, ty=tgt.y!==undefined?tgt.y:tgt.cy;
      const d=Math.hypot(u.x-tx,u.y-ty);
      setFacing(u,tx-u.x,ty-u.y);
      if(d>u.aoe.castRng*TILE*0.8){moveSmart(u,tx,ty,u.spd*dt*terrSpd(u),dt);u.moving=true;}}
    return;
  }
  const tgt=nearestTarget(u);
  if(!tgt)return;
  const tr=tgt.r!==undefined?tgt.r:Math.max(tgt.w,tgt.h)*TILE/2;
  const reach=u.rng*TILE+u.r+tr;
  const ty=tgt.y!==undefined?tgt.y:tgt.cy, tx=tgt.x!==undefined?tgt.x:tgt.cx;
  const dd=Math.hypot(u.x-tx,u.y-ty);
  setFacing(u,tx-u.x,ty-u.y);   // 이동·교전 공통: 목표 방향으로 8방향 갱신
  if(dd<=reach){
    u.cd-=dt;
    if(u.cd<=0){
      if(u.splash){
        const foe=u.side==="player"?"enemy":"player";
        S.units.forEach(e=>{if(e.side===foe&&e.hp>0&&canHit(u,e)&&Math.hypot(e.x-tx,e.y-ty)<=u.splash*TILE)dealDamage(u,e,u.dmg);});
        if(tgt.cx!==undefined)dealDamage(u,tgt,u.dmg);
        S.effects.push({tp:"boom",x:tx,y:ty,rad:u.splash*TILE,t:0.25,t0:0.25,col:"190,120,255"});   // 광역 폭발 연출
        SND.play("boom");
      } else dealDamage(u,tgt,u.dmg);
      if(u.rng>2){S.effects.push({tp:"bullet",x1:u.x,y1:u.y-u.r*0.4,x2:tx,y2:ty,t:0.12,t0:0.12});SND.play("shoot");}
      else {hitFx(tx,ty);SND.play("melee");}
      u.swing=0.28; u.cd=u.hs;
    }
    return;
  }
  moveSmart(u,tx,ty,u.spd*dt*terrSpd(u),dt); u.moving=true;
}
function moveToward(u,tx,ty,step){const d=Math.hypot(tx-u.x,ty-u.y);if(d<1)return;
  u.x+=(tx-u.x)/d*step;u.y+=(ty-u.y)/d*step;
  u.x=Math.max(8,Math.min(W-8,u.x));u.y=Math.max(8,Math.min(H-8,u.y));}
function hitFx(x,y){S.effects.push({tp:"hit",x,y,t:0.18});}

/* 오라 재계산 (매 틱) */
function recomputeAuras(){
  S.units.forEach(u=>{u.bAtk=1;u.bDef=1;});
  S.units.forEach(h=>{
    if(!h.hero||!h.aura||h.hp<=0||h.deploy>0)return;
    const test=AURA_TESTS[h.aura.test]; if(!test)return;
    S.units.forEach(u=>{
      if(u.side!==h.side||u.hero||u.hp<=0)return;
      if(!test(u))return;
      if(Math.hypot(u.x-h.x,u.y-h.y)<=BAL.AURA_R*TILE){u.bAtk+=BAL.AURA_PWR;u.bDef+=BAL.AURA_PWR;}  // 중첩 허용 (가정)
    });
  });
}

/* ---------- 건물 로직 ---------- */
function buildingUpdate(b,dt){
  b.flash=Math.max(0,b.flash-dt);
  if(b.hp<=0)return;
  const d=BAL.BUILDINGS[b.key];
  /* 엘릭서 기지: 수급 주기마다 획득량 플로팅 연출 (상한 도달 시 생략) */
  if(b.key==="elixirBase"){
    b.gainT=(b.gainT||0)+dt;
    if(b.gainT>=BAL.ECON.regen){
      b.gainT-=BAL.ECON.regen;
      if(elixirOf(b.side)<capFor(b.side)-0.01){
        S.effects.push({tp:"ftext",x:b.cx,y:b.ty*TILE-4,text:"+"+BAL.ECON.gasBonus,
                        t:0.9,t0:0.9,col:b.side==="player"?"216,150,255":"255,150,150"});
        addP({x:b.cx-6,y:b.cy-8,vx:(Math.random()-.5)*20,vy:-30,g:-10,t:0,life:0.6,size:2.5,col:"200,130,250"});
        addP({x:b.cx+6,y:b.cy-6,vx:(Math.random()-.5)*20,vy:-26,g:-10,t:0,life:0.6,size:2,col:"230,180,255"});
      }
    }
  }
  /* 생산 (자동 웨이브) */
  if(d.prod&&unitCount(b.side)<BAL.UNIT_CAP){
    b.prodT+=dt;
    if(b.prodT>=d.prod.period){
      b.prodT=0;
      const dir=b.side==="player"?-1:1;
      /* 생산 건물의 레벨이 곧 유닛 레벨 (티어 상한 적용) */
      spawnUnit(d.prod.unit,b.side,b.cx+(grnd()-0.5)*TILE,b.cy+dir*(d.h/2+0.7)*TILE,false,
                Math.min(b.level,effTier(b.side)));   // 스폰 오프셋 = 시드 난수 (결정론)
      SND.play("spawn");
    }
  }
  /* 본진 공격: 티어에 따라 동시 공격 대상 수·공격력 상승.
     사거리는 어떤 타워보다도 짧지 않게 보장 (2026-09-04) — hallAtkRng() */
  if(d.hAtk){
    b.cd-=dt;
    if(b.cd<=0){
      const t=effTier(b.side), a=d.hAtk, hdm=a.dmg[t];
      const foe=b.side==="player"?"enemy":"player";
      const inR=S.units.filter(e=>e.side===foe&&e.hp>0&&e.deploy<=0&&Math.hypot(b.cx-e.x,b.cy-e.y)<=hallAtkRng()*TILE)
        .sort((p,q)=>Math.hypot(b.cx-p.x,b.cy-p.y)-Math.hypot(b.cx-q.x,b.cy-q.y))
        .slice(0,a.targets[t]);
      if(inR.length){
        inR.forEach(e=>{
          const rr=e.rangedResist?(1-e.rangedResist):1;   // 본진 투사체 = 물리
          e.hp-=hdm*rr/e.bDef;e.flash=0.12;
          S.effects.push({tp:"bullet",x1:b.cx,y1:b.cy-b.h*TILE/2,x2:e.x,y2:e.y,t:0.12,t0:0.12});
        });
        b.cd=a.hs;
        SND.play("shoot");
      } else b.cd=0.2;
    }
  }
  /* 타워 공격 (가드·아케인) — 유닛 우선, 사거리 내 유닛이 없으면 적 건물 공격 (2026-09-04) */
  if(d.atk){
    b.cd-=dt;
    if(b.cd<=0){
      const foe=b.side==="player"?"enemy":"player";
      let best=null,bd=1e9;
      S.units.forEach(e=>{if(e.side!==foe||e.hp<=0||e.deploy>0)return;
        const dd=Math.hypot(b.cx-e.x,b.cy-e.y);if(dd<bd&&dd<=d.atk.rng*TILE){bd=dd;best=e;}});
      if(best){
        const tdm=d.atk.dmg;
        /* 타워 투사체는 물리 (아케인 타워는 magic — 쉴드맨 저항 무시) */
        const resistOf=e=>(!d.atk.magic&&e.rangedResist)?(1-e.rangedResist):1;
        if(d.atk.splash){S.units.forEach(e=>{if(e.side===foe&&e.hp>0&&Math.hypot(e.x-best.x,e.y-best.y)<=d.atk.splash*TILE){e.hp-=tdm*resistOf(e)/e.bDef;e.flash=0.12;}});}
        else{best.hp-=tdm*resistOf(best)/best.bDef;best.flash=0.12;}
        b.cd=d.atk.hs;
        S.effects.push({tp:"bullet",x1:b.cx,y1:b.cy-b.h*TILE/2,x2:best.x,y2:best.y,t:0.12,t0:0.12});
        SND.play(d.atk.magic?"magic":"shoot");
      } else {
        /* 건물 공격: 중심 거리 - 목표 반경 기준으로 사거리 판정 */
        let bb=null,bbd=1e9;
        S.buildings.forEach(e=>{if(e.side!==foe||e.hp<=0)return;
          const dd=Math.hypot(b.cx-e.cx,b.cy-e.cy)-Math.max(e.w,e.h)*TILE/2;
          if(dd<bbd&&dd<=d.atk.rng*TILE){bbd=dd;bb=e;}});
        if(bb){
          bb.hp-=d.atk.dmg*(BAL.TOWER_VS_BLDG||1)*bldgDefMult(bb); bb.flash=0.12; b.cd=d.atk.hs;   // 대건물 감쇄 + 본진 티어 방어
          S.effects.push({tp:"bullet",x1:b.cx,y1:b.cy-b.h*TILE/2,x2:bb.cx,y2:bb.cy,t:0.12,t0:0.12});
          SND.play(d.atk.magic?"magic":"shoot");
        } else b.cd=0.2;
      }
    }
  }
}
/* 변형 (양측 공용) */
function transformBuilding(b,newKey){
  const need=transformStarsFor(b.key,newKey);   // 비용 = 엘릭서 스타 (2026-09-07)
  if(!spendStars(b.side,need)){if(b.side===MYSIDE){toast("엘릭서 스타 부족 (★"+need+" 필요)");SND.play("error");}return;}
  const nd=BAL.BUILDINGS[newKey];
  const ratio=b.hp/b.maxHp;
  /* 변형 시 레벨 초기화 (확정 규칙): 업그레이드한 건물을 변형하면 새 건물 Lv1부터 시작 */
  const lostLv=b.level;
  b.key=newKey; b.maxHp=nd.hp; b.hp=Math.round(nd.hp*ratio); b.prodT=0; b.level=1;
  if(lostLv>1&&b.side===MYSIDE)toast(nd.nm+"(으)로 변형 — 레벨 Lv"+lostLv+" → Lv1 초기화");
  S.occ=null; burst(b.cx,b.cy,"255,220,120",14,140);
  if(b.side===MYSIDE){SND.play("transform");renderPanel(); hideStrip();}   // 실행 후 말풍선 닫기
}
/* ---------- 적 건설 AI ---------- */
function findSpot(key,side,pref){
  const d=BAL.BUILDINGS[key];
  const hall=S.buildings.find(b=>b.side===side&&b.key==="hall"&&b.hp>0);
  if(!hall)return null;
  /* 미점유 가스 지역 중심 목록 (pref="gas"용) */
  const gasTargets=BAL.GAS_ZONES
    .filter(([gx,gy])=>!S.buildings.some(b=>b.side===side&&b.key==="elixirBase"&&b.hp>0&&b.tx===gx&&b.ty===gy))
    .map(([gx,gy])=>[gx+1,gy+1]);
  let best=null,bestScore=-1e9;
  for(let ty=0;ty<=ROWS-d.h;ty++)for(let tx=0;tx<=COLS-d.w;tx++){
    if(buildBlockReason(key,tx,ty,side))continue;
    const cx=tx+d.w/2, cy=ty+d.h/2;
    let score;
    if(pref==="fwd") score=(side==="enemy"?cy:-cy)-Math.abs(cx-COLS/2)*0.1;
    else if(pref==="gas") score=gasTargets.length? -Math.min(...gasTargets.map(([gx,gy])=>tileDist(cx,cy,gx,gy))) : -1e9;
    else if(pref&&pref.def) score=-tileDist(cx,cy,pref.def.x/TILE,pref.def.y/TILE);   // 위협 방향 방어 타워
    else score=-tileDist(cx,cy,hall.cx/TILE,hall.cy/TILE);
    if(score>bestScore){bestScore=score;best={tx,ty};}
  }
  return best;
}
/* ---------- 적 AI 전략 (난이도 = 전략 수준. 스탯·자원 규칙은 플레이어와 동등) ----------
   쉬움  : 느린 판단·경제만·레벨/변형 없음·킵까지 (연습용)
   보통  : 표준 운영 — 가스 2, 생산 2, 캐슬 테크, 유닛 Lv2, 변형 1회, 방어 반응
   어려움: 공격적 — 빠른 테크, 가스 3, 생산 4, 유닛 Lv3 풀 투자, 변형 2종, 셰어리, 전진 타워 압박 */
function aiUpdate(dt){
  const st=diff();
  if(S.elapsed<st.aiDelay)return;
  S.aiT+=dt;
  if(S.aiT<st.aiInterval)return;
  S.aiT=0;
  const side="enemy", tier=effTier(side);
  const cnt=k=>S.buildings.filter(b=>b.side===side&&b.hp>0&&b.key===k).length;
  const prodCnt=cnt("barracks")+cnt("shieldBarracks")+cnt("assaultBarracks")+cnt("shooterGarden")+cnt("knightHall");
  const towerCnt=cnt("tower")+cnt("guardTower")+cnt("arcaneTower");
  const maxTier=st.maxTier, maxLv=Math.min(st.maxLevel,tier);
  const tryB=(key,pref)=>{
    if(GAME_CFG&&GAME_CFG.allowB&&!GAME_CFG.allowB.has(key))return false;   // 스테이지 해금 규칙은 양측 동일
    const d=BAL.BUILDINGS[key];
    if(elixirOf(side)<d.cost)return false;   // AI는 건물 구매에 스타를 융해하지 않는다 — ★은 승급·변형·영웅 재원 (2026-09-07)
    if(d.tier>tier)return false;
    if(!hasPrereq(side,d.prereq))return false;
    const spot=findSpot(key,side,pref);
    if(!spot)return false;
    spend(side,d.cost);
    const b=addBuilding(key,side,spot.tx,spot.ty);
    burst(b.cx,b.cy,"205,195,165",10,110);
    return true;
  };
  const gasNeed=st.gasBases;

  /* 0) 방어 반응 — 침입 방향의 기본 타워를 즉시 공격형으로 변형, 없으면 거점 타워 건설 */
  if(st.defensive){
    const hall=S.buildings.find(b=>b.side===side&&b.key==="hall"&&b.hp>0);
    if(hall){
      /* 침입 판정: 유닛뿐 아니라 전진 건설된 적 건물(타워 크리핑)도 위협으로 간주 (2026-09-04) */
      let intruder=S.units.find(u=>u.side==="player"&&u.hp>0&&tileDist(u.x/TILE,u.y/TILE,hall.cx/TILE,hall.cy/TILE)<=10);
      let creepOnly=false;
      if(!intruder){
        let pb=null,pbd=1e9;
        S.buildings.forEach(b=>{if(b.side!=="player"||b.hp<=0)return;
          const dd=tileDist(b.cx/TILE,b.cy/TILE,hall.cx/TILE,hall.cy/TILE);
          if(dd<=12&&dd<pbd){pbd=dd;pb=b;}});
        if(pb){intruder={x:pb.cx,y:pb.cy};creepOnly=true;}
      }
      if(intruder){
        const canArc=(st.towerTf||0)>0&&tier>=3&&hasSanctumLine(side);
        const canGrd=(st.towerTf||0)>0&&tier>=2&&hasPrereq(side,["workshop","siegeWorkshop"]);
        /* 변형 가능한 기본 타워가 위협 근처에 있으면 — 변형 비용을 저축해서라도 즉시 공격형으로 (신규 타워 남발 금지) */
        if(canArc||canGrd){
          let bt=null,btd=1e9;
          S.buildings.forEach(x=>{if(x.side===side&&x.hp>0&&x.key==="tower"){
            const dd=Math.hypot(x.cx-intruder.x,x.cy-intruder.y);if(dd<btd&&dd<=8*TILE){btd=dd;bt=x;}}});
          if(bt){
            const tk=canArc?"arcaneTower":"guardTower";
            if(starsOf(side)>=transformStarsFor(bt.key,tk)){transformBuilding(bt,tk);return;}
            return;   // 스타 적립 대기 (지출 보류 → 상한 도달 → ★) — 기본 타워 남발 금지
          }
        }
        /* 신규 방어 타워 건설: 유닛 침입은 즉시. 건물 크리핑은 변형 능력이 생긴 뒤에만 (그 전엔 테크 우선) */
        if((!creepOnly||canArc||canGrd)&&towerCnt<st.towerMax&&tryB("tower",{def:{x:intruder.x,y:intruder.y}}))return;
      }
    }
  }
  /* 0-1) 영웅 소환 (어려움 이상) — 규칙은 플레이어와 동등: 비용 = 스타, 사망 시 쿨다운.
     침입자가 있으면 요격 위치에, 없으면 가장 전진한 아군 건물 앞에 투입.
     단, 킵 이전에는 금지 — 킵 비용(12)이 티어1 상한(10)을 넘어 스타가 승급 재원이기 때문 (2026-09-04) */
  if(st.heroUse&&S.eTier>=2&&S.eStars>=Math.max(1,BAL.HERO_COST)
     &&(cnt("guardTower")+cnt("arcaneTower"))>=(st.atkTwMin||0)){   // 스타는 방어 타워 확보가 먼저 (2026-09-07)
    const slot=(S.eHeroSlots||[]).find(s=>s.state==="ready");
    if(slot){
      const hall=S.buildings.find(b=>b.side===side&&b.key==="hall"&&b.hp>0);
      const intr=hall&&S.units.find(u=>u.side==="player"&&u.hp>0&&tileDist(u.x/TILE,u.y/TILE,hall.cx/TILE,hall.cy/TILE)<=10);
      let fx,fy;
      if(intr){fx=intr.x;fy=Math.max(TILE,intr.y-TILE*1.5);}
      else{
        let fb=null;S.buildings.forEach(b=>{if(b.side===side&&b.hp>0&&(!fb||b.cy>fb.cy))fb=b;});
        if(fb){fx=fb.cx;fy=Math.min(H-TILE,fb.cy+TILE*1.5);}
      }
      if(fx!==undefined){
        S.eStars-=Math.max(1,BAL.HERO_COST);
        slot.state="field"; slot.unit=spawnUnit(slot.key,side,fx,fy,true);
        burst(fx,fy,"255,210,90",14,150);SND.play("hero");
        return;
      }
    }
  }
  /* 1) 경제 우선 — 가스가 영역 밖이면 타워를 이어 확장.
     단, 최소 공격 타워(atkTwMin) 확보 전에는 가스 확장을 2까지만 (방어 테크 우선) */
  const tfNow=cnt("guardTower")+cnt("arcaneTower");
  const gasNow=((st.atkTwMin||0)>0&&tfNow<st.atkTwMin)?Math.min(gasNeed,2):gasNeed;
  if(cnt("elixirBase")<gasNow){
    if(tryB("elixirBase"))return;
    /* 가스가 영역 밖이면 타워로 확장 (공격형은 생산 라인을 먼저 갖춘 뒤에만) */
    if(towerCnt<st.towerMax&&(!st.aggro||prodCnt>=2)&&tryB("tower","gas"))return;
  }
  const prodPref=st.aggro?"fwd":null;   // 공격형: 생산 건물도 전방 배치
  /* 2) 최소 생산 라인 (킵 승급 조건 = 배럭 계열) */
  if(prodCnt<1&&tryB("barracks",prodPref))return;
  /* 3) 테크: 킵 승급 → 워크숍(킵 필요).
     킵도 캐슬처럼 저축 규칙 적용 — 승급 조건(배럭 계열)이 갖춰지면 저비용 지출로 새지 않게 비용을 모은다 */
  if(maxTier>=2){
    if(S.eTier<2){
      if(doTierUp(side))return;
      if(prodCnt>=1)return;   // 킵 비용 저축
    }
    if(cnt("workshop")<1&&cnt("siegeWorkshop")<1&&tryB("workshop"))return;
  }
  /* 3-1) 최소 공격 타워 조기 확보 (atkTwMin) — 기본 타워는 비무장이므로 방어의 1순위.
     기본 타워가 없으면 짓고, 있으면 변형 비용까지 저축(return)해서라도 즉시 변형 */
  if((st.atkTwMin||0)>0&&tier>=2){
    const tfCnt=cnt("guardTower")+cnt("arcaneTower");
    if(tfCnt<st.atkTwMin){
      const base=S.buildings.find(x=>x.side===side&&x.hp>0&&x.key==="tower");
      if(!base){
        if(towerCnt<st.towerMax&&tryB("tower","fwd"))return;
      } else if(hasPrereq(side,["workshop","siegeWorkshop"])||(tier>=3&&hasSanctumLine(side))){
        const tk=(tier>=3&&hasSanctumLine(side))?"arcaneTower":"guardTower";
        if(starsOf(side)>=transformStarsFor("tower",tk)){transformBuilding(base,tk);return;}
        return;   // 스타 적립 대기 — 아래 선택 지출 보류 (엘릭서 상한 도달 → ★)
      }
    }
  }
  /* 3-2) 영웅 저축 (heroUse) — 스타는 엘릭서 상한 도달로만 적립되므로,
     전장 영웅이 부족하면 선택 지출을 멈추고 상한까지 저축한다 (기본 방어·경제 단계는 위에서 이미 처리) */
  if(st.heroUse&&tier>=2&&prodCnt>=2&&S.eStars<Math.max(1,BAL.HERO_COST)){
    const fieldH=S.units.filter(u=>u.side===side&&u.hero).length;
    if(fieldH<2&&(S.eHeroSlots||[]).some(s=>s.state==="ready"))return;
  }
  /* 4) 원거리 생산 라인 확보 (아처리) */
  if(cnt("archery")<1&&cnt("shooterGarden")<1&&prodCnt>=1&&tryB("archery",prodPref))return;
  /* 4-1) 기병 라인 (킵 이후) */
  if(tier>=2&&st.transform&&cnt("assaultBarracks")<1&&cnt("knightHall")<1&&prodCnt>=2&&tryB("assaultBarracks",prodPref))return;
  /* 5) 방어선 확보 (공격형은 생산을 우선하므로 최소 1기만) */
  if(towerCnt<Math.min(st.aggro?1:2,st.towerMax)&&tryB("tower","fwd"))return;
  /* 5-1) 공격형: 초반 생산 라인 3채까지는 테크보다 먼저 (그 이상은 테크·레벨 이후) */
  if(st.aggro&&prodCnt<Math.min(3,st.prodMax)&&tryB(cnt("archery")+cnt("shooterGarden")<2?"archery":"barracks","fwd"))return;
  /* 6) 테크: 생텀 → 캐슬. 승급 조건이 갖춰지면 자원을 모은다 (선택적 지출 보류) */
  if(maxTier>=3){
    if(cnt("sanctum")<1&&tryB("sanctum"))return;
    if(S.eTier<3){
      if(doTierUp(side))return;
      if(aliveB(side,"sanctum"))return;   // 캐슬 비용 저축 — 아래 선택적 지출 건너뜀
    }
  }
  /* 7) 상위 변형 — Lv3 달성 건물만 대상 (레벨 투자가 선행되어야 함) */
  if(st.transform){
    /* 스타 부족 시에도 return — 지출을 멈춰 스타를 적립 (변형 = ★ 재화, 2026-09-07) */
    const tryTf=(fromKey,toKey)=>{
      const bb=S.buildings.find(x=>x.side===side&&x.hp>0&&x.key===fromKey&&x.level>=3);
      if(!bb)return false;
      if(starsOf(side)>=transformStarsFor(fromKey,toKey))transformBuilding(bb,toKey);
      return true;
    };
    if(cnt("shieldBarracks")<1&&tryTf("barracks","shieldBarracks"))return;
    if(cnt("knightHall")<1&&tryTf("assaultBarracks","knightHall"))return;
    if(cnt("shooterGarden")<1&&tryTf("archery","shooterGarden"))return;
  }
  /* 상위 변형: Lv3 달성 건물만 대상 (워크숍→시즈 워크숍, 생텀→드래곤 네스트) */
  if(st.aviary){
    const tryTf2=(fromKey,toKey)=>{
      const bb=S.buildings.find(x=>x.side===side&&x.hp>0&&x.key===fromKey&&x.level>=3);
      if(!bb)return false;
      if(starsOf(side)>=transformStarsFor(fromKey,toKey))transformBuilding(bb,toKey);
      return true;
    };
    if(cnt("siegeWorkshop")<1&&tryTf2("workshop","siegeWorkshop"))return;
    if(cnt("dragonNest")<1&&tryTf2("sanctum","dragonNest"))return;
  }
  /* 8) 생산 증설 (공격형은 전방으로) */
  if(prodCnt<st.prodMax&&tryB(cnt("archery")+cnt("shooterGarden")<2?"archery":"barracks",prodPref))return;
  /* 9) 유닛 레벨 투자 — 변형 예정 건물은 제외 (레벨 낭비 방지) */
  if(maxLv>1){
    /* 모든 상위 변형이 Lv3 조건이므로 레벨 투자가 곧 변형 준비 — 제외 없음 */
    const up=S.buildings.find(b=>b.side===side&&b.hp>0&&BAL.BUILDINGS[b.key].prod&&b.level<maxLv);
    if(up){const c=upCostFor(up);
      if(elixirOf(side)>=c+2){spend(side,c);up.level++;   // 스타 융해 없이 순수 엘릭서로만 (★ 보호)
        S.effects.push({tp:"ftext",x:up.cx,y:up.ty*TILE-4,text:"Lv"+up.level,t:0.9,t0:0.9,col:"255,170,170"});
        burst(up.cx,up.cy,"140,220,255",8,100);return;}
      if(up)return;   // 레벨업 대상이 남았으면 저축 (유닛 질 우선)
    }
  }
  /* 9-1) 타워 화력 확보: 기본 타워 → 가드/아케인 변형 (towerTf 목표까지 — 기본 타워는 비무장이므로 필수 방어 수단) */
  if((st.towerTf||0)>0){
    const tfCnt=cnt("guardTower")+cnt("arcaneTower");
    if(tfCnt<st.towerTf){
      const base=S.buildings.find(x=>x.side===side&&x.hp>0&&x.key==="tower");
      if(base){
        const tk=(tier>=3&&hasSanctumLine(side))?"arcaneTower":
                 (tier>=2&&hasPrereq(side,["workshop","siegeWorkshop"]))?"guardTower":null;
        if(tk){
          if(starsOf(side)>=transformStarsFor("tower",tk)){transformBuilding(base,tk);return;}
          return;   // 스타 적립 대기
        }
      }
    }
  }
  /* 10) 여유 자원 → 전진 타워 압박 (공격형은 여유 기준을 낮춰 더 자주 전진) */
  if(elixirOf(side)>=capFor(side)-2&&towerCnt<st.towerMax&&tryB("tower","fwd"))return;
}

/* ---------- 조작: 패널 & 드래그 ---------- */
function swapMode(){
  S.mode=S.mode==="build"?"hero":"build";
  document.getElementById("swap-btn").innerHTML="⇄<br>"+(S.mode==="build"?"건설":"영웅");
  hideStrip(); renderPanel();
}
const PANEL_BUILDS=["elixirBase","barracks","archery","assaultBarracks","workshop","sanctum","tower"];   // 상위 생산 건물은 변형으로 획득
function buildLockReason(key,side){
  side=side||MYSIDE;
  if(GAME_CFG&&GAME_CFG.allowB&&!GAME_CFG.allowB.has(key))return "이 단계 미해금";
  const d=BAL.BUILDINGS[key], t=effTier(side);
  if(d.tier>t)return TIER_NM[d.tier]+" 필요";
  if(!hasPrereq(side,d.prereq))return prereqName(d.prereq)+" 필요";
  return null;
}
let panelDirty=false;
function renderPanel(){
  /* 드래그 중에는 패널을 다시 만들지 않는다 — DOM 교체 시 포인터 캡처가 끊겨 배치가 취소됨
     (건물 파괴·영웅 쿨다운 등으로 renderPanel이 호출되던 문제. 드래그 종료 후 일괄 갱신) */
  if(dragState){panelDirty=true;return;}
  const p=document.getElementById("panel"); p.innerHTML="";
  if(S.mode==="build"){
    PANEL_BUILDS.forEach(key=>{
      const d=BAL.BUILDINGS[key], lock=buildLockReason(key);
      const div=document.createElement("div");
      div.className="p-item"+(lock?" locked":(effElixir(MYSIDE)<d.cost?" dim":""));
      div.innerHTML=`<div class="p-cost">${d.cost}</div><img draggable="false" src="${ICONS[key]||""}" alt=""><div class="p-nm">${d.nm}</div>`
        +(lock?`<div class="p-lock">🔒\n${lock}</div>`:"");

function attachDrag(div,info){
  div.addEventListener("pointerdown",e=>{
    if(S.over)return; e.preventDefault();
    hideStrip();   // 드래그 시작 시 말풍선 닫기
    dragState={...info,id:e.pointerId,moved:false,el:div};
    try{div.setPointerCapture(e.pointerId);}catch(_){}
  });
  div.addEventListener("pointermove",e=>{
    if(!dragState||dragState.id!==e.pointerId)return;
    dragState.moved=true; div.classList.add("dragging");
    const rect=cv.getBoundingClientRect();
    const off=e.pointerType==="touch"?60:e.pointerType==="pen"?40:0;
    const sx=(e.clientX-rect.left)*(cv.width/rect.width);
    const aimY=(e.clientY-rect.top)*(cv.height/rect.height)-off;   // 손가락 위로 살짝 (조준점, 화면 좌표)
    dragState.rawX=sx; dragState.rawAimY=aimY;   // 화면 조준 좌표 (취소 제스처 — 오프셋 포함해 최하단 오취소 방지)
    const sim=unflipPt(sx, aimY);                // 게스트 반전 보정 → 시뮬 좌표
    dragState.pt={x:Math.max(4,Math.min(W-4,sim.x)), y:Math.max(4,Math.min(H-4,sim.y))};
    S.mouse=dragState.pt; S.sel=info;
  });
  const end=e=>{
    if(!dragState||dragState.id!==e.pointerId)return;
    const st=dragState; dragState=null; div.classList.remove("dragging");
    S.sel=null; S.mouse=null;
    const finish=()=>{ if(panelDirty){panelDirty=false;renderPanel();} };
    if(e.type==="pointercancel"||!st.moved||!st.pt){finish();return;}
    if(st.rawAimY>H+20||st.rawX<-20||st.rawX>W+20){finish();return;}  // 취소 제스처
    if(st.type==="build")tryBuildAt(st.key,st.pt.x,st.pt.y);
    else tryHeroAt(st.slot,st.pt.x,st.pt.y);
    finish();
  };
  div.addEventListener("pointerup",end);
  div.addEventListener("pointercancel",end);
}

function issueCmd(cmd){
  if(REPLAY){toast("리플레이 재생 중 — 조작 불가");return;}
  if(typeof NET!=="undefined"&&NET.on){NET.issue(cmd);return;}   // PvP: 라운드 지연 스케줄

function bldById(id){return S.buildings.find(b=>b.id===id&&b.hp>0);}
function execCmd(c){

  switch(c.type){
    case "build": execBuild(sd,c.key,c.tx,c.ty); break;
    case "tier": if(doTierUp(sd)&&sd===MYSIDE)SND.play("tierup"); break;

      const tr=(BAL.BUILDINGS[b.key].transforms||[]).find(x=>x.key===c.toKey); if(!tr)break;
      const t=effTier(sd);
      if((tr.tier&&t<tr.tier)||(tr.minLevel&&b.level<tr.minLevel)||!hasPrereq(sd,tr.prereq))break;
      transformBuilding(b,c.toKey); break;
    }
    case "upgrade": {const b=bldById(c.bid); if(b&&b.side===sd)execUpgrade(sd,b); break;}
    case "demolish": {
      const b=bldById(c.bid);
      if(b&&b.side===sd&&b.key!=="hall"){b.hp=0;if(sd===MYSIDE){toast(BAL.BUILDINGS[b.key].nm+" 철거");SND.play("demolish");}}

/* ---------- 리플레이 (0단계 산출물): 시드 + 커맨드 로그 = 게임 전체 ---------- */
function simHash(){
  let h=2166136261>>>0;
  const f=v=>{h=(h^((v*8192)|0))>>>0;h=Math.imul(h,16777619)>>>0;};
  S.units.forEach(u=>{f(u.x);f(u.y);f(u.hp);});
  S.buildings.forEach(b=>{f(b.tx*31+b.ty);f(b.hp);f(b.level);});
  f(S.elixir*100);f(S.eElixir*100);f(S.stars);f(S.eStars);f(S.tier*10+S.eTier);f(simTick);
  return h>>>0;
}

function loop(ts){
  if(!S)return;
  if(!lastTs)lastTs=ts;
  const raw=Math.min(0.1,(ts-lastTs)/1000);
  lastTs=ts;
  if(!S.over){
    if(typeof NET!=="undefined"&&NET.on){
      /* 넷 모드: 절대 시간 기준 펌프 (rAF·타이머·ws 이벤트 어디서 불려도 이중 진행 없음) */
      NET.pump();
    } else {
      simAcc+=raw*gameSpeed;
      if(simAcc>SIM_TICK*8)simAcc=SIM_TICK*8;   // 프레임 스파이크 캡 (탭 복귀 등)
      while(simAcc>=SIM_TICK&&!S.over){stepSim(SIM_TICK);simAcc-=SIM_TICK;}
    }
    updateHUD();
  }
  tickFx(raw*gameSpeed);   // 이펙트·파티클은 연출 — 프레임 시간 사용 (로직 무관)
  draw();
  rafId=requestAnimationFrame(loop);
}
/* 고정 틱 시뮬레이션 본체 — 이 함수 안의 모든 것이 결정론 영역 */
function stepSim(dt){
  simTick++;
  /* 예약 커맨드 실행 (발행 순서 유지) */
  if(PENDING.length){
    const due=PENDING.filter(c=>c.tick<=simTick);
    if(due.length){PENDING=PENDING.filter(c=>c.tick>simTick);due.forEach(execCmd);}
  }
  {
    S.elapsed+=dt;
    /* 경제 (양측 동일 공식). 자연 회복으로 상한 도달 시 → 엘릭서 스타 1개 적립, 바 초기화.
       (녹이기로 채운 상한 상태는 재적립되지 않음 — 상한 "미만→도달" 순간에만 적립) */
    const gas=S.buildings.filter(b=>b.side==="player"&&b.key==="elixirBase"&&b.hp>0).length;
    const pb=S.elixir, pCap=capFor("player");
    S.elixir=Math.min(pCap,pb+dt*(1+BAL.ECON.gasBonus*gas)/BAL.ECON.regen);
    if(pb<pCap&&S.elixir>=pCap){S.stars++;S.elixir=0;
      if(MYSIDE==="player"){toast("★ 엘릭서 스타 +1 (보유 "+S.stars+")");SND.play("star");renderPanel();}}
    const eGas=S.buildings.filter(b=>b.side==="enemy"&&b.key==="elixirBase"&&b.hp>0).length;
    const eb=S.eElixir, eCap=capFor("enemy");
    S.eElixir=Math.min(eCap,eb+dt*(1+BAL.ECON.gasBonus*eGas)/BAL.ECON.regen);
    if(eb<eCap&&S.eElixir>=eCap){S.eStars++;S.eElixir=0;
      if(MYSIDE==="enemy"){toast("★ 엘릭서 스타 +1 (보유 "+S.eStars+")");SND.play("star");renderPanel();}}
    if(!(GAME_CFG&&GAME_CFG.net))aiUpdate(dt);   // PvP(실매칭)에서는 AI 없음 — 위 진영은 상대 커맨드가 조종
    if(TUT.active)TUT.update();   // 튜토리얼 목표 달성 체크
    recomputeAuras();
    S.units.forEach(u=>unitUpdate(u,dt));
    S.buildings.forEach(b=>buildingUpdate(b,dt));
    /* 사망 처리 */
    S.units.forEach(u=>{if(u.hp<=0){deathFx(u);
      if(u.hero){const slots=u.side==="player"?S.heroSlots:(S.eHeroSlots||[]);
        const slot=slots.find(s=>s.unit===u);
        if(slot){slot.state="cd";slot.cd=BAL.HERO_CD;slot.unit=null;if(u.side===MYSIDE)renderPanel();}}}});
    S.units=S.units.filter(u=>u.hp>0);
    S.buildings.forEach(b=>{if(b.hp<=0&&!b.boomed){b.boomed=true;b.rubbleT=6;buildingBoom(b);S.occ=null;S.zoneDirty=true;
      if(S.selBld===b)hideStrip();
      if(b.side!==MYSIDE)toast(BAL.BUILDINGS[b.key].nm+" 파괴! 배제 반경 해제");
      renderPanel();}});
    /* 잔해 소멸 (2026-09-07): 파괴 6초 후 잔해 제거 — 빈 셀로 명확히 */
    let rubbleGone=false;
    S.buildings.forEach(b=>{if(b.boomed){b.rubbleT=(b.rubbleT===undefined?6:b.rubbleT)-dt;if(b.rubbleT<=0)rubbleGone=true;}});
    if(rubbleGone){S.buildings=S.buildings.filter(b=>!(b.boomed&&b.rubbleT<=0));S.occ=null;S.zoneDirty=true;}
    /* 영웅 쿨다운 */
    let cdChanged=false;
    S.heroSlots.forEach(s=>{if(s.state==="cd"){s.cd-=dt;if(s.cd<=0){s.state="ready";if(MYSIDE==="player")cdChanged=true;}}});
    (S.eHeroSlots||[]).forEach(s=>{if(s.state==="cd"){s.cd-=dt;if(s.cd<=0){s.state="ready";if(MYSIDE==="enemy")cdChanged=true;}}});
    if(cdChanged)renderPanel();
    document.querySelectorAll(".p-cd[data-cd]").forEach(el=>{const s=mySlots()[+el.dataset.cd];if(s&&s.state==="cd")el.textContent=Math.ceil(s.cd);});
    /* 승패 (내 진영 기준) */
    const pHall=S.buildings.find(b=>b.side==="player"&&b.key==="hall");
    const eHall=S.buildings.find(b=>b.side==="enemy"&&b.key==="hall");
    if(eHall&&eHall.hp<=0)endGame(MYSIDE==="player");
    else if(pHall&&pHall.hp<=0)endGame(MYSIDE==="enemy");
  }
}
function endGame(win){
  S.over=true;
  if(GAME_CFG&&GAME_CFG.net&&typeof NET!=="undefined"){
    if(NET.desync){showDesyncResult();return;}   // 이미 감지된 디싱크 → 승패 대신 무효 처리
    NET.reportResult(win);   // 결과 교차검증 (거짓 승리 차단), 연결은 잠시 후 종료
  }
  SND.play(win?"win":"lose");
  if(win)confetti();else shake(12);
  /* 모드별 결과 화면 (2026-09-04): 스토리 = 진행 저장 + 다음 단계, 튜토리얼 = 완료 처리 */
  const cfg=GAME_CFG||{mode:"practice"};
  let detail=win?"적 본진 파괴 — 점령 완료":"본진이 파괴되었습니다";
  let btns="";
  if(cfg.mode==="story"&&win){
    const ki=cfg.story.ki, i=cfg.story.i, K=KINGDOMS[ki];
    if(i>=progOf(ki)){if(ki===0)PROG.k1=i+1;else if(ki===1)PROG.k2=i+1;saveProg();}
    detail=K.nm+" · "+K.stages[i].nm+" 공략 완료!";
    if(i+1<K.stages.length)btns+=`<button onclick="startStory(${ki},${i+1})">다음 단계 ▶</button>`;
    else detail+="<br>🏰 왕국 정복! "+(ki===0?"협곡 왕국이 열렸습니다":"모든 왕국을 정복했습니다");
    btns+=`<button onclick="closeOv();showStages(${ki})" style="background:var(--panel2);">스테이지 목록</button>`;
  } else if(cfg.mode==="tutorial"&&win){
    PROG.tut=1;saveProg();TUT.stop();
    detail="튜토리얼 완료! 이제 스토리 모드에 도전하세요";
    btns+=`<button onclick="closeOv();showKingdoms()">스토리 모드 ▶</button>`;
  } else if(!cfg.net){
    btns+=`<button onclick="restart()">다시 시작</button>`;
  }
  btns+=`<button onclick="toLobby()" style="background:var(--panel2);">로비</button>`;
  document.getElementById("ov-title").textContent=win?"승리!":"패배";
  document.getElementById("ov-title").style.color=win?"var(--gold)":"var(--red)";
  document.getElementById("ov-detail").innerHTML=detail;
  document.getElementById("ov-btns").innerHTML=btns;
  document.getElementById("overlay").style.display="flex";
}
function closeOv(){document.getElementById("overlay").style.display="none";}
/* 동기화 오류 결과: 승패 확정 불가 → 무효 처리 (거짓 승리 방지, 2026-09-07) */
function showDesyncResult(){
  S.over=true;

  document.getElementById("ov-title").style.color="var(--red)";
  document.getElementById("ov-detail").innerHTML="네트워크 동기화가 어긋나 승패를 확정할 수 없습니다.<br>무효 처리되었습니다 — 다시 매칭해 주세요.";
  document.getElementById("ov-btns").innerHTML=`<button onclick="toLobby()">로비</button>`;

function toggleSpeed(){
  if(typeof NET!=="undefined"&&NET.on){toast("실시간 대전 중에는 배속 변경 불가");return;}
  gameSpeed=gameSpeed===0?1:gameSpeed===1?2:gameSpeed===2?4:1;syncPauseUI();}
let pausedPrev=1;
function togglePause(){
  if(typeof NET!=="undefined"&&NET.on){toast("실시간 대전 중에는 일시 정지 불가");return;}
  if(gameSpeed===0)gameSpeed=pausedPrev||1;

/* ============================================================ 렌더링 (치비 스타일 — v1 계승) ============================================================ */
const OUTLINE="#2e2a33";
function po(w){ctx.strokeStyle=OUTLINE;ctx.lineWidth=w||1.6;ctx.stroke();}
function roundRectPath(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function unitShadow(x,y,r){ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(x,y,r,r*0.42,0,0,7);ctx.fill();}
function drawHpBar(x,y,hp,maxHp,w,side){
  const h=5;
  ctx.fillStyle="rgba(15,20,30,.85)";roundRectPath(x-w/2-1,y-1,w+2,h+2,3);ctx.fill();
  const p=Math.max(0,hp/maxHp);
  ctx.fillStyle=side==="player"?"#3f8cff":"#ff4d4d";
  roundRectPath(x-w/2,y,Math.max(2,w*p),h,2);ctx.fill();
}
/* --- 파티클 --- */
function addP(p){if(S&&S.particles.length<300)S.particles.push(p);}
function burst(x,y,col,n,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=spd*(0.4+Math.random()*0.8);
  addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.4,g:260,t:0,life:0.45+Math.random()*0.35,size:2+Math.random()*2.5,col});}}
function deathFx(u){burst(u.x,u.y,u.hero?"255,210,90":"205,205,195",u.hero?18:8,u.hero?170:110);if(u.hero)shake(6);}
function buildingBoom(b){SND.play("destroy");burst(b.cx,b.cy,"255,150,60",20,200);burst(b.cx,b.cy,"120,120,110",14,150);
  for(let i=0;i<6;i++)addP({x:b.cx+(Math.random()-.5)*20,y:b.cy-10,vx:(Math.random()-.5)*30,vy:-40-Math.random()*30,g:-25,t:0,life:1.1,size:6+Math.random()*5,col:"110,110,110",smoke:1});
  shake(10);}
function confetti(){const cols=["255,200,60","90,150,255","255,110,110","130,230,140","220,140,255"];
  for(let i=0;i<70;i++)addP({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*70,vy:60+Math.random()*90,g:60,t:0,life:1.8+Math.random(),size:3+Math.random()*3,col:cols[i%5],conf:1});}
function shake(v){if(S)S.shake=Math.max(S.shake||0,v);}
function tickFx(dt){
  if(!S)return;
  S.shake=Math.max(0,(S.shake||0)-dt*22);
  S.particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;});
  S.particles=S.particles.filter(p=>p.t<p.life);
  S.effects.forEach(f=>f.t-=dt);
  S.effects=S.effects.filter(f=>f.t>0);
}

function chibiBase(r,bodyC,skinC){
  const lw=Math.max(1,r*0.13);
  ctx.fillStyle="#4a4048";
  ctx.beginPath();ctx.ellipse(-r*0.3,r*1.02,r*0.2,r*0.12,0,0,7);ctx.fill();po(lw);
  ctx.beginPath();ctx.ellipse(r*0.3,r*1.02,r*0.2,r*0.12,0,0,7);ctx.fill();po(lw);
  ctx.fillStyle=bodyC;roundRectPath(-r*0.52,r*0.08,r*1.04,r*0.92,r*0.3);ctx.fill();po(lw);
  ctx.fillStyle=skinC;
  ctx.beginPath();ctx.arc(-r*0.58,r*0.48,r*0.16,0,7);ctx.fill();po(lw);
  ctx.beginPath();ctx.arc(r*0.58,r*0.48,r*0.16,0,7);ctx.fill();po(lw);
  ctx.fillStyle=skinC;ctx.beginPath();ctx.arc(0,-r*0.38,r*0.76,0,7);ctx.fill();po(lw);
}

  chibiEyes(r,-r*0.32,r*0.16);
}
const SPRH={archmage:sprArchmage, mountainKing:sprMountainKing, paladin:sprPaladin,
  bloodMage:sprBloodMage, skyMage:sprSkyMage};

/* --- 8방향 스프라이트 시트 등록부 (2026-09-04) ---
   실제 8방향 아트가 준비되면 여기 등록만 하면 해당 유닛/영웅이 시트 렌더로 자동 전환된다.
   시트 규격: 세로 8행 = dir8 순서(E,SE,S,SW,W,NW,N,NE), 가로 frames열 = 걷기 루프 (0열 = 대기).
   예: registerUnitSheet("footman",{src:"art/footman_8dir.png",fw:64,fh:64,frames:4,fps:8}); */
const UNIT_SHEETS={};
function registerUnitSheet(key,def){
  const img=new Image(); img.src=def.src;
  UNIT_SHEETS[key]={fw:64,fh:64,frames:4,fps:8,...def,img};
}
/* 방향 인지 유닛 드로우 — 호출 시 ctx 원점은 유닛 중심.
   시트가 등록돼 있으면 dir8 행 + 걷기 프레임을 그리고,
   없으면 절차(칩비) 스프라이트에 8방향 근사(서반구 미러 + 남/북 기울기)를 적용한다. */
function drawUnitSprite(u,team){
  const d=(u.dir8===undefined)?(u.side==="player"?6:2):u.dir8;
  const sh=UNIT_SHEETS[u.key];
  if(sh&&sh.img.complete&&sh.img.naturalWidth>0){
    const fr=u.moving?Math.floor((u.animT||0)/7*sh.fps)%sh.frames:0;
    const sc=(u.r*2.6)/sh.fw;
    ctx.save();ctx.scale(sc,sc);
    ctx.drawImage(sh.img,fr*sh.fw,d*sh.fh,sh.fw,sh.fh,-sh.fw/2,-sh.fh*0.72,sh.fw,sh.fh);
    ctx.restore();
    return;
  }
  ctx.rotate(DIR8_VEC[d][1]*0.09);          // 남향 = 앞으로, 북향 = 뒤로 살짝 기울여 진행감
  ctx.scale((d>=3&&d<=5)?-1:1,1);           // 서반구(SW·W·NW)는 좌우 미러
  const fn=u.hero?SPRH[u.key]:SPRU[u.key];
  if(fn)fn(u.r,team,u.swing||0,u);
}

      const t=tierNow||1, cx=px+pw/2;
