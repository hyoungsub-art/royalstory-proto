  /* 맵별 지형 테마 (2026-09-05): 초원 = 풀밭, 협곡 = 사암 대지 + 절벽 음영 */
  const th=(typeof MAPS!=="undefined"&&MAPS[curMap]&&MAPS[curMap].theme)||
    {ground:"#79c247",checker:"rgba(0,45,0,.06)",speckA:"rgba(255,255,255,.05)",speckB:"rgba(0,60,0,.07)",
     grid:"rgba(30,60,20,.12)",road:"#cdb27a",roadDot:"rgba(150,115,70,.45)",roadEdge:"rgba(120,90,50,.7)",cliff:false};
  c.fillStyle=th.ground;c.fillRect(0,0,W,H);
  c.fillStyle=th.checker;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if((x+y)%2)c.fillRect(x*TILE,y*TILE,TILE,TILE);
  for(let i=0;i<500;i++){c.fillStyle=rnd()<.5?th.speckA:th.speckB;c.fillRect(rnd()*W,rnd()*H,2,2);}
  /* 협곡: 지표에 바위·균열 무늬 추가 */
  if(th.cliff){
    for(let i=0;i<26;i++){const bx=rnd()*W,by=rnd()*H,br=3+rnd()*5;
      c.fillStyle="rgba(120,85,50,.30)";c.beginPath();c.ellipse(bx,by,br,br*0.7,rnd()*3,0,7);c.fill();
      c.fillStyle="rgba(235,205,160,.35)";c.beginPath();c.ellipse(bx-br*0.25,by-br*0.3,br*0.5,br*0.32,0,0,7);c.fill();}
    c.strokeStyle="rgba(110,75,40,.28)";c.lineWidth=1.3;
    for(let i=0;i<14;i++){let cx2=rnd()*W,cy2=rnd()*H;c.beginPath();c.moveTo(cx2,cy2);
      for(let s=0;s<4;s++){cx2+=(rnd()-0.5)*26;cy2+=8+rnd()*14;c.lineTo(cx2,cy2);}c.stroke();}
  }
  /* 그리드 라인 (연하게) */
  c.strokeStyle=th.grid;c.lineWidth=1;
  for(let x=0;x<=COLS;x++){c.beginPath();c.moveTo(x*TILE,0);c.lineTo(x*TILE,H);c.stroke();}
  for(let y=0;y<=ROWS;y++){c.beginPath();c.moveTo(0,y*TILE);c.lineTo(W,y*TILE);c.stroke();}
  /* 지형 요소 렌더 (2026-09-07) — 테마별 색: 초원/협곡. 길이 위를 덮으면 그 구간은 다리처럼 보임 */
  const FC=th.cliff
    ?{wA:"#4a86ad",wB:"#8fc0dd",tA:"#6b8a3f",tB:"#49622a",rA:"#8d6b4a",rB:"#b08a5e",sA:"#a89a80",sB:"#6e6350"}
    :{wA:"#3a76c4",wB:"#84b4ec",tA:"#2e7d32",tB:"#215d26",rA:"#8f8f86",rB:"#b5b5aa",sA:"#b9b6a8",sB:"#7a7568"};
  (BAL.FEATS||[]).forEach(f=>{
    const fx=f.x0*TILE,fy=f.y0*TILE,fw=(f.x1-f.x0+1)*TILE,fh=(f.y1-f.y0+1)*TILE;
    if(f.t==="river"){
      c.fillStyle=FC.wA;c.fillRect(fx,fy,fw,fh);
      c.strokeStyle=FC.wB;c.lineWidth=1.6;
      const n=Math.max(5,Math.round(fw*fh/700));
      for(let i=0;i<n;i++){const wx=fx+rnd()*(fw-16),wy=fy+3+rnd()*(fh-6);
        c.beginPath();c.moveTo(wx,wy);c.quadraticCurveTo(wx+8,wy-3,wx+16,wy);c.stroke();}
      c.strokeStyle="rgba(18,48,88,.55)";c.lineWidth=2;c.strokeRect(fx+1,fy+1,fw-2,fh-2);
    } else if(f.t==="forest"){
      c.fillStyle="rgba(25,75,25,.14)";c.fillRect(fx,fy,fw,fh);
      for(let y=f.y0;y<=f.y1;y++)for(let x=f.x0;x<=f.x1;x++){
        const cnt=1+(rnd()<0.55?1:0);
        for(let k=0;k<cnt;k++){
          const px2=x*TILE+7+rnd()*(TILE-14), py2=y*TILE+10+rnd()*(TILE-16), s=7+rnd()*4;
          c.fillStyle="#6b4a2a";c.fillRect(px2-1.5,py2+s*0.45,3,5);
          c.fillStyle=rnd()<0.5?FC.tA:FC.tB;
          c.beginPath();c.moveTo(px2,py2-s);c.lineTo(px2-s*0.78,py2+s*0.55);c.lineTo(px2+s*0.78,py2+s*0.55);c.closePath();c.fill();
          c.strokeStyle="rgba(12,32,12,.5)";c.lineWidth=1;c.stroke();
        }
      }
    } else if(f.t==="rock"){
      /* 큼직한 각진 바위 (2026-09-07 개정): 타일을 거의 채우는 불규칙 다각형 + 면 하이라이트 + 균열 + 곁돌 */
      for(let y=f.y0;y<=f.y1;y++)for(let x=f.x0;x<=f.x1;x++){
        const cx2=x*TILE+TILE/2+(rnd()-0.5)*3, cy2=y*TILE+TILE/2+(rnd()-0.5)*3;
        const R=TILE*0.42+rnd()*2.5;
        /* 바닥 그림자 */
        c.fillStyle="rgba(0,0,0,.22)";
        c.beginPath();c.ellipse(cx2+2,cy2+R*0.5,R*0.95,R*0.38,0,0,7);c.fill();
        /* 본체: 불규칙 다각형 */
        const nV=6+Math.floor(rnd()*2), pts=[];
        for(let k=0;k<nV;k++){const a=(k/nV)*6.283+rnd()*0.35;const rr=R*(0.8+rnd()*0.28);
          pts.push([cx2+Math.cos(a)*rr, cy2+Math.sin(a)*rr*0.85]);}
        c.fillStyle=FC.rA;
        c.beginPath();c.moveTo(pts[0][0],pts[0][1]);pts.forEach(p=>c.lineTo(p[0],p[1]));c.closePath();c.fill();
        c.strokeStyle="rgba(35,30,22,.85)";c.lineWidth=2;c.stroke();
        /* 상단면 하이라이트 (좌상단으로 수축한 다각형) */
        c.fillStyle=FC.rB;
        c.beginPath();
        pts.forEach((p,k)=>{const hx=cx2+(p[0]-cx2)*0.55-2.5, hy=cy2+(p[1]-cy2)*0.48-3.5;
          k?c.lineTo(hx,hy):c.moveTo(hx,hy);});
        c.closePath();c.fill();
        /* 균열 */
        c.strokeStyle="rgba(35,30,22,.5)";c.lineWidth=1.3;
        c.beginPath();c.moveTo(cx2-R*0.32,cy2+R*0.42);c.lineTo(cx2+R*0.08,cy2+R*0.02);c.lineTo(cx2+R*0.02,cy2-R*0.42);c.stroke();
        /* 곁돌 */
        c.fillStyle=FC.rA;c.beginPath();c.ellipse(cx2+R*0.82,cy2+R*0.5,4.5,3.2,0.4,0,7);c.fill();
        c.strokeStyle="rgba(35,30,22,.7)";c.lineWidth=1.2;c.stroke();
      }
    } else if(f.t==="wall"){
      c.fillStyle=FC.sA;c.fillRect(fx,fy,fw,fh);
      c.strokeStyle="rgba(60,55,45,.45)";c.lineWidth=1.2;
      for(let yy=fy+10;yy<fy+fh;yy+=10){c.beginPath();c.moveTo(fx,yy);c.lineTo(fx+fw,yy);c.stroke();}
      for(let xx=fx+12;xx<fx+fw;xx+=17){c.beginPath();c.moveTo(xx,fy+3);c.lineTo(xx,fy+fh-3);c.stroke();}
      c.fillStyle=FC.sB;
      for(let xx=fx;xx<fx+fw-6;xx+=14)c.fillRect(xx,fy,8,6);   // 총안
      c.fillStyle="rgba(0,0,0,.18)";c.fillRect(fx,fy+fh-6,fw,6);
      c.strokeStyle="rgba(50,45,35,.8)";c.lineWidth=2;c.strokeRect(fx+1,fy+1,fw-2,fh-2);
    }
  });
  /* 길 (본진↔본진, 건설 불가 통로) — 맵에 따라 여러 갈래. 협곡 테마는 길 = 협곡 바닥 (절벽 그림자) */
  (BAL.ROADS||[BAL.ROAD]).forEach(rd=>{
    const rx=rd.x0*TILE, rw=(rd.x1-rd.x0+1)*TILE, ry2=rd.y0*TILE, rh2=(rd.y1-rd.y0+1)*TILE;
    c.fillStyle=th.road; c.fillRect(rx,ry2,rw,rh2);
    c.fillStyle=th.roadDot;
    for(let i=0;i<60;i++){ c.beginPath(); c.ellipse(rx+rnd()*rw, ry2+rnd()*rh2, 2.5, 1.7, 0, 0, 7); c.fill(); }
    if(th.cliff){
      /* 협곡 바닥: 양쪽 절벽에서 드리우는 안쪽 그림자 + 바깥 절벽 능선 하이라이트 */
      let g=c.createLinearGradient(rx,0,rx+12,0);
      g.addColorStop(0,"rgba(40,22,8,.45)");g.addColorStop(1,"rgba(40,22,8,0)");
      c.fillStyle=g;c.fillRect(rx,ry2,12,rh2);
      g=c.createLinearGradient(rx+rw,0,rx+rw-12,0);
      g.addColorStop(0,"rgba(40,22,8,.45)");g.addColorStop(1,"rgba(40,22,8,0)");
      c.fillStyle=g;c.fillRect(rx+rw-12,ry2,12,rh2);
      c.strokeStyle="rgba(250,225,180,.5)";c.lineWidth=1.5;
      c.beginPath();c.moveTo(rx-1,ry2);c.lineTo(rx-1,ry2+rh2);c.stroke();
      c.beginPath();c.moveTo(rx+rw+1,ry2);c.lineTo(rx+rw+1,ry2+rh2);c.stroke();
      /* 절벽 벽면의 지층 선 */
      c.strokeStyle="rgba(70,42,18,.5)";c.lineWidth=2;
      for(let yy=ry2+10;yy<ry2+rh2;yy+=26){
        c.beginPath();c.moveTo(rx+2,yy);c.lineTo(rx+7,yy+4);c.stroke();
        c.beginPath();c.moveTo(rx+rw-2,yy+12);c.lineTo(rx+rw-7,yy+16);c.stroke();
      }
    }
    c.strokeStyle=th.roadEdge; c.lineWidth=2;
    c.beginPath(); c.moveTo(rx+1,ry2); c.lineTo(rx+1,ry2+rh2); c.stroke();
    c.beginPath(); c.moveTo(rx+rw-1,ry2); c.lineTo(rx+rw-1,ry2+rh2); c.stroke();
  });
  /* 다리 (2026-09-07): 길이 강을 가로지르는 구간은 나무 판자 다리로 — 판자는 통행 방향과 직각 */
  (BAL.FEATS||[]).filter(f=>f.t==="river").forEach(rv=>{
    (BAL.ROADS||[BAL.ROAD]).forEach(rd=>{
      const ix0=Math.max(rv.x0,rd.x0), ix1=Math.min(rv.x1,rd.x1);
      const iy0=Math.max(rv.y0,rd.y0), iy1=Math.min(rv.y1,rd.y1);
      if(ix0>ix1||iy0>iy1)return;
      const vert=(rd.y1-rd.y0)>=(rd.x1-rd.x0);   // 길 진행 방향
      const pad=5;   // 강기슭에 살짝 걸치게
      let x=ix0*TILE, y=iy0*TILE, w=(ix1-ix0+1)*TILE, h=(iy1-iy0+1)*TILE;
      if(vert){y-=pad;h+=pad*2;} else {x-=pad;w+=pad*2;}
      /* 물 위 그림자 */
      c.fillStyle="rgba(10,30,55,.30)";
      c.fillRect(x-3,y-2,w+6,h+4);
      /* 다리 바닥 (나무) */
      c.fillStyle="#b07a36"; c.fillRect(x,y,w,h);
      /* 판자 줄눈 + 판자 결 하이라이트 */
      c.strokeStyle="rgba(90,55,20,.8)"; c.lineWidth=1.6;
      if(vert){for(let yy=y+6;yy<y+h-2;yy+=7){c.beginPath();c.moveTo(x+2,yy);c.lineTo(x+w-2,yy);c.stroke();}}
      else{for(let xx=x+6;xx<x+w-2;xx+=7){c.beginPath();c.moveTo(xx,y+2);c.lineTo(xx,y+h-2);c.stroke();}}
      c.fillStyle="rgba(255,224,170,.18)";
      for(let i=0;i<Math.max(6,w*h/450);i++)c.fillRect(x+3+rnd()*(w-10),y+3+rnd()*(h-8),5+rnd()*6,2);
      /* 양측 난간 보 + 기둥 */
      c.fillStyle="#7a4e1d";
      if(vert){c.fillRect(x,y,4,h);c.fillRect(x+w-4,y,4,h);}
      else{c.fillRect(x,y,w,4);c.fillRect(x,y+h-4,w,4);}
      c.fillStyle="#5d3a13";
      if(vert){for(let yy=y+2;yy<y+h-4;yy+=14){c.fillRect(x-1.5,yy,7,5);c.fillRect(x+w-5.5,yy,7,5);}}
      else{for(let xx=x+2;xx<x+w-4;xx+=14){c.fillRect(xx,y-1.5,5,7);c.fillRect(xx,y+h-5.5,5,7);}}
      /* 외곽선 */
      c.strokeStyle="rgba(60,35,10,.85)"; c.lineWidth=2;
      c.strokeRect(x+1,y+1,w-2,h-2);
    });
  });
  /* 가스 타일 */
  BAL.GAS_ZONES.forEach(([gx,gy])=>{
    c.fillStyle="rgba(160,90,220,.28)";
    c.fillRect(gx*TILE,gy*TILE,2*TILE,2*TILE);
    c.strokeStyle="rgba(120,50,180,.7)";c.lineWidth=2;
    c.strokeRect(gx*TILE+2,gy*TILE+2,2*TILE-4,2*TILE-4);
    /* 크리스탈 */
    const cx=(gx+1)*TILE,cy=(gy+1)*TILE;
    c.fillStyle="#c86bfa";
    c.beginPath();c.moveTo(cx,cy-12);c.lineTo(cx+9,cy);c.lineTo(cx,cy+12);c.lineTo(cx-9,cy);c.closePath();c.fill();
    c.strokeStyle="#2e2a33";c.lineWidth=1.6;c.stroke();
    c.fillStyle="#e8b3ff";c.beginPath();c.moveTo(cx,cy-8);c.lineTo(cx+5,cy-1);c.lineTo(cx,cy+2);c.closePath();c.fill();
  });
  c.strokeStyle="rgba(40,85,15,.6)";c.lineWidth=6;c.strokeRect(3,3,W-6,H-6);
}

/* --- 메인 draw --- */
/* 뷰 미러 (2026-09-07): 게스트(enemy 진영)는 화면을 세로로만 뒤집어(scale 1,-1) 자기 본진을 아래로.
   위치만 상하 미러 — 좌우는 유지. 스프라이트·글자는 upr()로 세로 재반전해 모양은 똑바로.
   시뮬 좌표는 그대로(결정론 불변) */
function viewFlip(){return MYSIDE==="enemy";}
function upr(x,y,fn){ if(!viewFlip()){fn();return;} ctx.save();ctx.translate(x,y);ctx.scale(1,-1);ctx.translate(-x,-y);fn();ctx.restore(); }
/* 화면 좌표 → 시뮬 좌표 (입력 보정): 세로만 반전 */
function unflipPt(x,y){ return viewFlip()?{x:x,y:H-y}:{x,y}; }
function draw(){
  ctx.save();
  if(S.shake>0.3)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  if(viewFlip()){ctx.translate(0,H);ctx.scale(1,-1);}   // 게스트 화면 상하 반전 (위치만)
  if(!bgCache)buildBG();
  ctx.drawImage(bgCache,0,0);
  /* 드래그 중: 영역 표시 */
  if(S.sel){
    for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
      const fz=inFriendlyZone(tx,ty,MYSIDE), ex=inEnemyExclusion(tx,ty,MYSIDE);
      if(S.sel.type==="build"){
        if(fz&&!ex){ctx.fillStyle="rgba(120,200,255,.13)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
        if(ex&&fz){ctx.fillStyle="rgba(255,80,80,.14)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
      } else if(fz){ctx.fillStyle="rgba(140,255,160,.12)";ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);}
    }
  }
  /* 건물 (y 정렬 — 아래쪽 건물이 위쪽 건물의 솟은 부분을 가리도록) */
  [...S.buildings].sort((a,b)=>(a.ty+a.h)-(b.ty+b.h)).forEach(b=>{
    const px=b.tx*TILE,py=b.ty*TILE,pw=b.w*TILE,ph=b.h*TILE;
    if(b.hp<=0){ /* 잔해 — 6초에 걸쳐 페이드 아웃 후 제거 */
      ctx.globalAlpha=Math.max(0,Math.min(1,(b.rubbleT===undefined?1:b.rubbleT/6)));
      ctx.fillStyle="#9a978a";
      ctx.beginPath();ctx.ellipse(b.cx,b.cy,pw*0.3,ph*0.2,0,0,7);ctx.fill();po(1.6);
      ctx.fillStyle="#b5b2a4";ctx.beginPath();ctx.arc(b.cx-8,b.cy-4,7,0,7);ctx.fill();po(1.2);
      ctx.globalAlpha=1;
      return;}
    upr(b.cx,b.cy,()=>drawBuildingSprite(b.key,b.level,px,py,pw,ph,b.side,effTier(b.side)));   // 위치는 미러, 모양은 정방향
    if(S.selBld===b){ctx.strokeStyle="rgba(255,210,80,.95)";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
      ctx.strokeRect(px+1,py+1,pw-2,ph-2);ctx.setLineDash([]);
      const d=BAL.BUILDINGS[b.key];
      const atkRng=d.atk?d.atk.rng:(d.hAtk?hallAtkRng():0);
      if(atkRng){ctx.strokeStyle="rgba(255,120,80,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.cx,b.cy,atkRng*TILE,0,7);ctx.stroke();}
    }
    if(b.flash>0){ctx.fillStyle="rgba(255,255,255,"+Math.min(0.7,b.flash*5).toFixed(2)+")";
      roundRectPath(px+2,py+2,pw-4,ph-4,6);ctx.fill();}
    if(b.hp<b.maxHp)upr(b.cx,py-8,()=>drawHpBar(b.cx,py-8,b.hp,b.maxHp,Math.min(50,pw-8),b.side));
    /* 행동 가능 뱃지 (맥동): ↑ = 레벨업/승급 가능, ➔ = 변형 가능 */
    if(b.side===MYSIDE&&!S.over){
      const canUp=b.key==="hall"?canTierUpP():canUpgradeB(b);
      const tf=canTransformB(b);
      if(canUp||tf){
        const pulse=1+Math.sin(S.elapsed*5)*0.15;
        let bxp=px+pw-8;
        const badge=(glyph,col)=>{ upr(bxp,py+8,()=>{
          ctx.save();ctx.translate(bxp,py+8);ctx.scale(pulse,pulse);
          ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
          ctx.strokeStyle=OUTLINE;ctx.lineWidth=1.6;ctx.stroke();
          ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";
          ctx.fillText(glyph,0,4);
          ctx.restore();}); bxp-=19;};
        if(tf)badge("➔","#e09c2e");
        if(canUp)badge("↑","#3fae5a");
      }
    }
  });
  /* 유닛 (y 정렬) */
  [...S.units].sort((a,b)=>a.y-b.y).forEach(u=>{
    const team=(u.side===MYSIDE);   // 색은 내 편 기준 (내 편=파랑)
    const hover=u.air?Math.sin((u.animT||0)*0.8)*2-10:0;
    const dropY=u.deploy>0?-u.deploy*90:0;
    const bob=u.air?0:(u.moving?Math.sin(u.animT)*1.6:Math.sin(u.animT*0.35)*0.6);
    unitShadow(u.x,u.y+u.r*0.75,u.r*0.9*(u.deploy>0?0.5:1));
    ctx.strokeStyle=team?"rgba(60,130,255,.5)":"rgba(255,80,60,.5)";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*0.75,u.r*0.9,u.r*0.38,0,0,7);ctx.stroke();
    upr(u.x,u.y+bob+hover+dropY,()=>{   // 위치는 미러, 모양은 정방향
      ctx.save();
      ctx.globalAlpha=u.deploy>0?0.85:1;
      ctx.translate(u.x,u.y+bob+hover+dropY);
      if(u.moving&&!u.air)ctx.rotate(Math.sin(u.animT)*0.05);
      drawUnitSprite(u,team);   // 8방향 인지 렌더 (시트 등록 시 자동 전환)
      ctx.restore();
      ctx.globalAlpha=1;
    });
    if(u.hero){ /* 영웅 표식 + 오라 범위 */
      const sy=u.y-u.r-8+dropY+hover;
      upr(u.x,sy,()=>{ctx.fillStyle="#ffd24d";ctx.font="bold "+Math.round(u.r*0.9)+"px sans-serif";ctx.textAlign="center";ctx.fillText("★",u.x,sy);});
      if(u.aura||u.heal){ctx.strokeStyle=u.heal?"rgba(140,255,160,.35)":"rgba(255,210,80,.3)";ctx.lineWidth=1.5;
        ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(u.x,u.y,BAL.AURA_R*TILE,0,7);ctx.stroke();ctx.setLineDash([]);}
    }
    if(u.flash>0){ctx.fillStyle="rgba(255,255,255,"+Math.min(0.75,u.flash*5).toFixed(2)+")";
      ctx.beginPath();ctx.arc(u.x,u.y+dropY+hover,u.r*1.05,0,7);ctx.fill();}
    if(u.bAtk>1){   // 오라 버프 표시: 맥동 이중 링 + 회전 호 + 상승 반짝이
      const pl=1+Math.sin(S.elapsed*6)*0.12;
      ctx.strokeStyle="rgba(255,210,80,.9)";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(u.x,u.y+hover,(u.r+3)*pl,0,7);ctx.stroke();
      ctx.strokeStyle="rgba(255,240,160,.55)";ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(u.x,u.y+hover,(u.r+6.5)*pl,S.elapsed*2.5,S.elapsed*2.5+4);ctx.stroke();
      if(Math.random()<0.05)addP({x:u.x+(Math.random()-.5)*u.r*1.6,y:u.y+hover+u.r*0.3,
        vx:0,vy:-24,g:-8,t:0,life:0.6,size:1.8,col:"255,220,110"});
    }
    if(u.level>1){   // 유닛 레벨 표시 (Lv2+)
      const lx=u.x+u.r*0.6, ly=u.y-u.r*0.5+hover+dropY;
      upr(lx,ly,()=>{ctx.fillStyle="#ffd24d";ctx.font="bold 10px sans-serif";ctx.textAlign="left";
        ctx.strokeStyle="rgba(30,25,15,.9)";ctx.lineWidth=2.5;
        ctx.strokeText("L"+u.level,lx,ly);ctx.fillText("L"+u.level,lx,ly);});
    }
    if(u.hp<u.maxHp){const hy=u.y-u.r-13+dropY+hover;upr(u.x,hy,()=>drawHpBar(u.x,hy,u.hp,u.maxHp,u.hero?36:26,u.side));}
  });
  /* 이펙트 */
  S.effects.forEach(f=>{
    if(f.tp==="boom"){const p=1-Math.max(0,f.t)/f.t0;
      ctx.fillStyle="rgba("+f.col+","+(0.3*(1-p)).toFixed(3)+")";
      ctx.beginPath();ctx.arc(f.x,f.y,f.rad*p,0,7);ctx.fill();
      ctx.strokeStyle="rgba("+f.col+","+(0.9*(1-p)).toFixed(3)+")";ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(f.x,f.y,f.rad*p,0,7);ctx.stroke();}
    else if(f.tp==="hit"){const a=Math.max(0,f.t/0.18);
      ctx.fillStyle="rgba(255,245,150,"+(0.85*a).toFixed(2)+")";
      ctx.beginPath();
      for(let i=0;i<8;i++){const ang=i*Math.PI/4+f.t*8,rr=i%2?3:9;
        ctx[i?"lineTo":"moveTo"](f.x+Math.cos(ang)*rr,f.y+Math.sin(ang)*rr);}
      ctx.closePath();ctx.fill();}
    else if(f.tp==="bullet"){const p=1-Math.max(0,f.t)/f.t0;
      const bx=f.x1+(f.x2-f.x1)*p,by=f.y1+(f.y2-f.y1)*p;
      ctx.strokeStyle="rgba(255,240,180,.85)";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(bx-(f.x2-f.x1)*0.08,by-(f.y2-f.y1)*0.08);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle="#fff8d8";ctx.beginPath();ctx.arc(bx,by,2.5,0,7);ctx.fill();}
    else if(f.tp==="ftext"){const p=1-Math.max(0,f.t)/f.t0;
      const fy=f.y-p*22;
      upr(f.x,fy,()=>{
        ctx.globalAlpha=Math.min(1,(1-p)*2.5);
        ctx.font="bold 13px sans-serif";ctx.textAlign="center";
        ctx.strokeStyle="rgba(30,20,45,.9)";ctx.lineWidth=3;
        ctx.strokeText(f.text,f.x,fy);
        ctx.fillStyle="rgb("+f.col+")";
        ctx.fillText(f.text,f.x,fy);
        ctx.globalAlpha=1;});}
  });
  /* 파티클 */
  S.particles.forEach(p=>{
    const a=Math.max(0,1-p.t/p.life);
    ctx.fillStyle="rgba("+p.col+","+(p.smoke?(a*0.5).toFixed(2):a.toFixed(2))+")";
    if(p.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*6);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);ctx.restore();}
    else if(p.smoke){ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+p.t),0,7);ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+0.5,0,7);ctx.fill();}
  });
  ctx.restore();   // 셰이크 해제 — 아래 배치 미리보기는 흔들리지 않게 (조준 안정)
  ctx.save();
  if(viewFlip()){ctx.translate(0,H);ctx.scale(1,-1);}   // 고스트도 상하 반전 좌표계에서
  /* 드래그 고스트 */
  if(S.sel&&S.mouse){
    if(S.sel.type==="build"){
      const d=BAL.BUILDINGS[S.sel.key];
      const tx=Math.round(S.mouse.x/TILE-d.w/2),ty=Math.round(S.mouse.y/TILE-d.h/2);
      const bad=buildBlockReason(S.sel.key,tx,ty,MYSIDE);
      ctx.globalAlpha=0.65;
      upr((tx+d.w/2)*TILE,(ty+d.h/2)*TILE,()=>drawBuildingSprite(S.sel.key,1,tx*TILE,ty*TILE,d.w*TILE,d.h*TILE,MYSIDE,1));
      ctx.globalAlpha=1;
      ctx.fillStyle=bad?"rgba(255,60,60,.3)":"rgba(120,255,140,.22)";
      ctx.fillRect(tx*TILE,ty*TILE,d.w*TILE,d.h*TILE);
      ctx.strokeStyle=bad?"rgba(255,80,80,.95)":"rgba(140,255,140,.95)";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
      ctx.strokeRect(tx*TILE,ty*TILE,d.w*TILE,d.h*TILE);ctx.setLineDash([]);
      if(d.atk){ctx.strokeStyle="rgba(255,160,80,.6)";ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc((tx+d.w/2)*TILE,(ty+d.h/2)*TILE,d.atk.rng*TILE,0,7);ctx.stroke();}
      if(bad){upr(S.mouse.x,ty*TILE-13,()=>{ctx.fillStyle="rgba(20,24,38,.85)";ctx.font="bold 11px sans-serif";
        const tw=ctx.measureText(bad).width;
        roundRectPath(S.mouse.x-tw/2-6,ty*TILE-22,tw+12,17,4);ctx.fill();
        ctx.fillStyle="#ffb0b0";ctx.textAlign="center";ctx.fillText(bad,S.mouse.x,ty*TILE-9);});}
    } else {
      const key=S.heroSlots[S.sel.slot].key,d=BAL.HEROES[key];
      const bad=heroBlockReason(S.mouse.x,S.mouse.y);
      unitShadow(S.mouse.x,S.mouse.y+d.r*0.75,d.r*0.9);
      upr(S.mouse.x,S.mouse.y,()=>{ctx.save();ctx.globalAlpha=0.6;ctx.translate(S.mouse.x,S.mouse.y);
        const fn=SPRH[key];if(fn)fn(d.r,true,0,null);
        ctx.restore();});
      if(d.aura||d.heal){ctx.strokeStyle="rgba(255,210,80,.5)";ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
        ctx.beginPath();ctx.arc(S.mouse.x,S.mouse.y,BAL.AURA_R*TILE,0,7);ctx.stroke();ctx.setLineDash([]);}
      if(bad){ctx.fillStyle="rgba(255,60,60,.4)";ctx.beginPath();ctx.arc(S.mouse.x,S.mouse.y,d.r*1.15,0,7);ctx.fill();}
    }
  }
  ctx.restore();   // 고스트 반전 해제 — 일시정지 오버레이는 화면 고정
  ctx.save();
  /* 일시 정지 오버레이 */
  if(gameSpeed===0&&!S.over){
    ctx.fillStyle="rgba(10,14,26,.35)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(20,24,38,.85)";roundRectPath(W/2-70,H/2-24,140,48,10);ctx.fill();
    ctx.fillStyle="#ffd27a";ctx.font="bold 18px sans-serif";ctx.textAlign="center";
    ctx.fillText("⏸ 일시 정지",W/2,H/2+7);
  }
  ctx.restore();
}

/* ---------- 밸런스 에디터 ---------- */
function bGet(p){return p.split(".").reduce((o,k)=>o&&o[k],BAL);}
function bSet(p,v){const ks=p.split("."),last=ks.pop();const o=ks.reduce((o,k)=>o[k],BAL);o[last]=v;}
function toggleEditor(){
  if(typeof NET!=="undefined"&&NET.on){toast("실시간 대전 중에는 에디터 사용 불가 (동기화 붕괴 방지)");return;}
  const e=document.getElementById("editor");
  if(e.style.display==="block"){e.style.display="none";}
  else{buildEditorUI();e.style.display="block";}
}
function edPause(){togglePause();}
function edRow(path,label,step){
  const v=bGet(path);
  if(v===undefined)return"";
  return `<div class="ed-row"><label>${label}</label>`
    +`<input type="number" step="${step||"any"}" value="${v}" data-path="${path}"></div>`;
}
/* 스키마 자동 탐색: 엔티티에 숫자 필드가 추가되면 에디터에 자동 노출됨 */
const ED_LABELS={hp:"HP",dmg:"공격력",hs:"공속(초)",rng:"사거리",spd:"이속",splash:"광역 반경",period:"생산 주기(초)",
  cost:"비용",heal:"초당 회복",rad:"광역 반경",castRng:"시전 사거리",targets:"동시 대상",tier:"요구 티어",
  kb:"넉백",slowDur:"둔화(초)",atk:"",hAtk:"본진공격",hDef:"본진 방어(받는 피해 배율)",aoe:"",prod:"",delay:"AI 시작 지연(초)",interval:"AI 판단 주기(초)",
  easy:"쉬움",normal:"보통",hard:"어려움",aiDelay:"AI 지연(초)",aiInterval:"AI 주기(초)",
  maxTier:"최대 티어",maxLevel:"최대 유닛 레벨",gasBases:"가스 기지 목표",prodMax:"생산 건물 목표",
  towerMax:"타워 목표",transform:"변형 사용(0/1)",aviary:"상위 변형 사용(0/1)",defensive:"방어 반응(0/1)",towerTf:"타워 변형 목표",
  extreme:"매우 어려움",aggro:"전진 배치(0/1)",atkTwMin:"최소 공격 타워",heroUse:"영웅 사용(0/1)",
  rangedResist:"원거리 물리 경감(비율)",pierceVsMelee:"근접 관통 추가피해(+)",rangedWeak:"원거리 피해 취약(+)",
  TOWER_VS_BLDG:"타워 대건물 피해 배율",HERO_VS_BLDG:"영웅 대건물 피해 배율"};
const ED_SKIP=new Set(["nm","w","h","panel","gas","r","prereq","transforms","aura","upgCat","cat",
  "air","antiair","melee","unit","test","label","key"]);
function edWalk(obj,basePath,prefix){
  let h="";
  for(const k in obj){
    if(ED_SKIP.has(k))continue;
    const v=obj[k],p=basePath+"."+k;
    const lbl=ED_LABELS[k]!==undefined?ED_LABELS[k]:k;
    if(typeof v==="number")h+=edRow(p,(prefix?prefix+" ":"")+lbl);
    else if(Array.isArray(v))v.forEach((x,i)=>{if(typeof x==="number"&&i>0)h+=edRow(p+"."+i,(prefix?prefix+" ":"")+lbl+" T"+i);});
    else if(v&&typeof v==="object")h+=edWalk(v,p,(prefix?prefix+" ":"")+lbl);
  }
  return h;
}
let edTab="rules";
function buildEditorUI(){
  /* 탭 바 */
  let h=`<div class="ed-tabs">`+[["rules","경제·규칙"],["BUILDINGS","건물"],["UNITS","유닛"],["HEROES","영웅"]]
    .map(([id,nm])=>`<button class="ed-tab${edTab===id?" on":""}" onclick="edTab='${id}';buildEditorUI()">${nm}</button>`).join("")
    +`</div>`;
  if(edTab==="rules"){
    [["ECON.regen","엘릭서 회복 주기(초)"],["ECON.start","시작 엘릭서"],
     ["ECON.cap.1","엘릭서 상한 T1"],["ECON.cap.2","엘릭서 상한 T2"],["ECON.cap.3","엘릭서 상한 T3"],
     ["ECON.gasBonus","가스 기지 보너스"],["ECON.tierStars.2","킵 승급 (★)"],["ECON.tierStars.3","캐슬 승급 (★)"],
     ["ECON.transformStars.1","변형 1티어 (★)"],["ECON.transformStars.2","변형 킵 (★)"],["ECON.transformStars.3","변형 캐슬 (★)"],
     ["ECON.upPerLevel.1","레벨업/레벨 (1티어 건물)"],["ECON.upPerLevel.2","레벨업/레벨 (킵 건물)"],["ECON.upPerLevel.3","레벨업/레벨 (변형 건물)"],
     ["EXCLUDE_R","적 건물 배제 반경"],["HALL_ZONE","본진 영역 반경"],["TOWER_ZONE","타워 영역 반경"],
     ["AURA_R","오라 반경"],["AURA_PWR","오라 배율(+)"],["UPG_PWR","업글 단계당 배율(+)"],
     ["UNIT_CAP","유닛 상한"],["HERO_COST","영웅 코스트"],["HERO_CD","영웅 재소환 쿨다운"],
     ["TOWER_VS_BLDG","타워 대건물 피해 배율"],["HERO_VS_BLDG","영웅 대건물 피해 배율"]]
     .forEach(([p,l])=>h+=edRow(p,l));
    h+=`<div class="ed-sec">난이도 = AI 전략 수준 (현재: ${DIFF_NM[diffKey]})</div>`
      +`<div style="font-size:10.5px;color:var(--sub);margin-bottom:4px;">스탯·자원 규칙은 양측 동일 — 전략 차이로만 난이도가 갈립니다</div>`
      +edWalk(BAL.DIFF,"DIFF","");
  } else {
    /* 스키마 자동 탐색 — 엔티티·수치 필드 추가 시 자동 반영 */
    Object.keys(BAL[edTab]).forEach(k=>{
      h+=`<div class="ed-sub">${BAL[edTab][k].nm||k}</div>`+edWalk(BAL[edTab][k],`${edTab}.${k}`,"");
    });
  }
  const body=document.getElementById("ed-body");
  body.innerHTML=h;
  body.querySelectorAll("input[data-path]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const v=parseFloat(inp.value);
      if(isNaN(v)){inp.value=bGet(inp.dataset.path);return;}
      const p=inp.dataset.path;
      /* 건물 HP는 기존 건물에도 비율 유지로 즉시 반영 */
      const m=p.match(/^BUILDINGS\.(\w+)\.hp$/);
      if(m){const old=bGet(p);bSet(p,v);
        S.buildings.forEach(b=>{if(b.key===m[1]&&b.hp>0){b.hp=b.hp/old*v;b.maxHp=v;}});}
      else bSet(p,v);
      renderPanel();
    });
  });
}

function applyMap(id,layout){

  BAL.ROADS=lay.roads; BAL.ROAD=lay.roads[0]; BAL.GAS_ZONES=lay.gas; BAL.FEATS=lay.feat||[];

/* --- 스테이지별 레벨 디자인 (2026-09-05): 왕국 비주얼 테마는 유지, 길·가스 배치를 단계마다 변형.
   대칭 의무 없음 — 다양성 우선 (PvE 스테이지, 2026-09-05 방침). 길 사각형을 여러 개 조합해

  else if(cfg.diff)diffKey=cfg.diff;

  MYSIDE=cfg.mySide||"player";
  simSeed=cfg.seed!==undefined?cfg.seed:(((Math.random()*1e9)|0)||1);
  RNG=mulberry(simSeed);
  simTick=0; simAcc=0;
  REPLAY=!!cfg.replayCmds;
  CMD_LOG=REPLAY?cfg.replayCmds.map(c=>({...c})):[];
  PENDING=REPLAY?cfg.replayCmds.map(c=>({...c})):[];
  newGame();

  if(cfg.tip)toast(cfg.tip);
}

/* ---------- NET: 릴레이 락스텝 (1단계) ----------
   라운드 = 3틱(10Hz). 라운드 R에 발행한 커맨드는 양쪽 모두 라운드 R+2의 첫 틱에 실행 (~200ms 지연).
   다음 라운드로 넘어가려면 상대의 (R-2) 라운드 패킷 수신이 필요 — 어긋남 없는 완전 동기. */
const NET=(()=>{
  const ROUND=3, DELAY=2;
  let ws=null, on=false, roundCmds=[], oppRounds={}, sentRound=-1;
  let netT0=0, pumpTimer=null;   // 절대 시간 페이싱 + 백그라운드 탭용 타이머 펌프
  let hashAt={}, desync=false, myVerdict=null, oppVerdict=null, shutTimer=null, graceTimer=null;   // 디싱크 감지 + 결과 교차검증
  function connectAndQueue(url){
    shutdown();
    let sock;
    try{sock=new WebSocket(url);}catch(e){pvpStatus("주소 형식 오류 (ws:// 또는 wss://)",false);return;}
    ws=sock;
    pvpStatus("서버 연결 중...",true);
    ws.onopen=()=>{ws.send(JSON.stringify({type:"queue"}));pvpStatus("상대를 찾는 중...",true);};
    ws.onerror=()=>pvpStatus("연결 실패 — 서버 주소·상태를 확인하세요",false);
    ws.onclose=()=>{if(on)netEnd("연결이 끊어졌습니다",null);};
    ws.onmessage=ev=>{
      let d; try{d=JSON.parse(ev.data);}catch(e){return;}
      if(d.type==="waiting")pvpStatus("상대 대기 중... 창을 유지하세요",true);
      else if(d.type==="start")startNet(d);
      else if(d.type==="round"){
        if(oppRounds[d.r]===undefined){
          oppRounds[d.r]=true;
          /* 상대 커맨드: 라운드 r 공식으로 실행 틱 확정 (발행측과 동일 — 디싱크 방지) */
          (d.cmds||[]).forEach(c=>{const cc={...c,tick:(d.r+DELAY)*ROUND+1};PENDING.push(cc);CMD_LOG.push(cc);});
          /* 디싱크 감지: 상대가 실은 과거 틱 해시를 내 것과 대조 (양쪽 모두 실행 완료한 틱) */
          if(d.h!==undefined&&!desync){
            const ct=(d.r-DELAY)*ROUND;
            if(ct>0&&hashAt[ct]!==undefined&&hashAt[ct]!==d.h){
              desync=true; console.warn("desync @tick",ct,"me",hashAt[ct],"opp",d.h);
              toast("⚠ 동기화 오류 감지됨");
            }
          }
        }
        pump();   // 백그라운드 탭(rAF 정지)도 상대 라운드 수신으로 전진 — 크롬 탭 스로틀 대응 (2026-09-07)
      }
      else if(d.type==="gameover"){
        /* 상대 판정 보관 — 내 게임이 아직 안 끝났으면 여기서 끊지 않는다 (내 판정이 나와야 대조 가능) */
        oppVerdict=d.win;
        checkVerdicts();
        if(myVerdict===null){
          /* 나는 아직 결과가 없다 — 잠깐 기다렸다가 안 나오면 상대 판정의 반대로 확정 (승자는 파괴를 명확히 안다) */
          if(graceTimer)clearTimeout(graceTimer);
          graceTimer=setTimeout(()=>{ if(myVerdict===null&&on&&S&&!S.over)endGame(!oppVerdict); },1500);
        }
      }
      else if(d.type==="peer_left")netEnd("상대가 떠났습니다",true);
    };
  }
  function startNet(d){
    on=true; roundCmds=[]; oppRounds={}; sentRound=-1;
    hashAt={}; desync=false; myVerdict=null; oppVerdict=null;
    if(shutTimer){clearTimeout(shutTimer);shutTimer=null;}
    if(graceTimer){clearTimeout(graceTimer);graceTimer=null;}
    startGame({mode:"pvp",net:true,seed:d.seed,map:"plain",
      mySide:d.side==="host"?"player":"enemy",
      tip:"⚔ 실시간 대전 — 당신은 "+(d.side==="host"?"아래(파랑)":"위(빨강)")+" 진영입니다"});
    gameSpeed=1; syncPauseUI();
    netT0=performance.now();
    if(pumpTimer)clearInterval(pumpTimer);
    pumpTimer=setInterval(pump,250);   // 백그라운드 탭 폴백 (숨김 탭에서도 ≥1Hz 동작)
    SND.play("hero");
  }
  /* 절대 시간 페이싱: 시작 후 경과 실시간까지만, 락스텝 게이트가 허용하는 만큼 전진.
     rAF 루프·타이머·ws 이벤트 어디서 호출돼도 목표 틱은 하나라 이중 진행이 없다. */
  function pump(){
    if(!on||!S||S.over)return;
    const target=Math.floor((performance.now()-netT0)/(SIM_TICK*1000));
    let guard=0;
    while(simTick<target&&canStep()&&!S.over&&guard++<150){
      stepSim(SIM_TICK); afterTick();
    }
  }
  /* 커맨드 발행: 이번 라운드 버퍼에만 적재. 실제 실행 틱은 라운드 확정(afterTick) 시점에
     발행·수신 공통 공식으로 계산 — 발행 시점 simTick에 의존하지 않아 라운드 경계 클릭도 안전 */
  function issue(cmd){ roundCmds.push(cmd); }
  /* 락스텝 게이트: 다음 틱 simTick+1 이 속한 라운드 r 진행에는 상대 라운드 (r-DELAY) 필요.
     틱 T 는 라운드 floor((T-1)/ROUND) 에 속한다 */
  function canStep(){
    const r=Math.floor(simTick/ROUND);   // 다음 틱 = simTick+1 → 라운드 floor(simTick/ROUND)
    if(r<DELAY)return true;
    return oppRounds[r-DELAY]!==undefined;
  }
  /* 틱 완료 후: 라운드 경계(simTick = (r+1)*ROUND)면 라운드 r 확정 —
     내 커맨드를 (r+DELAY) 라운드 첫 틱에 로컬 예약하고 상대에게 전송 (수신측과 동일 공식) */
  function afterTick(){
    hashAt[simTick]=simHash();
    for(const k in hashAt)if(k<simTick-ROUND*8)delete hashAt[k];   // 오래된 해시 정리
    if(simTick%ROUND!==0)return;
    const r=simTick/ROUND-1;
    if(r<=sentRound)return;
    sentRound=r;
    const cmds=roundCmds; roundCmds=[];
    cmds.forEach(c=>{c.tick=(r+DELAY)*ROUND+1;PENDING.push(c);CMD_LOG.push(c);});   // 로컬 실행 예약
    const ct=(r-DELAY)*ROUND;   // 양쪽 모두 실행 완료한 과거 틱의 해시 동봉 (디싱크 감지)
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"round",r,cmds,h:hashAt[ct]}));
  }
  /* 결과 보고: 게임오버 시 내 판정을 상대에게 보내고, 교차검증 위해 잠시 후 연결 종료 */
  function reportResult(win){
    myVerdict=win;
    if(graceTimer){clearTimeout(graceTimer);graceTimer=null;}
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"gameover",win}));
    checkVerdicts();
    if(shutTimer)clearTimeout(shutTimer);
    shutTimer=setTimeout(shutdown,2000);   // 상대 판정 수신 여유
  }
  /* 두 판정이 모두 있으면 대조: 같으면(둘 다 승/패) 모순 → 디싱크 무효 처리 */
  function checkVerdicts(){
    if(myVerdict===null||oppVerdict===null)return;
    if(myVerdict===oppVerdict)showDesyncResult();
  }
  function netEnd(msg,iWin){
    const wasOn=on; on=false;
    toast(msg);
    if(wasOn&&S&&!S.over&&iWin!==null)endGame(!!iWin);
    shutdown();
  }
  function shutdown(){
    on=false;
    if(pumpTimer){clearInterval(pumpTimer);pumpTimer=null;}
    if(shutTimer){clearTimeout(shutTimer);shutTimer=null;}
    if(graceTimer){clearTimeout(graceTimer);graceTimer=null;}
    if(ws){try{ws.onclose=null;ws.close();}catch(e){} ws=null;}
    roundCmds=[]; oppRounds={}; sentRound=-1;
  }
  /* 지연 종료: 상대가 내 마지막 메시지(판정/디싱크)를 받을 시간을 준다 */
  function scheduleShutdown(ms){ if(shutTimer)clearTimeout(shutTimer); shutTimer=setTimeout(shutdown,ms||2000); }
  return {connectAndQueue,issue,canStep,afterTick,pump,reportResult,scheduleShutdown,shutdown,
    get on(){return on;}, get desync(){return desync;}};
})();
/* --- 튜토리얼: 목표 스크립트 --- */
const TUT=(()=>{
  let active=false, idx=0, bonusGiven=false;
  const bar=()=>document.getElementById("tut-bar");
  const cntP=k=>S.buildings.filter(b=>b.side==="player"&&b.hp>0&&b.key===k).length;
  /* 순서 = 실제 게임 흐름: 배럭 → 타워로 영역 확장 → (영역에 들어온) 가스 점유 → 성장 → 영웅 → 공략 */
  const steps=[
    {t:"① 아래 패널에서 <b>배럭</b>을 끌어 본진 근처(아군 영역)에 놓으세요 — 풋맨이 자동으로 생산됩니다",ok:()=>cntP("barracks")>=1},
    {t:"② <b>타워</b>를 좌우 <b>◆ 가스 지역</b> 방향에 건설하세요 — 타워 주변이 아군 영역이 되어 전선이 늘어납니다",ok:()=>cntP("tower")+cntP("guardTower")+cntP("arcaneTower")>=1},
    {t:"③ 영역에 들어온 <b>◆ 가스 지역</b>에 <b>엘릭서 기지</b>를 건설하세요 — 엘릭서 회복이 빨라집니다",ok:()=>cntP("elixirBase")>=1},
    {t:"④ <b>본진</b>을 클릭해 <b>킵 승급 (★1)</b> — 엘릭서가 가득 차면 ★이 적립됩니다. 상위 건물·상한·레벨이 열립니다",ok:()=>S.tier>=2},
    {t:"⑤ 배럭을 <b>클릭</b>하고 말풍선에서 <b>레벨업</b> — 이후 생산되는 유닛의 레벨이 올라갑니다 (레벨 상한 = 티어)",ok:()=>S.buildings.some(b=>b.side==="player"&&b.hp>0&&b.key==="barracks"&&b.level>=2)},
    {t:"⑥ <b>⇄ 버튼</b>으로 영웅 탭 전환 후 영웅을 배치하세요 — 비용은 ★ (엘릭서가 가득 차면 적립)",ok:()=>S.units.some(u=>u.side==="player"&&u.hero)},
    {t:"⑦ 마지막! 병력을 이끌고 <b>적 본진</b>을 파괴하세요",ok:()=>false},
  ];
  function start(){active=true;idx=0;bonusGiven=false;render();}
  function stop(){active=false;const b=bar();if(b)b.style.display="none";}
  function render(){const b=bar();if(!b)return;b.style.display=active?"block":"none";if(active)b.innerHTML=steps[idx].t;}
  let bonus2=false;
  function update(){
    if(!active||!S||S.over)return;
    if(idx===3&&S.stars<1&&!bonus2){bonus2=true;S.stars=1;toast("(튜토리얼) 승급용 엘릭서 스타 ★1 지급");renderPanel();}
    if(idx===5&&S.stars<1&&!bonusGiven){bonusGiven=true;S.stars=1;toast("(튜토리얼) 엘릭서 스타 ★1 지급");renderPanel();}
    if(steps[idx].ok()){idx=Math.min(idx+1,steps.length-1);SND.play("star");render();}
  }
  return {start,stop,update,get active(){return active;}};
})();

/* ---------- 시작 ---------- */
diffKey=store.getItem("rs2_diff")||"normal";
buildIcons();
newGame();
gameSpeed=0;   // 로비에서 시작 — 모드 선택 시 startGame()이 진행시킴
syncDiffUI();
showScr("lobby"); syncLobby();
rafId=requestAnimationFrame(loop);
